      axes.map((a, i) => { const unitHead = (i === 0 || axes[i - 1].unit !== a.unit) ? '<div class="unit-head"><span class="unit-no">' + h(Content.unitKicker(a.unit) || 'محاور إضافية') + '</span><h3>' + h(Content.unitName(a.unit) || 'محاور أُضيفت للبرنامج') + '</h3></div>' : ''; const exs = Content.exercisesOf(a.id).length; const done = Me.isReg() && exs ? Content.exercisesOf(a.id).filter(e => Progress.exDone(e, Me.uid())).length : 0; return unitHead + '<button class="axis-card ' + (a._disabled ? 'disabled' : '') + '" data-act="open-axis" data-id="' + h(a.id) + '">' + (a._disabled ? '<span class="soon-badge">قريبًا</span>' : '') + axisArt(a) + '<span class="axis-no">' + h(Content.unitName(a.unit) || 'محور إضافي') + '</span><div class="axis-body"><div class="axis-title">' + h(a.title) + '</div>' + (a.classic ? '<div class="axis-classic">' + h(a.classic) + '</div>' : '') + '<div class="axis-desc">' + richHtml(a.desc) + '</div><div class="axis-meta"><span class="pill">🎞️ <span class="num">' + a.slides.length + '</span> شريحة</span><span class="pill">✍️ <span class="num">' + exs + '</span> تمرين</span>' + (a.duration ? '<span class="pill">⏱ ' + h(a.duration) + '</span>' : '') + (done ? '<span class="pill ok-pill">✔ <span class="num">' + done + '/' + exs + '</span></span>' : '') + '</div></div></button>'; }).join('') + '</div></section>';
  }
  if (k === 'lab') { const L = Content.lab(); if (!L.stages.length) return ''; return '<section class="section"><div class="lab-banner" data-go="lab"><div class="lab-ico">🧪</div><div class="grow"><div class="sec-kicker" style="color:#D9A62E">' + h(sec.kicker || '') + ' · <span class="num">' + (L.stages.length * L.minutes) + '</span> دقيقة</div><h3>' + h(sec.title || L.title) + '</h3><p><span class="num">' + L.stages.length + '</span> مراحل بمؤقّت حي لكل مجموعة، تجمع كل محاور البرنامج في خطة نمو واحدة.</p></div><span class="btn btn-primary">ادخل المختبر ←</span></div></section>'; }
  if (k === 'survey') { const survey = Content.survey(); if (!survey) return ''; return '<section class="section">' + secHead(sec) + '<button class="act-card" style="width:100%" data-go="ex" data-id="' + h(survey.id) + '"><div class="act-ico">' + h(survey.icon || '💬') + '</div><div><h3>' + h(survey.title) + '</h3><div class="muted" style="font-family:var(--f-ui);font-size:14px">' + h(stripHtml(survey.task)) + '</div></div></button></section>'; }
  // الأقسام المخصّصة
  let body = '';
  if (sec.type === 'video') { const em = toEmbed(sec.videoUrl); body = em ? '<div class="video-box"><iframe src="' + h(em) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>' : (sec.videoUrl ? '<a class="btn btn-soft" href="' + h(sec.videoUrl) + '" target="_blank" rel="noopener">' + iconSvg('play', 16) + ' مشاهدة الفيديو</a>' : ''); }

  return '<section class="section">' + secHead(sec) + '<div class="card pad custom-sec custom-' + h(sec.type || 'text') + '">' + body + '</div></section>';
}

function trainerNoteHtml(a, i) { const sl = a.slides[i] || {}; return '<div class="tn-head">🎤 ملاحظات المدرب <span class="muted">(تظهر للأدمن فقط) · الشريحة <span class="num">' + (i + 1) + '</span></span></div><div class="tn-body">' + (sl.note ? h(sl.note) : '<span class="muted">لا توجد ملاحظة لهذه الشريحة — أضفها من تعديل المحور.</span>') + '</div>' + (a.outcome ? '<div class="tn-out">🎯 مخرج المحور: ' + h(a.outcome) + '</div>' : ''); }
const Deck = {
  move(id, d) { const a = Content.axis(id); if (!a) return; const n = a.slides.length; Deck.to(id, Math.max(0, Math.min(n - 1, (UIState.deck[id] || 0) + d))); },
  to(id, i) {
    UIState.deck[id] = i; const deck = $('[data-deck="' + id + '"]'); if (!deck) return; const n = $$('.slide', deck).length;

// التنقل بلوحة المفاتيح وبأجهزة المؤشر (Presenter / Clicker) التي ترسل PageDown/PageUp عادةً، وبعضها أسهمًا أو مسافة.
// الأسهم الأفقية تتبع اتجاه القراءة العربي (← التالي، → السابق)، وB أو النقطة تُعتم الشاشة كما في العروض التقديمية.
const DECK_KEYS = { PageDown: 1, ArrowDown: 1, ArrowLeft: 1, ' ': 1, Enter: 1, PageUp: -1, ArrowUp: -1, ArrowRight: -1, Backspace: -1 };
document.addEventListener('keydown', e => {
  if (Router.cur.view !== 'axis' || e.ctrlKey || e.metaKey || e.altKey || $('.modal-back')) return;
  const t = e.target || {}; if (/INPUT|TEXTAREA|SELECT/.test(t.tagName || '') || t.isContentEditable) return;
  const blk = $('#blackout');
  if (blk) { e.preventDefault(); blk.remove(); return; }
  if (/^[bB.,ذز]$/.test(e.key)) { e.preventDefault(); document.body.insertAdjacentHTML('beforeend', '<div id="blackout"></div>'); return; }
  let d = DECK_KEYS[e.key]; if (!d) return;
  if ((e.key === ' ' || e.key === 'Enter') && /BUTTON|A/.test(t.tagName || '')) return;
  if (e.shiftKey && e.key === ' ') d = -1;
  e.preventDefault();
  const deck = $('[data-deck="' + Router.cur.id + '"]'); if (!deck) return;
  Deck.move(Router.cur.id, d);
  const r = deck.getBoundingClientRect(); if (r.top < 0 || r.top > innerHeight * 0.35) deck.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

function exColor(e) { const ax = Content.axisOfEx(e.id); const a = ax && Content.axis(ax); return a ? Content.color(a) : (e.kind === 'survey' ? '#C8702A' : '#C8702A'); }
function postKey(e) { if (e.mode === 'group') { const g = Me.group(); return g ? 'g' + g : null; } return Me.uid(); }
function isRevealed(e) { return !!(Store.reveal && Store.reveal[e.id]); }
function bankOf(e) { // بنك كلمات بترتيب ثابت مخلوط حسب معرّف التمرين
  const words = e.items.map(i => i.answer); let s = 0; for (const ch of e.id) s = (s * 33 + ch.charCodeAt(0)) % 100003;
  const out = words.slice(); for (let i = out.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; } return out;
}
const LETTERS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح'];

// ---- عرض الإجابات التفاعلية (للخلاصة والتغذية الحية) ----
function answersSummary(e, answers, reveal, compact) {
  answers = ansList(answers, e.items.length);
  if (e.format === 'mcq' || e.format === 'truefalse') {
    let score = 0;
    const rows = e.items.map((it, i) => {
      const a = answers[i]; const has = a !== undefined && a !== null && a !== '';
      const txt = !has ? '—' : e.format === 'mcq' ? (LETTERS[a] || '') + ') ' + (it.options[a] || '') : (a === true || a === 'true' ? 'صح' : 'خطأ');
      const ok = has && (e.format === 'mcq' ? +a === +it.answer : ((a === true || a === 'true') === !!it.answer)); if (ok) score++;
      const corr = e.format === 'mcq' ? (LETTERS[it.answer] + ') ' + it.options[it.answer]) : (it.answer ? 'صح' : 'خطأ');
      return '<div class="ga-item"><span class="qn num">' + (i + 1) + '</span><span class="' + (reveal && has ? (ok ? 'tag-ok' : 'tag-bad') : '') + '">' + h(txt) + (reveal ? (ok ? ' ✓' : (has ? ' ✗' : '')) : '') + '</span>' + (reveal && !ok ? '<span class="correct-note">(الصحيح: ' + h(corr) + ')</span>' : '') + '</div>';
    });
    return (reveal ? '<div class="pill" style="margin-bottom:4px">النتيجة: ' + score + ' من ' + e.items.length + '</div>' : '') + rows.join('');
  }
  if (e.format === 'fillblank') {
    return e.items.map((it, i) => { const a = answers[i]; const ok = a && a === it.answer; return '<div class="ga-item"><span class="qn num">' + (i + 1) + '</span><span>' + h(it.text).replace('___', '<b class="' + (reveal && a ? (ok ? 'tag-ok' : 'tag-bad') : '') + '">[' + h(a || '—') + ']</b>') + (reveal && !ok ? ' <span class="correct-note">(الصحيح: ' + h(it.answer) + ')</span>' : '') + '</span></div>'; }).join('');
  }
  if (e.format === 'comparePairs') {
    return e.items.map((it, i) => { const a = answers[i]; const ok = a && a === it.answer; const txt = a ? it[a] : '—'; return '<div class="ga-item"><span class="qn num">' + (i + 1) + '</span><div style="flex:1"><div class="cmp-opt compact ' + (reveal && a ? (ok ? 'right' : 'wrong') : (a ? 'sel' : '')) + '"><b>' + (a ? '(' + (a === 'a' ? 'أ' : 'ب') + ')' : '') + '</b>' + h(txt) + '</div>' + (reveal && !ok ? '<div class="correct-note">الصحيح: (' + (it.answer === 'a' ? 'أ' : 'ب') + ') ' + h(it[it.answer]) + '</div>' : '') + '</div></div>'; }).join('');
  }
  return '';
}

// ---- الاختيار من متعدد بأسلوب التصويت: الضغط على الخيار يحفظه فورًا وتظهر نسب الاختيار ----
function mcqStats(e) {
  const ps = Store.posts[e.id] || {}; const st = e.items.map(it => ({ total: 0, counts: it.options.map(() => 0) }));
  Object.keys(ps).forEach(k => { const a = ansList(ps[k] && ps[k].answers, e.items.length); a.forEach((v, i) => { if (v === null || v === '' || !st[i]) return; const n = +v; if (n >= 0 && n < st[i].counts.length) { st[i].counts[n]++; st[i].total++; } }); });
  return st;
}
function mcqPollHtml(e) {
  const reveal = isRevealed(e); const st = mcqStats(e);
  const mine = Me.isReg() ? ansList(((Store.posts[e.id] || {})[Me.uid()] || {}).answers, e.items.length) : [];
  return e.items.map((it, i) => {
    const my = mine[i]; const answered = my !== null && my !== undefined && my !== '';
    const showPct = answered || !Me.isReg() || Admin.ctl();
    return '<div class="q-card"><div class="qt"><span class="qn num">' + (i + 1) + '</span><span>' + h(it.q) + '</span></div><div class="opts">' +
      it.options.map((o, k) => {
        const sel = answered && +my === k; const c = st[i].counts[k]; const pct = st[i].total ? Math.round(c / st[i].total * 100) : 0;
        let cls = sel ? 'sel' : ''; if (reveal) { if (k === +it.answer) cls = 'right'; else if (sel) cls = 'wrong'; }
        return '<button class="opt poll ' + cls + '" data-act="vote" data-ex="' + h(e.id) + '" data-i="' + i + '" data-v="' + k + '" ' + (Me.isReg() ? '' : 'disabled') + '>' +
          (showPct ? '<span class="poll-bar" style="width:' + pct + '%"></span>' : '') +
          '<span class="mk">' + (sel ? '✓' : '') + '</span><span class="grow"><b>' + LETTERS[k] + ')</b> ' + h(o) + '</span>' +
          (showPct ? '<span class="poll-pct num">' + pct + '%</span>' : '') + '</button>';
      }).join('') + '</div>' + (showPct ? '<div class="poll-total">👥 <span class="num">' + st[i].total + '</span> ' + (st[i].total === 1 ? 'مشاركة' : 'مشاركات') + (reveal ? ' · 🔓 الإجابة الصحيحة: ' + LETTERS[it.answer] + ')' : '') + '</div>' : '') + '</div>';
  }).join('');
}

function interactiveHtml(e, post, canAct, editing) {
  const reveal = isRevealed(e); const saved = post ? ansList(post.answers, e.items.length) : null;
  let draft = UIState.draft[e.id];
  if (!draft) { draft = saved ? saved.slice() : e.items.map(() => null); UIState.draft[e.id] = draft; }
  const active = canAct && (editing || !post);

    out += e.items.map((it, i) => {
      const opts = e.format === 'mcq' ? it.options.map((o, k) => [k, o]) : [[true, 'صح'], [false, 'خطأ']];
      return '<div class="q-card"><div class="qt"><span class="qn num">' + (i + 1) + '</span><span>' + h(it.q) + '</span></div><div class="' + (e.format === 'truefalse' ? 'tf-row' : 'opts') + '">' +
        opts.map(([v, label], k) => {
          const sel = show[i] !== null && show[i] !== undefined && String(show[i]) === String(v);
          let cls = sel ? 'sel' : '';
          if (reveal && !active && post) { const correct = e.format === 'mcq' ? k === +it.answer : v === !!it.answer; if (correct) cls = 'right'; else if (sel) cls = 'wrong'; }
          return '<button class="opt ' + cls + '" data-act="pick-opt" data-ex="' + h(e.id) + '" data-i="' + i + '" data-v="' + h(String(v)) + '" ' + (active ? '' : 'disabled') + '><span class="mk">' + (sel ? '✓' : '') + '</span><span>' + (e.format === 'mcq' ? '<b>' + LETTERS[k] + ')</b> ' : '') + h(label) + '</span></button>';
        }).join('') + '</div></div>';
    }).join('');
  } else if (e.format === 'fillblank') {
    const bank = bankOf(e); const used = {}; show.forEach(w => { if (w) used[w] = (used[w] || 0) + 1; }); const selW = UIState.fbSel[e.id];
    const usedCount = {};
    out += '<div class="bank">' + bank.map(w => { usedCount[w] = (usedCount[w] || 0) + 1; const isUsed = (used[w] || 0) >= usedCount[w]; return '<button class="chip ' + (isUsed ? 'used' : '') + (selW === w && !isUsed ? ' sel' : '') + '" data-act="fb-word" data-ex="' + h(e.id) + '" data-w="' + h(w) + '" ' + (active && !isUsed ? '' : 'disabled') + '>' + h(w) + '</button>'; }).join('') + '</div>';
    out += e.items.map((it, i) => {

      const blank = '<button class="blank ' + cls + '" data-act="fb-blank" data-ex="' + h(e.id) + '" data-i="' + i + '" ' + (active ? '' : 'disabled') + '>' + (w ? h(w) : '&nbsp;…&nbsp;') + '</button>';
      return '<div class="q-card"><div class="qt"><span class="qn num">' + (i + 1) + '</span><span>' + h(it.text).replace('___', blank) + '</span></div>' + (reveal && !active && post && w && w !== it.answer ? '<div class="correct-note">الصحيح: ' + h(it.answer) + '</div>' : '') + '</div>';
    }).join('');
  } else if (e.format === 'comparePairs') {
    out += e.items.map((it, i) => '<div class="q-card"><div class="qt"><span class="qn num">' + (i + 1) + '</span><span>أي العبارتين أدق؟</span></div><div class="cmp-row">' +
      ['a', 'b'].map(k => { const sel = show[i] === k; let cls = sel ? 'sel' : ''; if (reveal && !active && post) { if (k === it.answer) cls = 'right'; else if (sel) cls = 'wrong'; } return '<button class="cmp-opt ' + cls + '" data-act="pick-cmp" data-ex="' + h(e.id) + '" data-i="' + i + '" data-v="' + k + '" ' + (active ? '' : 'disabled') + '><b>(' + (k === 'a' ? 'أ' : 'ب') + ')</b>' + h(it[k]) + '</button>'; }).join('') + '</div></div>').join('');

      pr.axes.map(x => { const ok = x.pct >= BADGE_THRESHOLD; return '<div class="badge ' + (ok ? '' : 'locked') + '">' + (ok ? '' : '<span class="lock">🔒</span>') + medalSvg(x.a) + '<h5>' + h(x.a.title) + '</h5><div class="pct num">' + Math.round(x.pct * 100) + '% · ' + x.done + ' من ' + x.total + '</div></div>'; }).join('') + '</div></section>';

    if (!Attend.eligible(me.uid)) out += '<div class="card pad center"><div style="font-size:44px;filter:grayscale(1);opacity:.5">🎓</div><h3>نسبة حضورك الحالية <span class="num">' + att + '%</span></h3><p class="muted" style="font-family:var(--f-ui)">يسجّل المدرّب الحضور في كل يوم تدريبي (<span class="num">' + ac.days + '</span> أيام × <span class="num">' + ac.hours + '</span> ساعات). تُفتح الشهادة تلقائيًا عند بلوغ <span class="num">' + ac.threshold + '%</span>.</p><div class="progress" style="max-width:420px;margin:10px auto 0"><i style="width:' + Math.min(100, att / Math.max(1, ac.threshold) * 100) + '%"></i></div></div>';
    else out += '<div class="congrats-card cert-card">' + congratsInner(me.name, 'cert') + '</div><div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="congrats-pdf" data-kind="cert">📥 تحميل الشهادة PDF</button></div><div class="notice">ℹ️ ' + h(cc.notice) + '</div>';
    out += '</section>';
    out += '<section class="section"><div class="sec-head"><h2 class="sec-title">🎉 تهنئة إنجاز</h2></div>';
    if (!unlocked) out += '<div class="card pad center"><div style="font-size:44px;filter:grayscale(1);opacity:.5">🔒</div><h3>تُفتح التهنئة عند إنجاز <span class="num">80%</span> من التمارين</h3><p class="muted" style="font-family:var(--f-ui)">إنجازك الحالي <span class="num">' + pct + '%</span></p><div class="progress" style="max-width:420px;margin:10px auto 0"><i style="width:' + Math.min(100, pct / 0.8) + '%"></i></div></div>';
    else out += '<div class="congrats-card">' + congratsInner(me.name, 'congrats') + '</div><div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="congrats-pdf" data-kind="congrats">📥 تحميل / حفظ كـ PDF</button><button class="btn btn-ghost" data-act="congrats-mail">✉️ إرسال نسخة لبريدي</button></div><div class="notice">⏳ ' + h(c.notice) + '</div>';
    out += '</section>';
    if (pdf.enabled !== false) out += '<section class="section"><div class="card pad row"><div class="grow"><h3>📄 استخراج المحتوى (PDF)</h3><p class="muted" style="font-family:var(--f-ui);font-size:14px">ملف مصمَّم بمقاس A5 يضم كل شرائح البرنامج بأحدث نسخة، جاهز للطباعة.</p></div><button class="btn btn-dark" data-act="content-pdf">📄 استخراج المحتوى (PDF)</button></div></section>';
    return out;
  }
};

      '<div class="mon-grid"><div class="card pad"><h3>المشاركة في المحاور</h3>' + bars(d.axes.map(x => ({ l: x.a.title, v: Math.round(x.rate * 100), t: Math.round(x.rate * 100) + '%' })), 100) + '</div>' +
      '<div class="card pad"><h3>الحضور حسب اليوم</h3>' + bars(d.perDay.map((v, i) => ({ l: 'اليوم ' + (i + 1), v, t: v + '/' + d.uids.length })), Math.max(1, d.uids.length), '#0E7C7B') + '<h3 style="margin-top:14px">قطاعات المشاركين</h3>' + dist(d.sector) + '</div>' +
      '<div class="card pad"><h3>التقييم القبلي مقابل البعدي لكل سؤال</h3>' + d.A.items.map((it, i) => '<div class="mon-q"><span class="num">' + (i + 1) + '</span>' + bars([{ l: 'قبلي', v: d.pq[i] || 0, t: pct(d.pq[i]), c: '#C98A9C' }, { l: 'بعدي', v: d.qq[i] || 0, t: pct(d.qq[i]), c: '#8A1538' }], 100) + '</div>').join('') + '</div>' +
      '<div class="card pad"><h3>الرضا لكل بند</h3>' + bars(d.survey.rates.map((r, i) => ({ l: r, v: d.survey.avgs[i] || 0, t: d.survey.avgs[i] ? d.survey.avgs[i].toFixed(1) : '—' })), 5, '#E0A526') + '<h3 style="margin-top:14px">الاهتمام ببرامج البنك</h3>' + dist(d.byProg) + '</div>' +
      '<div class="card pad"><h3>💡 توصيات آلية</h3>' + (d.recs.length ? '<ul class="mon-recs">' + d.recs.map(r => '<li>' + h(r.ar) + '</li>').join('') + '</ul>' : '<div class="muted">تظهر عند توفر بيانات كافية.</div>') + '</div>' +
      '<div class="card pad"><h3>آخر النشاطات</h3>' + (ev.length ? ev.map(e => '<div class="bell-item"><div class="grow">' + e.html + '<div class="t">' + ago(e.ts) + '</div></div></div>').join('') : '<div class="muted">لا نشاط بعد.</div>') + '</div></div>';
  }
};


/* ===== 06b-sims.js ===== */
// ---------------------------------------------------------------------
// المحاكيات التفاعلية: إعداد متجر، مصمّم صفحة إتمام الشراء، لعبة ميزانية التسويق
// نماذج تعليمية تقريبية مبنية على اتجاهات الدراسات والممارسات، لا توقعات دقيقة.
// ---------------------------------------------------------------------
const SIM_TYPES = { store: 'محاكي إعداد متجر', checkout: 'مصمّم صفحة إتمام الشراء', budget: 'لعبة ميزانية التسويق' };
const QAR = n => Math.round(n).toLocaleString('en-US');

// ================= 1) محاكي إعداد المتجر =================
const STORE_CATS = ['عطور وبخور', 'أزياء وعبايات', 'قهوة وتمور', 'إلكترونيات وإكسسوارات', 'منتجات منزلية', 'مستحضرات عناية'];
const StoreSim = {
  def() { return { step: 0, name: '', cat: STORE_CATS[0], lang: 'both', cur2: true, title: '', price: '', compare: '', sku: '', variants: '', bullets: '', img: 'both', zones: { doha: true }, shipShow: 'late', freeFrom: '', pay: { card: true }, returns: '', privacy: false, domain: false, licence: false, tracking: false, testOrder: false }; },
  checks(s) {
    const bl = String(s.bullets || '').split('\n').map(x => x.trim()).filter(Boolean);
    const pays = Object.keys(s.pay || {}).filter(k => s.pay[k]);
    return [
      { ok: String(s.name).trim().length >= 3, t: 'اسم متجر واضح', tip: 'اسم قصير يسهل تذكره وكتابته.' },
      { ok: s.lang === 'both', t: 'واجهة بالعربية والإنجليزية', tip: 'يخدم العملاء المحليين والمقيمين والزوار.' },
      { ok: String(s.title).trim().length >= 25 && /\d/.test(s.title), t: 'عنوان منتج بمعادلة كاملة (نوع + خاصية + حجم)', tip: 'مثال: «عطر عود طبيعي للرجال، ثبات طويل، 100 مل».' },
      { ok: +s.price > 0, t: 'سعر محدد', tip: 'أدخل السعر بالريال القطري.' },
      { ok: String(s.sku).trim().length >= 3, t: 'رمز SKU فريد', tip: 'رمز ثابت لكل منتج وخيار.' },
      { ok: bl.length >= 3, t: '3 نقاط بيع على الأقل تبدأ بالفائدة', tip: 'سطر لكل نقطة.' },
      { ok: s.img === 'both', t: 'صور بخلفية نظيفة + صور استخدام', tip: 'الأولى للوضوح، والثانية لتخيّل الاستخدام.' },
      { ok: s.shipShow === 'early', t: 'تكلفة الشحن ظاهرة مبكرًا', tip: 'أكبر سبب للتخلي عن السلة هو التكاليف المفاجئة.' },
      { ok: +s.freeFrom > 0, t: 'حد للشحن المجاني', tip: 'يرفع متوسط قيمة الطلب.' },
      { ok: !!(s.pay && s.pay.debit), t: 'بطاقات الخصم المحلية (QPay)', tip: 'شريحة كبيرة من العملاء تعتمد عليها.' },
      { ok: pays.length >= 3, t: '3 وسائل دفع أو أكثر', tip: 'مثل البطاقات والمحافظ الرقمية.' },
      { ok: +s.returns >= 7, t: 'سياسة استرجاع واضحة (7 أيام أو أكثر)', tip: 'تطمئن العميل قبل الشراء.' },
      { ok: !!s.privacy, t: 'سياسة خصوصية منشورة', tip: 'متطلب قانوني وعنصر ثقة.' },
      { ok: !!s.licence && !!s.domain, t: 'رخصة تجارة إلكترونية ونطاق .qa', tip: 'متطلبات رخصة وزارة التجارة والصناعة.' },
      { ok: !!s.tracking, t: 'أدوات التحليل والتتبع مربوطة', tip: 'اربطها قبل أول زيارة.' },
      { ok: !!s.testOrder, t: 'طلب تجريبي كامل ناجح', tip: 'لا تطلق قبل تجربة الرحلة كاملة بنفسك.' }
    ];
  },
  score(s) { const c = StoreSim.checks(s); return Math.round(c.filter(x => x.ok).length / c.length * 100); },
  steps: ['الهوية', 'المنتج', 'الشحن والدفع', 'السياسات والإطلاق'],
  form(s, id, dis) {
    const f = (k, l, extra = '') => '<div class="field"><label>' + l + '</label><input data-keep="sim-' + h(id) + '-' + k + '" data-sim-f="' + k + '" data-ex="' + h(id) + '" value="' + h(s[k] || '') + '" ' + extra + ' ' + dis + '></div>';
    const cb = (path, l) => { const [a, b] = path.split('.'); const v = b ? (s[a] || {})[b] : s[a]; return '<label class="sim-cb"><input type="checkbox" data-sim-f="' + path + '" data-ex="' + h(id) + '" ' + (v ? 'checked' : '') + ' ' + dis + '> ' + l + '</label>'; };
    const sel = (k, opts) => '<select data-sim-f="' + k + '" data-ex="' + h(id) + '" ' + dis + '>' + opts.map(([v, l]) => '<option value="' + h(v) + '" ' + (String(s[k]) === String(v) ? 'selected' : '') + '>' + h(l) + '</option>').join('') + '</select>';
    const st = s.step || 0;
    let out = '<div class="sim-steps">' + StoreSim.steps.map((t, i) => '<button class="sim-step ' + (i === st ? 'on' : i < st ? 'done' : '') + '" data-act="sim-step" data-ex="' + h(id) + '" data-i="' + i + '"><span class="num">' + (i + 1) + '</span>' + t + '</button>').join('') + '</div>';
    if (st === 0) out += f('name', 'اسم المتجر', 'placeholder="مثال: دار المسك"') + '<div class="grid2"><div class="field"><label>الفئة</label>' + sel('cat', STORE_CATS.map(x => [x, x])) + '</div><div class="field"><label>لغة الواجهة</label>' + sel('lang', [['ar', 'العربية فقط'], ['en', 'الإنجليزية فقط'], ['both', 'العربية والإنجليزية']]) + '</div></div>' + cb('cur2', 'عرض الأسعار بعملات إضافية للعملاء الخليجيين');
    if (st === 1) out += f('title', 'عنوان المنتج', 'placeholder="العلامة — النوع، الخاصية، الحجم"') + '<div class="grid2">' + f('price', 'السعر (ر.ق)', 'type="number" min="0"') + f('compare', 'السعر قبل الخصم (اختياري)', 'type="number" min="0"') + f('sku', 'رمز المنتج SKU', 'placeholder="MSK-OUD-100"') + f('variants', 'الخيارات (اختياري)', 'placeholder="50 مل، 100 مل"') + '</div><div class="field"><label>نقاط البيع (سطر لكل نقطة، ابدأ بالفائدة)</label><textarea data-keep="sim-' + h(id) + '-bullets" data-sim-f="bullets" data-ex="' + h(id) + '" rows="4" ' + dis + '>' + h(s.bullets || '') + '</textarea></div><div class="field"><label>أسلوب الصور</label>' + sel('img', [['clean', 'خلفية نظيفة فقط'], ['life', 'صور استخدام فقط'], ['both', 'خلفية نظيفة + صور استخدام']]) + '</div>';
    if (st === 2) out += '<div class="field"><label>مناطق التوصيل</label><div class="sim-cbs">' + cb('zones.doha', 'الدوحة') + cb('zones.qatar', 'باقي مناطق قطر') + cb('zones.gcc', 'دول الخليج') + '</div></div><div class="grid2"><div class="field"><label>متى تظهر تكلفة الشحن؟</label>' + sel('shipShow', [['early', 'في صفحة المنتج والسلة'], ['late', 'في آخر خطوة من الدفع']]) + '</div>' + f('freeFrom', 'شحن مجاني للطلبات فوق (ر.ق)', 'type="number" min="0"') + '</div><div class="field"><label>وسائل الدفع</label><div class="sim-cbs">' + cb('pay.debit', 'بطاقات الخصم المحلية (QPay)') + cb('pay.card', 'بطاقات الائتمان') + cb('pay.wallet', 'Apple Pay / Google Pay') + cb('pay.cod', 'الدفع عند الاستلام') + cb('pay.bnpl', 'التقسيط') + '</div></div>';
    if (st === 3) out += '<div class="grid2">' + f('returns', 'مدة الاسترجاع (أيام)', 'type="number" min="0"') + '</div><div class="sim-cbs col">' + cb('privacy', 'نشرت سياسة الخصوصية والشروط') + cb('licence', 'حصلت على رخصة التجارة الإلكترونية') + cb('domain', 'النطاق ينتهي بـ .qa أو .com.qa') + cb('tracking', 'ربطت أدوات التحليل وبكسل الإعلانات') + cb('testOrder', 'أتممت طلبًا تجريبيًا كاملًا من الجوال والحاسوب') + '</div>';
    out += '<div class="row" style="margin-top:10px"><button class="btn btn-ghost btn-sm" data-act="sim-step" data-ex="' + h(id) + '" data-i="' + Math.max(0, st - 1) + '" ' + (st === 0 ? 'disabled' : '') + '>→ السابق</button><button class="btn btn-soft btn-sm" data-act="sim-step" data-ex="' + h(id) + '" data-i="' + Math.min(3, st + 1) + '" ' + (st === 3 ? 'disabled' : '') + '>التالي ←</button></div>';
    return out;
  },
  live(s) {
    const sc = StoreSim.score(s); const c = StoreSim.checks(s); const bl = String(s.bullets || '').split('\n').map(x => x.trim()).filter(Boolean);
    const pays = [['debit', 'QPay'], ['card', 'VISA'], ['wallet', 'Apple Pay'], ['cod', 'COD'], ['bnpl', 'تقسيط']].filter(([k]) => (s.pay || {})[k]);
    const preview = '<div class="pp-mock"><div class="pp-top"><b>' + h(s.name || 'اسم المتجر') + '</b><span>' + (s.lang === 'both' ? 'ع | EN' : s.lang === 'en' ? 'EN' : 'ع') + (s.cur2 ? ' · QAR ▾' : '') + '</span></div>' +
      '<div class="pp-img ' + h(s.img) + '">' + (s.img !== 'clean' ? '<span class="pp-life">📸 صورة استخدام</span>' : '') + '<span class="pp-prod">🧴</span></div>' +
      '<div class="pp-body"><div class="pp-title">' + h(s.title || 'عنوان المنتج') + '</div><div class="pp-price"><b class="num">' + (s.price ? QAR(s.price) : '—') + ' ر.ق</b>' + (+s.compare > +s.price ? ' <s class="num">' + QAR(s.compare) + '</s>' : '') + '</div>' +

// ================= 2) مصمّم صفحة إتمام الشراء =================
const CHECKOUT_BASE = 42;
const CheckoutSim = {
  def() { return { account: 'forced', fields: 14, ship: 'late', pay: { card: true }, trust: {}, progress: false, autofill: false, summary: false, inlineErr: false, coupon: 'big', upsell: true }; },
  factors(s) {
    const pays = s.pay || {}; const tr = s.trust || {}; const out = [];
    const add = (v, t) => out.push({ v, t });
    add(s.account === 'guest' ? 6 : s.account === 'optional' ? 4 : -8, s.account === 'guest' ? 'الشراء كضيف متاح' : s.account === 'optional' ? 'الحساب اختياري بعد الشراء' : 'إجبار إنشاء حساب');
    add(-Math.max(0, (+s.fields || 0) - 7) * 1.2, 'عدد الحقول: ' + s.fields);
    add(s.ship === 'early' ? 7 : -9, s.ship === 'early' ? 'تكلفة الشحن ظاهرة مبكرًا' : 'مفاجأة الشحن في آخر خطوة');
    if (pays.debit) add(5, 'بطاقات الخصم المحلية'); else add(-4, 'غياب بطاقات الخصم المحلية');
    if (pays.wallet) add(4, 'المحافظ الرقمية'); if (pays.cod) add(2, 'الدفع عند الاستلام'); if (pays.bnpl) add(1.5, 'التقسيط');
    const trn = ['badges', 'returns', 'contact'].filter(k => tr[k]).length; add(trn * 2.5 - (trn ? 0 : 3), trn ? 'عناصر ثقة (' + trn + ')' : 'لا عناصر ثقة');
    if (s.progress) add(2, 'مؤشر خطوات واضح'); if (s.autofill) add(3, 'إكمال تلقائي للعنوان'); if (s.summary) add(2, 'ملخص الطلب ظاهر'); if (s.inlineErr) add(2.5, 'رسائل خطأ واضحة بجانب الحقل');
    if (s.coupon === 'big') add(-2, 'حقل كوبون بارز يدفع للبحث عن كوبونات'); else add(0.5, 'حقل الكوبون مطوي');
    if (s.upsell) add(-3, 'نافذة عروض منبثقة قبل الدفع');
    return out;
  },
  rate(s) { return Math.max(15, Math.min(88, Math.round(CHECKOUT_BASE + CheckoutSim.factors(s).reduce((a, f) => a + f.v, 0)))); },
  form(s, id, dis) {
    const cb = (path, l) => { const [a, b] = path.split('.'); const v = b ? (s[a] || {})[b] : s[a]; return '<label class="sim-cb"><input type="checkbox" data-sim-f="' + path + '" data-ex="' + h(id) + '" ' + (v ? 'checked' : '') + ' ' + dis + '> ' + l + '</label>'; };
    const rad = (k, opts) => '<div class="sim-seg">' + opts.map(([v, l]) => '<label class="' + (String(s[k]) === v ? 'on' : '') + '"><input type="radio" name="' + h(id + k) + '" data-sim-f="' + k + '" data-ex="' + h(id) + '" value="' + v + '" ' + (String(s[k]) === v ? 'checked' : '') + ' ' + dis + '>' + l + '</label>').join('') + '</div>';
    return '<div class="field"><label>الحساب</label>' + rad('account', [['forced', 'إجباري'], ['optional', 'اختياري بعد الشراء'], ['guest', 'شراء كضيف']]) + '</div>' +
      '<div class="field"><label>عدد الحقول: <b class="num" data-sim-out="fields">' + s.fields + '</b></label><input type="range" min="5" max="18" data-sim-f="fields" data-ex="' + h(id) + '" value="' + s.fields + '" ' + dis + '></div>' +
      '<div class="field"><label>تكلفة الشحن</label>' + rad('ship', [['late', 'في آخر خطوة'], ['early', 'مبكرًا في السلة']]) + '</div>' +
      '<div class="field"><label>وسائل الدفع</label><div class="sim-cbs">' + cb('pay.card', 'بطاقات الائتمان') + cb('pay.debit', 'الخصم المحلي QPay') + cb('pay.wallet', 'Apple/Google Pay') + cb('pay.cod', 'عند الاستلام') + cb('pay.bnpl', 'تقسيط') + '</div></div>' +
      '<div class="field"><label>عناصر الثقة</label><div class="sim-cbs">' + cb('trust.badges', 'شعارات الدفع والحماية') + cb('trust.returns', 'سياسة الاسترجاع') + cb('trust.contact', 'بيانات تواصل') + '</div></div>' +
      '<div class="field"><label>تفاصيل التجربة</label><div class="sim-cbs">' + cb('progress', 'مؤشر خطوات') + cb('autofill', 'إكمال تلقائي للعنوان') + cb('summary', 'ملخص الطلب ظاهر') + cb('inlineErr', 'أخطاء بجانب الحقل') + cb('upsell', 'نافذة عروض قبل الدفع') + '</div></div>' +
      '<div class="field"><label>حقل الكوبون</label>' + rad('coupon', [['big', 'بارز'], ['collapsed', 'مطوي']]) + '</div>';
  },
  live(s) {
    const r = CheckoutSim.rate(s); const fs = CheckoutSim.factors(s).filter(f => f.v).sort((a, b) => b.v - a.v);
    const pays = s.pay || {};
    const mock = '<div class="co-mock">' + (s.progress ? '<div class="co-prog"><span class="on">السلة</span><span class="on">العنوان</span><span>الدفع</span><span>التأكيد</span></div>' : '') +
      (s.account === 'forced' ? '<div class="co-block warn">🔐 أنشئ حسابًا للمتابعة</div>' : '<div class="co-block">👤 ' + (s.account === 'guest' ? 'تابع كضيف' : 'تابع كضيف · أنشئ حسابًا لاحقًا') + '</div>') +
      '<div class="co-fields">' + Array.from({ length: Math.min(+s.fields, 18) }).map((_, i) => '<i style="width:' + (i % 3 ? 46 : 96) + '%"></i>').join('') + '</div>' + (s.autofill ? '<div class="co-note">📍 اقتراح العنوان تلقائيًا</div>' : '') +
      (s.summary ? '<div class="co-block">🧾 المجموع · الشحن <span class="num">' + (s.ship === 'early' ? '15' : '?') + '</span> ر.ق</div>' : '') + (s.ship === 'late' ? '<div class="co-block warn">⚠️ +25 ر.ق شحن</div>' : '') +
      (s.coupon === 'big' ? '<div class="co-block">🏷 أدخل الكوبون ____</div>' : '<div class="co-note">لديك كوبون؟ ▾</div>') +
      '<div class="co-pay">' + [['card', 'VISA'], ['debit', 'QPay'], ['wallet', 'Apple Pay'], ['cod', 'COD'], ['bnpl', 'تقسيط']].filter(([k]) => pays[k]).map(([, l]) => '<span>' + l + '</span>').join('') + '</div>' +
      '<div class="co-btn">ادفع الآن</div>' + (Object.keys(s.trust || {}).some(k => s.trust[k]) ? '<div class="co-note">🔒 دفع آمن · ↩ استرجاع · ☎ تواصل</div>' : '') + (s.upsell ? '<div class="co-pop">🎁 عرض خاص! لا تفوّت…</div>' : '') + '</div>';
    return '<div class="sim-live"><div class="sim-score"><div class="gauge" style="--p:' + r + '"><b class="num">' + r + '%</b></div><div><b>معدل الإتمام المتوقع</b><div class="muted" style="font-size:13px">من العملاء الذين يبدؤون الدفع · البداية <span class="num">' + CHECKOUT_BASE + '%</span></div></div></div>' + mock +
      '<ul class="sim-factors">' + fs.map(f => '<li class="' + (f.v > 0 ? 'up' : 'down') + '"><span class="num">' + (f.v > 0 ? '+' : '') + (Math.round(f.v * 10) / 10) + '</span>' + h(f.t) + '</li>').join('') + '</ul><div class="muted" style="font-size:12px">نموذج تعليمي تقريبي مبني على اتجاهات دراسات تجربة الدفع (مثل Baymard)، وليس توقعًا دقيقًا لمتجر بعينه.</div></div>';
  },
  summary(s) { return 'معدل إتمام متوقع ' + CheckoutSim.rate(s) + '%'; },
  metric(s) { return CheckoutSim.rate(s); }
};

// ================= 3) لعبة ميزانية التسويق =================
const BUDGET_TOTAL = 10000, BUDGET_AOV = 180, BUDGET_MARGIN = 0.35, BUDGET_REPEAT = 0.4;
const CHANNELS = [
  { k: 'meta', n: 'إعلانات إنستغرام وفيسبوك', cpc: 1.6, cr: 0.014, sat: 6000, newC: 0.85 },
  { k: 'google', n: 'إعلانات بحث وتسوق Google', cpc: 2.4, cr: 0.032, sat: 3500, newC: 0.8 },
  { k: 'tiktok', n: 'تيك توك وسناب شات', cpc: 0.9, cr: 0.008, sat: 5000, newC: 0.95 },
  { k: 'influ', n: 'مؤثرون محليون', cpc: 1.2, cr: 0.012, sat: 3000, newC: 0.9 },
  { k: 'market', n: 'إعلانات السوق الإلكتروني (Noon)', cpc: 1.1, cr: 0.045, sat: 2000, newC: 0.7 },
  { k: 'crm', n: 'رسائل للعملاء الحاليين (بريد/واتساب)', cpc: 0.35, cr: 0.06, sat: 800, newC: 0, cap: 800 },
  { k: 'content', n: 'محتوى وتحسين ظهور', cpc: 3.5, cr: 0.02, sat: 4000, newC: 0.9 }
];
const BudgetSim = {
  def() { const a = {}; CHANNELS.forEach(c => { a[c.k] = 0; }); return { alloc: a }; },
  spent(s) { return CHANNELS.reduce((t, c) => t + (+((s.alloc || {})[c.k]) || 0), 0); },
  calc(s) {
    const rows = CHANNELS.map(c => {
      const b = +((s.alloc || {})[c.k]) || 0; if (!b) return { c, b, clicks: 0, orders: 0, rev: 0, newC: 0 };
      const eff = b / (1 + b / c.sat); // عوائد متناقصة كلما زاد الإنفاق على القناة نفسها
      let clicks = eff / c.cpc; if (c.cap) clicks = Math.min(clicks, c.cap * 1.6);
      const orders = clicks * c.cr; return { c, b, clicks, orders, rev: orders * BUDGET_AOV, newC: orders * c.newC };
    });
    const spend = BudgetSim.spent(s), orders = rows.reduce((t, r) => t + r.orders, 0), rev = rows.reduce((t, r) => t + r.rev, 0), newC = rows.reduce((t, r) => t + r.newC, 0);
    const gross = rev * BUDGET_MARGIN - spend; const cac = newC ? spend / newC : 0; const roas = spend ? rev / spend : 0;
    const clv = BUDGET_AOV * BUDGET_MARGIN * (1 + BUDGET_REPEAT * 6); // قيمة تقريبية للعميل خلال سنة
    const futureValue = newC * clv * 0.5;
    return { rows, spend, orders, rev, newC, gross, cac, roas, clv, futureValue, score: Math.round(gross + futureValue) };
  },
  form(s, id, dis) {
    const sp = BudgetSim.spent(s); const left = BUDGET_TOTAL - sp;
    return '<div class="budget-left ' + (left < 0 ? 'over' : left === 0 ? 'done' : '') + '">المتبقي من الميزانية: <b class="num">' + QAR(left) + '</b> ر.ق من <span class="num">' + QAR(BUDGET_TOTAL) + '</span></div>' +
      CHANNELS.map(c => '<div class="budget-row"><label>' + h(c.n) + ' <b class="num" data-sim-out="alloc.' + c.k + '">' + QAR((s.alloc || {})[c.k] || 0) + '</b></label><input type="range" min="0" max="' + BUDGET_TOTAL + '" step="250" data-sim-f="alloc.' + c.k + '" data-ex="' + h(id) + '" value="' + ((s.alloc || {})[c.k] || 0) + '" ' + dis + '></div>').join('') +
      '<div class="muted" style="font-size:12.5px;margin-top:6px">المنتج: قهوة مختصة · متوسط الطلب <span class="num">' + BUDGET_AOV + '</span> ر.ق · الهامش <span class="num">35%</span> · <span class="num">40%</span> من العملاء يعيدون الشراء شهريًا · قائمة عملاء حاليين <span class="num">800</span> وافقوا على الرسائل.</div>';
  },
  live(s) {
    const r = BudgetSim.calc(s); const mx = Math.max(1, ...r.rows.map(x => x.orders));
    return '<div class="sim-live"><div class="kpi-grid"><div><span>الطلبات</span><b class="num">' + Math.round(r.orders) + '</b></div><div><span>الإيرادات</span><b class="num">' + QAR(r.rev) + '</b></div><div><span>العائد على الإنفاق</span><b class="num">' + r.roas.toFixed(2) + '</b></div><div><span>عملاء جدد</span><b class="num">' + Math.round(r.newC) + '</b></div><div><span>تكلفة الاستحواذ</span><b class="num">' + (r.cac ? QAR(r.cac) : '—') + '</b></div><div><span>ربح الشهر بعد الإعلان</span><b class="num ' + (r.gross < 0 ? 'neg' : '') + '">' + QAR(r.gross) + '</b></div></div>' +
      '<div class="bud-bars">' + r.rows.filter(x => x.b).map(x => '<div class="bud-bar"><span>' + h(x.c.n) + '</span><i style="width:' + (x.orders / mx * 100) + '%"></i><b class="num">' + Math.round(x.orders) + '</b></div>').join('') + '</div>' +
      '<div class="bud-score">🏆 نقاط الفريق = ربح الشهر + نصف قيمة العملاء الجدد خلال سنة = <b class="num">' + QAR(r.score) + '</b></div><div class="muted" style="font-size:12px">نموذج تعليمي مبسط بعوائد متناقصة لكل قناة: مضاعفة الإنفاق على قناة واحدة لا تضاعف نتائجها.</div></div>';
  },
  summary(s) { const r = BudgetSim.calc(s); return 'طلبات ' + Math.round(r.orders) + ' · عائد ' + r.roas.toFixed(2) + ' · نقاط ' + QAR(r.score); },
  metric(s) { return BudgetSim.calc(s).score; }
};

const SIMS = { store: StoreSim, checkout: CheckoutSim, budget: BudgetSim };
const Sims = {
  of(e) { return SIMS[e.sim] || StoreSim; },
  state(e) {

  },
  html(e) {
    const S = Sims.of(e); const col = exColor(e);

      (post ? '<div class="status-note" style="margin-bottom:6px">✅ آخر حفظ: ' + h(post.name || '') + ' · ' + ago(post.ts || 0) + ' — يمكنك التعديل والحفظ مجددًا.</div>' : '') +
      '<div class="sim-grid"><div class="sim-form">' + S.form(s, e.id, dis) + '</div><div id="simLive-' + h(e.id) + '">' + S.live(s) + '</div></div>' +
      '<div class="save-row"><button class="btn btn-primary" data-act="sim-save" data-ex="' + h(e.id) + '" ' + dis + '>💾 حفظ النتيجة' + (e.mode === 'group' ? ' للمجموعة' : '') + '</button><button class="btn btn-ghost btn-sm" data-act="sim-reset" data-ex="' + h(e.id) + '" ' + dis + '>↺ البدء من جديد</button></div></div>';
  },
  refresh(exId) { const e = Content.ex(exId); if (!e) return; const box = document.getElementById('simLive-' + exId); if (box) box.innerHTML = Sims.of(e).live(Sims.state(e)); },
  set(exId, path, val) {
    const e = Content.ex(exId); const s = Sims.state(e); const [a, b] = path.split('.');
    if (b) { s[a] = Object.assign({}, s[a] || {}); s[a][b] = val; } else s[a] = val;
    if (e.sim === 'budget' && a === 'alloc') { // لا يتجاوز مجموع الميزانية 10,000
      const others = BudgetSim.spent(s) - (+s.alloc[b] || 0); if (others + (+val) > BUDGET_TOTAL) s.alloc[b] = Math.max(0, BUDGET_TOTAL - others);
      const inp = document.querySelector('[data-sim-f="alloc.' + b + '"][data-ex="' + CSS.escape(exId) + '"]'); if (inp && +inp.value !== s.alloc[b]) inp.value = s.alloc[b];
      const left = document.querySelector('.budget-left'); if (left) { const l = BUDGET_TOTAL - BudgetSim.spent(s); left.className = 'budget-left ' + (l === 0 ? 'done' : ''); left.querySelector('b').textContent = QAR(l); }
    }
    $$('[data-sim-out="' + path + '"]').forEach(o => { o.textContent = b && a === 'alloc' ? QAR(s.alloc[b]) : val; });
    if (e.sim === 'checkout') $$('.sim-seg label').forEach(l => { const i = l.querySelector('input'); l.classList.toggle('on', i.checked); });
    Sims.refresh(exId);
  },
  feed(e) {
    const S = Sims.of(e); const ps = Store.posts[e.id] || {}; const myKey = Me.isReg() ? postKey(e) : null;
    const keys = Object.keys(ps).filter(k => ps[k] && ps[k].state).sort((a, b) => (S.metric(ps[b].state) - S.metric(ps[a].state)));
    const del = k => Admin.ctl() ? '<button class="del-btn" data-act="del-post" data-ex="' + h(e.id) + '" data-k="' + h(k) + '">🗑</button>' : '';
    if (!keys.length) return '<div class="feed"><div class="feed-head"><span class="live-dot"></span><h3>' + (e.mode === 'group' ? 'مقارنة المجموعات' : 'نتائج الجميع') + '</h3></div><div class="empty">لا توجد نتائج محفوظة بعد.</div></div>';
    if (e.sim === 'budget') {
      return '<div class="feed"><div class="feed-head"><span class="live-dot"></span><h3>🏆 لوحة مقارنة المجموعات</h3><span class="pill num">' + keys.length + '</span></div><div class="table-wrap"><table class="att-table bud-table"><thead><tr><th>#</th><th>المجموعة</th><th>الطلبات</th><th>العائد</th><th>تكلفة الاستحواذ</th><th>الربح</th><th>النقاط</th><th></th></tr></thead><tbody>' +
        keys.map((k, i) => { const r = BudgetSim.calc(ps[k].state); return '<tr class="' + (k === myKey ? 'mine' : '') + '"><td class="num">' + (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1) + '</td><td><b>' + h(Groups.label(+k.slice(1))) + '</b><div class="muted" style="font-size:11.5px">' + CHANNELS.filter(c => +ps[k].state.alloc[c.k]).map(c => c.n.split(' ')[0] + ' ' + QAR(ps[k].state.alloc[c.k])).join(' · ') + '</div></td><td class="num">' + Math.round(r.orders) + '</td><td class="num">' + r.roas.toFixed(2) + '</td><td class="num">' + (r.cac ? QAR(r.cac) : '—') + '</td><td class="num">' + QAR(r.gross) + '</td><td class="num"><b>' + QAR(r.score) + '</b></td><td>' + Likes.btn('posts/' + e.id + '/' + k, ps[k].likes) + del(k) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';

function collectSlides(root) {

    const t = g('type') || old.type; const s = { id: old.id || genId('sl'), type: t, title: g('title').trim() };
    if (t === 'opening' || t === 'summary') { s.text = RTE.val(box, k + 'text'); s.rule = RTE.val(box, k + 'rule'); }
    else if (t === 'principle') { s.intro = RTE.val(box, k + 'intro'); s.points = g('points').split('\n').map(x => x.trim()).filter(Boolean); s.rule = RTE.val(box, k + 'rule'); }

    ['text', 'intro', 'points', 'items', 'rule'].forEach(x => { if (s[x] === undefined && old[x] !== undefined) s[x] = old[x]; });

    if (old.chart) s.chart = old.chart;
    return s;
  });
}

function exFormAfter(root) {
  RTE.mount(root); ImgPick.mount(root);

    const sf = $('#simField', root); if (sf) sf.style.display = f.value === 'sim' ? '' : 'none';
    const mf = $('#modelField', root); if (mf) mf.style.display = f.value === 'text' ? '' : 'none';

async function exFormSave(root, kind) {
  const id = Router.cur.id; const isNew = id === 'new';

  if (kind === 'survey') { data.rates = ($('#svRates', root).value || '').split('\n').map(x => x.trim()).filter(Boolean); data.nps = $('#svNps', root).value.trim(); }
  if (kind !== 'survey') {
    data.format = fmt; data.mode = FORMAT_MODE[fmt] || $('#exMode', root).value;
    data.scenario = RTE.val(root, 'exScenario'); data.hint = RTE.val(root, 'exHint'); data.model = fmt === 'text' ? RTE.val(root, 'exModel') : ''; data.image = ImgPick.val('exImg');
    if ($('#exPrinciple', root)) { data.principle = $('#exPrinciple', root).value.trim(); data.steps = $('#exSteps', root).value.split('\n').map(x => x.trim()).filter(Boolean); data.why = $('#exWhy', root).value.trim(); }
    data.items = fmt === 'text' || fmt === 'sim' ? [] : collectItems(root, fmt).filter(it => it.q || it.text || it.a);
    if (fmt === 'sim') data.sim = $('#exSim', root).value;
    if (fmt !== 'text' && fmt !== 'sim' && !data.items.length) { UI.alert('أضف عنصرًا واحدًا على الأقل للنموذج التفاعلي.'); return; }
    if (fmt === 'fillblank') { const ans = data.items.map(i => i.answer); if (ans.some(x => !x)) { UI.alert('اكتب الكلمة الصحيحة لكل فراغ.'); return; } }
  }
  if (isNew) {
    const nid = 'n' + genId(); data.ts = DB.now();
    if (kind === 'activity') data.kind = 'activity'; else data.axis = Router.cur.axis;
    await DB.set('added/ex/' + nid, data);
  } else if (DEF_EX[id]) await DB.set('content/ex/' + id, data);
  else await DB.set('added/ex/' + id, Object.assign({}, Store.addedEx[id] || {}, data));
  UI.toast('✅ تم الحفظ ونُشر حيًا'); FormState.exId = null;
  const back = Router.backOf(Router.cur); Router.go(back.view, back.id ? { id: back.id } : {});
}

const CDN = {

const PDF_CSS = `

const PDFE = {
  async libs(zip) {
    await loadScript(CDN.h2c); await loadScript(CDN.jspdf); if (zip) await loadScript(CDN.jszip);
    if (!window.html2canvas || !window.jspdf) throw new Error('تعذر تحميل مكتبات PDF');
  },
  host() { let h0 = document.getElementById('pdfHost'); if (!h0) { h0 = document.createElement('div'); h0.id = 'pdfHost'; h0.style.cssText = 'position:fixed;left:-20000px;top:0;z-index:-1;pointer-events:none'; h0.innerHTML = '<style>' + PDF_CSS + '</style>'; document.body.appendChild(h0); } return h0; },
  fit(page) { // تصغير تدريجي لحجم خط الحاوية حتى يتسع المحتوى داخل صفحة واحدة
    $$('.fit', page).forEach(box => { let pct = 100; box.style.fontSize = pct + '%'; while (box.scrollHeight > box.clientHeight + 1 && pct > 58) { pct -= 4; box.style.fontSize = pct + '%'; } });
  },
  // pages: مصفوفة HTML لكل صفحة — size: {w,h (px), mmW, mmH, orientation, format}
  async build(pages, size, progress) {
    await PDFE.libs(); const { jsPDF } = window.jspdf;

    const host = PDFE.host();
    for (let i = 0; i < pages.length; i++) {
      const el = document.createElement('div'); el.className = 'pp'; el.style.width = size.w + 'px'; el.style.height = size.h + 'px';
      el.innerHTML = pages[i]; host.appendChild(el); PDFE.fit(el);
      await document.fonts.ready; // ضروري قبل كل استدعاء لـ html2canvas لتفادي تشوّه الحروف العربية
      const canvas = await window.html2canvas(el, { scale: 1.6, backgroundColor: '#ffffff', useCORS: true, logging: false, ignoreElements: n => n.id === 'app' || (n.classList && n.classList.contains('modal-back')) });
      const img = canvas.toDataURL('image/jpeg', 0.84);
      if (i > 0) doc.addPage(size.format, size.orientation);
      doc.addImage(img, 'JPEG', 0, 0, size.mmW, size.mmH);
      el.remove(); if (progress) progress(i + 1, pages.length);
    }
    return doc;
  }
};
const A5 = { w: 559, h: 794, mmW: 148, mmH: 210, format: 'a5', orientation: 'portrait' };

// ---------- ملف المحتوى ----------
async function buildContentPdf() {

// ---------------------------------------------------------------------
// تقرير ختام البرنامج بمستوى مؤسسي (عربي / إنجليزي) + بيانات لوحة المشرف ومقارنة الدفعات
// كل الأرقام تُحسب مرة واحدة في reportData() من البيانات الحالية أو من لقطة دفعة مؤرشفة.
// ---------------------------------------------------------------------
const A4P = { w: 794, h: 1123, mmW: 210, mmH: 297, format: 'a4', orientation: 'portrait' };
const SNAP_KEYS = { users: 'users', posts: 'posts', assess: 'assess', attendance: 'attendance', labAnswers: 'lab', leads: 'leads', followups: 'followups' };
// حساب المؤشرات على لقطة بيانات (دفعة مؤرشفة) بتبديل مؤقت لحالة Store ثم استعادتها
function withSnapshot(snap, fn) {
  if (!snap) return fn();
  const saved = {}; Object.keys(SNAP_KEYS).forEach(k => { saved[k] = Store[k]; });
  try { Store.users = snap.users || {}; Store.posts = snap.posts || {}; Store.assess = snap.assess || {}; Store.attendance = snap.attendance || {}; Store.labAnswers = (snap.lab && snap.lab.answers) || {}; Store.leads = snap.leads || {}; Store.followups = snap.followups || {}; return fn(); }
  finally { Object.keys(saved).forEach(k => { Store[k] = saved[k]; }); }
}
function distOf(uids, key) { const c = {}; uids.forEach(u => { const v = RegFields.val(Store.users[u], key); if (v) c[v] = (c[v] || 0) + 1; }); return c; }
function reportData(snap) {
  return withSnapshot(snap, () => {
    const users = Store.users || {}; const uids = Object.keys(users); const A = Content.assess(); const n = A.items.length || 1;
    const pre = Assess.list('pre'), post = Assess.list('post'); const preM = {}; pre.forEach(x => { preM[x.uid] = x; });
    const paired = post.filter(x => preM[x.uid]); const gain = paired.length ? paired.reduce((s, x) => s + (x.score - preM[x.uid].score), 0) / paired.length / n * 100 : null;
    const axes = Content.eligibleAxes().map(a => { const exs = Content.exercisesOf(a.id); let posts = 0; const people = new Set(); exs.forEach(e => { const ps = Store.posts[e.id] || {}; Object.keys(ps).forEach(k => { const p = ps[k]; if (!p) return; posts++; if (e.mode === 'group') Object.keys(p.members || {}).forEach(m => people.add(m)); else people.add(k); }); }); return { a, exs: exs.length, posts, people: people.size, rate: uids.length ? people.size / uids.length : 0 }; });
    const sv = Content.survey({ all: true }); const survey = SurveyStats.of(sv ? Store.posts[sv.id] : {}, sv);
    const cfg = Attend.cfg(); const attAvg = uids.length ? Math.round(uids.reduce((s, u) => s + Attend.pct(u), 0) / uids.length) : 0;
    const perDay = Attend.days().map(d => uids.filter(u => Attend.hoursOf(u, d) > 0).length);
    const leads = Leads.list(); const byProg = Leads.byProgram(leads);
    const budget = (() => { const e = Content.allExercises().map(x => x.e).find(e => e && e.sim === 'budget'); if (!e) return []; const ps = Store.posts[e.id] || {}; return Object.keys(ps).filter(k => ps[k] && ps[k].state).map(k => ({ g: +k.slice(1), r: BudgetSim.calc(ps[k].state) })).sort((a, b) => b.r.score - a.r.score); })();
    const fu = {}; ['30', '60', '90'].forEach(k => { fu[k] = Object.keys((Store.followups || {})['d' + k] || {}).length; });
    const d = { cohort: Cohort.cur(), uids, n: A.items.length, A, pre, post, paired, gain, preAvg: Assess.avg('pre'), postAvg: Assess.avg('post'), pq: Assess.perQuestion('pre'), qq: Assess.perQuestion('post'), axes, survey, attAvg, perDay, cfg,
      certs: Attend.holders().length, achievers: Progress.achievers().length, labGroups: Object.keys(Store.labAnswers || {}).length, leads, byProg, budget, fu,
      sector: distOf(uids, 'sector'), stage: distOf(uids, 'stage'), hasStore: distOf(uids, 'hasStore'), onlineSales: distOf(uids, 'onlineSales') };
    d.recs = recommendations(d); return d;
  });
}
// توصيات آلية مبنية على القواعد (عربي + إنجليزي)
function recommendations(d) {
  const R = []; const add = (ar, en) => R.push({ ar, en });
  if (d.qq.some(x => x != null)) {
    const weak = d.qq.map((v, i) => ({ v, i })).filter(x => x.v != null).sort((a, b) => a.v - b.v).slice(0, 2).filter(x => x.v < 70);
    weak.forEach(x => { const ax = Content.axis(ASSESS_AXIS[x.i]); add('تعزيز محور «' + (ax ? ax.title : '') + '»: نسبة الإجابة الصحيحة على السؤال ' + (x.i + 1) + ' في التقييم البعدي ' + x.v + '% فقط؛ يُقترح زيادة وقت التطبيق العملي عليه في الدفعات القادمة.', 'Strengthen "' + (EN.axes[ASSESS_AXIS[x.i]] || '') + '": only ' + x.v + '% answered post-test Q' + (x.i + 1) + ' correctly; add more hands-on practice in future cohorts.'); });
  }
  if (d.survey.avgs.some(x => x != null)) { const lo = d.survey.avgs.map((v, i) => ({ v, i })).filter(x => x.v != null).sort((a, b) => a.v - b.v)[0]; if (lo && lo.v < 4.3) add('أقل بنود الرضا تقييمًا: «' + d.survey.rates[lo.i] + '» (' + lo.v.toFixed(1) + ' من 5)؛ يُوصى بمراجعته.', 'Lowest-rated satisfaction item: "' + (EN.rates[lo.i] || d.survey.rates[lo.i]) + '" (' + lo.v.toFixed(1) + '/5); review for the next cohort.'); }
  const lowAx = d.axes.filter(x => x.exs).sort((a, b) => a.rate - b.rate)[0]; if (lowAx && d.uids.length && lowAx.rate < 0.5) add('أقل المحاور مشاركة: «' + lowAx.a.title + '» (' + Math.round(lowAx.rate * 100) + '% من المسجلين)؛ يُقترح تخصيص وقت داخل الجلسة لتمارينه.', 'Lowest engagement: "' + (EN.axes[lowAx.a.id] || lowAx.a.title) + '" (' + Math.round(lowAx.rate * 100) + '% of participants); allocate in-session time to its exercises.');
  const below = d.uids.filter(u => !Attend.eligible(u)).length; if (d.uids.length && below) add(below + ' مشاركًا لم يبلغوا نسبة الحضور المطلوبة للشهادة (' + d.cfg.threshold + '%)؛ يُقترح تذكير مسبق بالمواعيد وتسجيل الحضور في بداية كل جلسة.', below + ' participant(s) did not reach the ' + d.cfg.threshold + '% attendance required for certification; send reminders and take attendance at the start of each session.');
  if (d.survey.nps != null) add(d.survey.nps >= 50 ? 'مؤشر صافي التوصية ممتاز (' + d.survey.nps + ')؛ يمكن الاستفادة من المشاركين كسفراء للدفعات القادمة.' : 'مؤشر صافي التوصية ' + d.survey.nps + '؛ يُوصى بمراجعة آراء المشاركين النصية لتحديد أولويات التحسين.', d.survey.nps >= 50 ? 'Excellent Net Promoter Score (' + d.survey.nps + '); participants can act as ambassadors for future cohorts.' : 'NPS of ' + d.survey.nps + '; review qualitative feedback to prioritise improvements.');
  if (d.leads.length) { const top = Object.keys(d.byProg).sort((a, b) => d.byProg[b] - d.byProg[a])[0]; add(d.leads.length + ' مشروعًا أبدى اهتمامًا ببرامج البنك، وأكثرها طلبًا: «' + top + '»؛ يُوصى بتواصل الفريق المختص خلال أسبوعين من انتهاء البرنامج.', d.leads.length + ' businesses expressed interest in QDB programmes (most requested: "' + (EN.programs[DEFAULT_LEADS.programs.indexOf(top)] || top) + '"); recommend follow-up by the relevant QDB team within two weeks.'); }
  const topSector = Object.keys(d.sector).sort((a, b) => d.sector[b] - d.sector[a])[0]; if (topSector) add('القطاع الأكثر تمثيلًا: «' + topSector + '»؛ يُقترح إضافة أمثلة ودراسات حالة من هذا القطاع في الدفعات القادمة.', 'Most represented sector: "' + enOpt(topSector) + '"; add sector-specific cases in future cohorts.');
  if (d.gain != null && d.gain > 0) add('تحسّن متوسط المعرفة بمقدار ' + Math.round(d.gain) + ' نقطة مئوية بين التقييمين القبلي والبعدي؛ يُوصى بقياس التطبيق الفعلي عبر متابعات 30 و60 و90 يومًا.', 'Average knowledge improved by ' + Math.round(d.gain) + ' percentage points (pre vs post); measure real-world application through the 30/60/90-day follow-ups.');
  return R;
}

async function doRegister() {
  const { data, err } = RegFields.collect(document, 'reg_');
  if (err) { UI.alert(err); return; }
  if (!($('#regConsent') || {}).checked) { UI.alert('يلزم الموافقة على إشعار الخصوصية لإتمام التسجيل.'); return; }
  const follow = !!($('#regFollow') || {}).checked;
  const btn = $('[data-act="register"]'); if (btn) { btn.disabled = true; btn.textContent = 'جارٍ التسجيل…'; }
  try {
    const uid = genId('u');
    // رقم عضوية تسلسلي عبر عملية ذرّية مع حماية دنيا صريحة
    const member = await DB.transaction('meta/memberCounter', cur => Math.max(Number(cur) || 0, MEMBER_NO_FLOOR) + 1);
    const ts = DB.now(); const name = data.name, role = data.role || '';
    await DB.set('users/' + uid, { name, role, f: data.f, member, ts, consent: { privacy: ts, followup: follow } });
    DB.transaction('stats/registered', c => (Number(c) || 0) + 1);
    const me = { uid, name, role, member, ts }; Me.save(me);
    App.render(); welcomeModal(me);
  } catch (e) { UI.alert('تعذر التسجيل: ' + h(e.message || e)); if (btn) { btn.disabled = false; btn.textContent = 'ابدأ 🚀'; } }
}

    case 'se-add': FormState.slides = collectSlides(root); FormState.slides.push({ type: $('#newSlideType').value, title: '' }); Views.axisEdit.reslides(root); break;
    case 'se-del': { FormState.slides = collectSlides(root); FormState.slides.splice(+t.getAttribute('data-i'), 1); Views.axisEdit.reslides(root); break; }
    case 'se-up': case 'se-down': { FormState.slides = collectSlides(root); const i = +t.getAttribute('data-i'), j = act === 'se-up' ? i - 1 : i + 1; const s = FormState.slides; [s[i], s[j]] = [s[j], s[i]]; const k = ['text', 'rule', 'intro', 'img']; Views.axisEdit.reslides(root); break; }
    case 'axis-save': Views.axisEdit.save(root); break;
    case 'form-cancel': { FormState.axisId = null; FormState.exId = null; const b = Router.backOf(Router.cur); Router.go(b.view, b.id ? { id: b.id } : {}); break; }
    case 'it-add': FormState.items = collectItems(root, FormState.format); FormState.items.push({}); $('#itemsEd').innerHTML = itemsEditorHtml(FormState.format, FormState.items); break;
    case 'it-del': FormState.items = collectItems(root, FormState.format); FormState.items.splice(+t.getAttribute('data-i'), 1); $('#itemsEd').innerHTML = itemsEditorHtml(FormState.format, FormState.items); break;
    case 'ex-save': exFormSave(root, t.getAttribute('data-kind')); break;
  }
});
document.addEventListener('change', ev => { const t = ev.target; if (t.getAttribute && t.getAttribute('data-act-change') === 'import-backup' && t.files && t.files[0]) { importBackup(t.files[0]); t.value = ''; } });
document.addEventListener('input', ev => { const t = ev.target; if (t.hasAttribute && t.hasAttribute('data-filter')) applyFilter(t); });
document.addEventListener('click', ev => { if (UIState.bellOpen && !ev.target.closest('.bell-wrap')) { UIState.bellOpen = false; App.render(); } });

// ---------- مؤقت المختبر ----------
function labTick() {
  if (Router.cur.view !== 'lab') return; const g = Me.group(); if (!g) return; const tm = Store.labTimers['g' + g]; if (!tm || !tm.start) return;
  const el = labElapsed(tm); const total = Content.lab().stages.length * Content.lab().minutes * 60000; const c = $('#labClock'); if (c) c.textContent = mmss(total - el);
  let rerender = false; $$('[data-lock-at]').forEach(n => { const at = +n.getAttribute('data-lock-at'); if (el >= at) rerender = true; else { const s = n.querySelector('.num'); if (s) s.textContent = mmss(at - el); } });
  if (rerender) App.render();
}

// ---------- نسخ احتياطي يومي تلقائي لمدخلات المتدربين ----------
// أول متصفح يفتح المنصة في يوم جديد يأخذ نسخة من المشاركات والتسجيل والحضور والتقييمات (عملية ذرّية تضمن نسخة واحدة يوميًا)
const BACKUP_KEEP = 14;
const BACKUP_PATHS = ['users', 'posts', 'assess', 'attendance', 'lab', 'assign', 'leads', 'followups', 'storyLikes'];
function dayKey(ts) { const d = new Date(ts || Date.now()); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
async function snapshotData() { const o = {}; for (const k of BACKUP_PATHS) o[k] = await DB.get(k); return o; }
async function autoBackup(force) {
  try {
    const day = dayKey(DB.now()); const mark = day + '|' + genId();
    const res = await DB.transaction('meta/backupDay', cur => (!force && cur && String(cur).indexOf(day + '|') === 0) ? undefined : mark);
    if (res !== mark) return false;
    const data = await snapshotData(); const json = JSON.stringify(data);
    if (!force && json.length < 20) return false;
    await DB.set('backups/' + day, { ts: DB.now(), data });
    await DB.set('backupIndex/' + day, { ts: DB.now(), users: Object.keys(data.users || {}).length, posts: Object.keys(data.posts || {}).reduce((n, k) => n + Object.keys(data.posts[k] || {}).length, 0), kb: Math.round(json.length / 1024) });
    const idx = Object.keys((await DB.get('backupIndex')) || {}).sort(); const old = idx.slice(0, Math.max(0, idx.length - BACKUP_KEEP));
    if (old.length) { const upd = {}; old.forEach(k => { upd['backups/' + k] = null; upd['backupIndex/' + k] = null; }); await DB.update('', upd); }
    return true;
  } catch (e) { console.warn('backup', e); return false; }
}
async function restoreBackup(day) {
  if (!(await UI.confirm('استعادة مدخلات المتدربين كما كانت في نسخة ' + h(day) + '؟ ستُستبدل البيانات الحالية (التسجيل، المشاركات، التقييمات، الحضور، المختبر). المحتوى وتعديلاته لا تتأثر.', { danger: true, ok: 'استعادة' }))) return;
  const b = await DB.get('backups/' + day); if (!b || !b.data) { UI.alert('النسخة غير موجودة.'); return; }
  const upd = {}; BACKUP_PATHS.forEach(k => { upd[k] = b.data[k] || null; }); await DB.update('', upd); UI.toast('✅ تمت الاستعادة');
}

// ---------- إغلاق الدفعة الحالية وأرشفتها ثم تجهيز المنصة لدفعة جديدة ----------
function cohortSummary(d) { return { participants: d.uids.length, attAvg: d.attAvg, certs: d.certs, preAvg: d.preAvg == null ? null : Math.round(d.preAvg), postAvg: d.postAvg == null ? null : Math.round(d.postAvg), gain: d.gain == null ? null : Math.round(d.gain), sat: d.survey.overall == null ? null : Math.round(d.survey.overall * 100) / 100, nps: d.survey.nps, leads: d.leads.length, labGroups: d.labGroups }; }
async function closeCohort() {
  const cur = Cohort.cur(); const num = Cohort.list().length + 2;
  if (!(await UI.confirm('سيتم أرشفة كل مدخلات «' + h(cur.name) + '» (المسجّلون، المشاركات، التقييمات، الحضور، المختبر، الاهتمامات، المتابعات) في أرشيف الدفعات مع ملخص مؤشراتها، ثم تفريغ المنصة لاستقبال دفعة جديدة. المحتوى وتعديلاته لا تتأثر.', { ok: 'أرشفة وبدء دفعة جديدة', title: 'إغلاق الدفعة' }))) return;
  const pm = progressModal('📦 أرشفة الدفعة');
  try {
    pm.set(1, 3, 'جارٍ جمع البيانات…'); const data = await snapshotData();
    const summary = cohortSummary(reportData(data)); const id = 'c' + genId(); const meta = Object.assign({}, cur, { closedAt: DB.now() });
    pm.set(2, 3, 'جارٍ الحفظ في الأرشيف…'); await DB.set('cohorts/' + id, { meta, data }); await DB.set('cohortIndex/' + id, Object.assign({}, meta, { summary }));
    pm.set(3, 3, 'جارٍ تجهيز الدفعة الجديدة…'); const upd = {}; BACKUP_PATHS.forEach(k => { upd[k] = null; }); upd['meta/resetStamp'] = DB.now(); upd['stats/registered'] = 0; upd['settings/attendance/codes'] = null; upd.reveal = null;
    upd['settings/cohort'] = { name: 'الدفعة ' + num, start: '', end: '' };
    await DB.update('', upd); pm.close(); UI.toast('✅ أُرشفت الدفعة وبدأت دفعة جديدة');
  } catch (e) { pm.close(); UI.alert('تعذرت الأرشفة: ' + h(e.message || e)); }
}

// ---------- الإقلاع ----------
function boot() {
  Me.load();
  Router.cur = Router.parse();
  SafeHist.replace(Router.cur, Router.url(Router.cur));
  watchAll();
  if (Me.data && Me.data._fromHash) DB.get('users/' + Me.data.uid).then(u => { if (u) Me.save({ uid: Me.data.uid, name: u.name, role: u.role || '', org: u.org || '', email: u.email || '', member: u.member, ts: u.ts || 0, group: u.group || null }); else Me.clear(); App.render(); });
  Translate.boot();
  setTimeout(() => autoBackup(false), 15000); setInterval(() => autoBackup(false), 3600000);
  App.render();
  setInterval(labTick, 1000);
}
boot();

</script>
