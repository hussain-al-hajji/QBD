"التسوية"},{"text":"اعتراض العميل على العملية لدى بنكه يُعرف بالـ ___.","answer":"Chargeback"},{"text":"البوابة الوطنية لبطاقات الخصم المحلية في قطر هي ___.","answer":"QPay"},{"text":"الدفع بلمسة من الجوال يتم عبر المحافظ ___.","answer":"الرقمية"},{"text":"إرسال ___ دفع عبر واتساب يسهل البيع من المحادثة.","answer":"رابط"},{"text":"تحويل المبلغ من عملة لأخرى قد يضيف رسوم ___.","answer":"صرف"},{"text":"خيار «اشترِ الآن وادفع لاحقًا» يعني ___.","answer":"التقسيط"},{"text":"الدفع عند ___ ما زال مطلوبًا لدى بعض العملاء.","answer":"الاستلام"}],"principle":"المصطلحات الدقيقة ضرورية عند التفاوض مع مزودي الدفع وقراءة العقود.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط الكلمة ثم الفراغ، واضغط فراغًا ممتلئًا لإفراغه.</p>","why":"يثبت مفردات الدفع التي ستتكرر في بقية البرنامج.","axis":"a3"}],"highlights":["رحلة عملية الدفع: من الضغط إلى التسوية","بوابات محلية وإقليمية ودولية","وسائل الدفع التي يتوقعها العميل القطري","قراءة هيكل الرسوم ومدة التسوية","الدفع متعدد العملات للعملاء الدوليين"],"unit":2,"icon":"card","color":2,"scene":"checkout","title":"كيف يصل المال إلى حسابك؟","classic":"نظرة عامة على بوابات الدفع الرقمي المحلية والدولية وتفعيل الدفع متعدد العملات","duration":"30 دقيقة","desc":"<p>خلف زر «ادفع الآن» سلسلة من الأطراف: بوابة، ومعالج، وبنك مُصدر، وبنك مستحوذ. فهم هذه السلسلة يساعدك على اختيار بوابة الدفع المناسبة، وقراءة رسومها، وتقديم وسائل الدفع التي يتوقعها عميلك في قطر وخارجها.</p>","outcome":"يشرح أطراف عملية الدفع ويقارن مزودي الدفع بالتكلفة الفعلية ومدة التسوية ووسائل الدفع المحلية."},{"id":"a4","slides":[{"type":"opening","title":"الأمان الحقيقي والأمان الذي يشعر به العميل","text":"<p>قد يكون متجرك آمنًا تقنيًا بالكامل، ومع ذلك يغادر العميل لأنه لم يشعر بالأمان. وقد يبدو متجر آخر أنيقًا ومطمئنًا بينما يتساهل في حماية البيانات. النجاح يحتاج الاثنين معًا: حماية فعلية تمنع الخطر، وإشارات واضحة تطمئن العميل.</p>","rule":"<p>الأمان الذي لا يراه العميل لا يطمئنه، والطمأنة بلا أمان حقيقي خطر مؤجل.</p>","chart":{"kind":"matrix","items":["الأمان الحقيقي","الأمان المحسوس","مطمئن لكنه هش","آمن ومطمئن ✓","خطر ظاهر","آمن لكنه مقلق"]},"id":"a4s1","note":"⏱ 2 د. اسأل: «ما الذي يجعلكم تثقون بموقع لا تعرفونه قبل إدخال البطاقة؟»، واكتب الإجابات."},{"type":"principle","title":"الامتثال وأمن بيانات البطاقات","points":["معيار PCI DSS: معيار دولي لحماية بيانات البطاقات يلتزم به كل من يخزن أو يعالج أو ينقل بياناتها.","صفحات الدفع المستضافة: عندما يدخل العميل بياناته في صفحة المزود أو حقول مشفّرة منه، تنتقل معظم أعباء الامتثال إلى المزود.","التحقق الثلاثي (3-D Secure): خطوة تحقق إضافية من بنك العميل (رمز أو تطبيق) تقلل الاحتيال وتنقل مسؤولية بعض الاعتراضات.","شهادة الأمان SSL: تشفير الاتصال بين المتصفح والمتجر؛ شرط أساسي لأي متجر اليوم."],"intro":"<p>أمن بيانات البطاقات تحكمه معايير دولية، وأسهل طريقة للامتثال ألا تلمس بيانات البطاقة بنفسك أصلًا:</p>","rule":"<p>لا تخزن أرقام البطاقات في أنظمتك أبدًا؛ دع المزود المعتمد يتولى ذلك.</p>","chart":{"kind":"vflow","items":["صفحة دفع مستضافة أو حقول مشفرة","تحقق ثلاثي 3-D Secure","اتصال مشفر SSL","لا تخزين لبيانات البطاقات*"]},"id":"a4s2","note":"⏱ 3 د. الرسالة الذهبية: لا تخزن أرقام البطاقات أبدًا؛ دع المزود المعتمد يتولاها."},{"type":"principle","title":"حماية البيانات الشخصية للعملاء","points":["اجمع ما تحتاجه فقط: لا تطلب بيانات لا ترتبط بإتمام الطلب.","اشرح الغرض: سياسة خصوصية واضحة توضح ماذا تجمع ولماذا وكيف تحميه.","اطلب الموافقة: خصوصًا للرسائل التسويقية، مع طريقة سهلة لإلغاء الاشتراك.","احمِ الوصول: صلاحيات محددة للموظفين، وكلمات مرور قوية، وتحقق ثنائي في لوحة التحكم.","استعد للحوادث: اعرف ماذا تفعل إذا تسربت بيانات، ومن تبلّغ."],"intro":"<p>إلى جانب بيانات البطاقات، يجمع المتجر أسماء وعناوين وأرقام هواتف وسجل مشتريات. في قطر ينظم ذلك قانون حماية خصوصية البيانات الشخصية (القانون رقم 13 لسنة 2016)، والمبادئ العملية للتاجر:</p>","rule":"<p>بيانات العميل أمانة؛ كل بيان إضافي تجمعه مسؤولية إضافية تتحملها.</p>","chart":{"kind":"cycle","items":["اجمع الضروري","اشرح الغرض","اطلب الموافقة","احمِ الوصول","استعد للحوادث"]},"id":"a4s3","note":"⏱ 3 د. اذكر قانون حماية خصوصية البيانات الشخصية القطري (رقم 13 لسنة 2016) دون الدخول في تفاصيل قانونية، وركز على «اجمع الضروري فقط»."},{"type":"principle","title":"إشارات الاحتيال وأدوات الحماية","points":["عنوان الشحن يختلف كثيرًا عن بلد البطاقة أو عنوان الفوترة.","طلبات كبيرة متتالية من عميل جديد، أو عدة محاولات دفع فاشلة ثم ناجحة.","كميات غير منطقية من منتج واحد عالي القيمة.","بريد إلكتروني عشوائي أو رقم هاتف لا يرد.","أدوات الحماية: قواعد تنبيه وتقييم مخاطر لدى المزود، التحقق الثلاثي، مراجعة يدوية للطلبات المشبوهة، وتأكيد هاتفي للطلبات الكبيرة."],"intro":"<p>الاحتيال في التجارة الإلكترونية غالبًا يترك إشارات يمكن ملاحظتها قبل الشحن:</p>","rule":"<p>المراجعة الذكية قبل الشحن أرخص بكثير من استرداد مال بعد الاعتراض.</p>","chart":{"kind":"tree","items":["طلب مشبوه؟","إشارة واحدة ضعيفة::تحقق هاتفي سريع","إشارات متعددة::مراجعة يدوية قبل الشحن","إشارات قوية::إلغاء الطلب واسترداد المبلغ"]},"id":"a4s4","note":"⏱ 3 د. اعرض مثال طلب مشبوه واسأل القاعة: «تشحنه أم لا؟»."},{"type":"principle","title":"لماذا يترك العملاء السلة؟","points":["تكاليف إضافية مفاجئة: الشحن أو الرسوم تظهر في آخر خطوة.","إجبار العميل على إنشاء حساب قبل الشراء.","عملية دفع طويلة أو معقدة بحقول كثيرة.","عدم الثقة في الموقع لإدخال بيانات البطاقة.","مدة توصيل طويلة أو غير واضحة.","سياسة استرجاع غير مرضية أو غير ظاهرة.","وسيلة الدفع المفضلة غير متوفرة."],"intro":"<p>تشير دراسات معهد Baymard المتكررة إلى أن نحو 70% من السلال تُترك دون إتمام في المتوسط. بعض ذلك طبيعي (عملاء يتصفحون فقط)، لكن جزءًا كبيرًا منه يمكن علاجه. أبرز الأسباب القابلة للإصلاح:</p>","rule":"<p>الرسم يعرض نسبًا تقريبية لأبرز الأسباب من استطلاعات Baymard (تتغير قليلًا من سنة لأخرى)؛ وكل سبب منها قرار تصميمي أو تشغيلي يمكن تغييره.</p>","chart":{"kind":"bars","items":["تكاليف إضافية مفاجئة::48","إجبار إنشاء حساب::26","عدم الثقة في الموقع::25","توصيل بطيء::23","دفع طويل ومعقد::22","تكلفة إجمالية غير واضحة مسبقًا::21"]},"id":"a4s5","note":"⏱ 4 د. قبل عرض الرسم اسأل عن نتائج نشاط «توقّع الرقم»، ثم قارنها بنسبة 70% تقريبًا من دراسات Baymard."},{"type":"tools","title":"ممارسات ترفع معدل إتمام الشراء","items":["الشفافية المبكرة::اعرض تكلفة الشحن أو حد الشحن المجاني في صفحة المنتج والسلة، لا في آخر خطوة.","الشراء كضيف::اسمح بالإتمام دون حساب، واعرض إنشاء الحساب بعد الشراء بنقرة.","حقول أقل::اطلب الضروري فقط، واستخدم الإكمال التلقائي للعناوين، ووحّد الاسم الكامل في حقل واحد.","الدفع السريع::المحافظ الرقمية وحفظ البطاقة (عبر المزود) للعميل العائد.","عناصر الثقة::شعارات وسائل الدفع، ذكر الحماية، سياسة الاسترجاع، وبيانات تواصل حقيقية.","مؤشر تقدم::خطوات مرقمة واضحة (السلة ← العنوان ← الدفع ← التأكيد).","رسائل الاستعادة::بريد أو رسالة لتذكير من ترك السلة، بموافقته، مع رابط يعيده إلى سلته كما هي."],"rule":"<p>كل حقل أو خطوة أو مفاجأة تحذفها يزيد احتمال الإتمام.</p>","id":"a4s6","note":"⏱ 3 د. اطلب من كل متدرب اختيار ممارستين سيطبقهما هذا الأسبوع."},{"type":"mistakes","title":"أخطاء في صفحة إتمام الشراء","items":["إظهار رسوم الشحن في الخطوة الأخيرة::اعرضها أو اعرض طريقة حسابها منذ صفحة المنتج.","إجبار العميل على إنشاء حساب::اجعل الشراء كضيف هو الخيار الافتراضي.","نقل العميل لموقع آخر مختلف الشكل فجأة::وضّح أنه سينتقل لصفحة دفع آمنة، أو استخدم حقولًا مدمجة بهوية متجرك.","رسائل خطأ غامضة::اذكر الحقل المطلوب تصحيحه وكيف، واحتفظ بما أدخله العميل.","غياب تأكيد واضح بعد الدفع::اعرض رقم الطلب وموعد التوصيل المتوقع وأرسل تأكيدًا فوريًا."],"id":"a4s7","note":"⏱ 2 د. اعرض صفحة دفع حقيقية سيئة (من دون ذكر اسمها) إن أمكن."},{"type":"summary","title":"ثقة تُبنى وخطوات تُختصر","text":"<p>الدفع الآمن يبدأ من معايير لا تساهل فيها: صفحات دفع معتمدة، تحقق ثلاثي، حماية بيانات، ومراجعة للطلبات المشبوهة. والدفع المريح يبدأ من صفحة إتمام خالية من المفاجآت والحقول الزائدة.</p>","rule":"<p>احمِ العميل بصمت، وطمئنه بوضوح، واختصر طريقه إلى زر الدفع.</p>","chart":{"kind":"equation","items":["حماية فعلية","إشارات ثقة","خطوات أقل","لا مفاجآت","= إتمام أعلى"]},"id":"a4s8","note":"⏱ 1 د. انتقل إلى «صمّم صفحة إتمام الشراء»: من يصل أعلى معدل إتمام بأقل تغييرات؟"}],"exercises":[{"id":"a4e1","title":"محكمة صفحة الدفع","icon":"👨‍⚖️","mode":"group","format":"text","steps":["حددوا كل مشكلة في الصفحة واربطوها بسبب من أسباب التخلي.","رتبوا المشكلات حسب الأثر المتوقع.","اقترحوا الإصلاح لكل مشكلة."],"scenario":"<p>صفحة إتمام شراء لمتجر هدايا: تطلب إنشاء حساب إلزاميًا، ثم 14 حقلًا (منها تاريخ الميلاد والوظيفة)، ورسوم الشحن تظهر في الخطوة الأخيرة، والعميل ينتقل إلى صفحة دفع بشكل مختلف تمامًا دون تنبيه، ولا توجد إلا بطاقات الائتمان. معدل التخلي عن السلة 82%.</p>","principle":"التخلي عن السلة غالبًا نتيجة قرارات تصميمية وتشغيلية قابلة للإصلاح.","task":"<p>اكتبوا «حكم» مجموعتكم: أخطر ثلاث مشكلات مرتبة حسب الأثر، والإصلاح المقترح لكل منها، ومؤشرًا واحدًا ستراقبونه لمعرفة نجاح الإصلاح.</p>","why":"يدرب على تشخيص صفحة الدفع بعين العميل وبمنهجية الأولويات.","model":"<p>مثال من مجال مختلف: نموذج حجز موعد طبي يطلب رقم التأمين قبل عرض المواعيد المتاحة؛ الإصلاح: عرض المواعيد أولًا، وطلب التأمين بعد اختيار الموعد. طبقوا المنطق نفسه على صفحة الهدايا.</p>","axis":"a4"},{"id":"a4e2","title":"آمن أم مخاطرة؟","icon":"🛡️","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"تخزين أرقام بطاقات العملاء في ملف Excel لتسريع الطلبات القادمة ممارسة مقبولة.","answer":false},{"q":"استخدام صفحة دفع مستضافة لدى مزود معتمد يخفف كثيرًا من أعباء الامتثال على التاجر.","answer":true},{"q":"التحقق الثلاثي (3-D Secure) يضيف خطوة تحقق تقلل الاحتيال.","answer":true},{"q":"طلب بيانات لا ترتبط بإتمام الطلب لا يمثل أي مشكلة.","answer":false},{"q":"إرسال رسائل تسويقية دون موافقة العميل ممارسة سليمة ما دام عميلًا سابقًا.","answer":false},{"q":"اختلاف عنوان الشحن كثيرًا عن بلد البطاقة قد يكون إشارة احتيال تستحق المراجعة.","answer":true},{"q":"تفعيل التحقق الثنائي في لوحة تحكم المتجر يقلل خطر اختراق الحساب.","answer":true},{"q":"شهادة SSL اختيارية للمتاجر الصغيرة.","answer":false},{"q":"مراجعة الطلبات المشبوهة قبل الشحن أوفر من التعامل مع الاعتراض بعده.","answer":true},{"q":"منح كل الموظفين صلاحيات كاملة على لوحة التحكم يسهل العمل ولا يحمل مخاطر.","answer":false}],"principle":"الأمان والامتثال قرارات يومية، لا إعدادات تُنسى بعد الإطلاق.","hint":"<p>فكّر في مسؤولية التاجر وما يمكن أن يسوء.</p>","why":"يرسخ الممارسات الآمنة في التعامل مع بيانات الدفع والعملاء.","axis":"a4"},{"id":"a4e3","title":"أعد تصميم إتمام الشراء","icon":"🛒","mode":"individual","format":"mcq","steps":[],"items":[{"q":"متى تعرض تكلفة الشحن؟","options":["في صفحة المنتج والسلة أو بطريقة حساب واضحة مبكرًا","في آخر خطوة","لا تعرضها","بعد الدفع"],"answer":0},{"q":"كيف تتعامل مع إنشاء الحساب؟","options":["إلزامي قبل الدفع","إلزامي قبل السلة","الشراء كضيف افتراضيًا مع عرض إنشاء الحساب بعد الشراء","لا حسابات إطلاقًا"],"answer":2},{"q":"أي الحقول تُحذف أولًا؟","options":["العنوان","رقم الهاتف للتوصيل","الحقول غير المرتبطة بإتمام الطلب مثل الوظيفة وتاريخ الميلاد","البريد لإرسال التأكيد"],"answer":2},{"q":"عميل يستخدم الجوال غالبًا. ما الإضافة الأكثر أثرًا؟","options":["صور أكبر في صفحة الدفع","المحافظ الرقمية للدفع بلمسة","نموذج أطول","فيديو ترحيبي"],"answer":1},{"q":"كيف تعرض رسالة خطأ في رقم الهاتف؟","options":["تحديد الحقل وكيفية التصحيح مع الإبقاء على بقية البيانات","مسح النموذج كاملًا","«خطأ في البيانات»","إعادة تحميل الصفحة"],"answer":0},{"q":"ما أفضل ما يُعرض بعد الدفع مباشرة؟","options":["رقم الطلب وموعد التوصيل المتوقع وتأكيد فوري","الصفحة الرئيسية","إعلان لمنتج آخر فقط","لا شيء"],"answer":0},{"q":"عميل ترك السلة ووافق مسبقًا على الرسائل. ما الإجراء المناسب؟","options":["رسالة تذكير برابط يعيده لسلته كما هي","لا شيء","عشر رسائل في اليوم الأول","حذف السلة فورًا"],"answer":0},{"q":"ما عنصر الثقة الأنسب قرب زر الدفع؟","options":["عداد تنازلي مزيف","صور المنتجات مرة أخرى","شعارات وسائل الدفع وإشارة للحماية وسياسة الاسترجاع","رابط لمواقع أخرى"],"answer":2},{"q":"كيف تقلل قلق العميل عند انتقاله لصفحة دفع المزود؟","options":["نقله دون أي تنبيه","طلب بياناته مرتين","توضيح أنه سينتقل لصفحة دفع آمنة أو استخدام حقول مدمجة بهوية المتجر","إخفاء الانتقال"],"answer":2},{"q":"كم خطوة يُفضل أن يرى العميل في مؤشر التقدم؟","options":["خطوات قليلة مرقمة واضحة مثل السلة ← العنوان ← الدفع ← التأكيد","عشر خطوات تفصيلية","مؤشر بلا أسماء","لا مؤشر"],"answer":0}],"scenario":"<p>عشرة قرارات في صفحة إتمام الشراء. اختر القرار الذي يرفع الإتمام دون الإضرار بالأمان.</p>","principle":"تقليل الجهد والمفاجآت يرفع الإتمام، والأمان يُحافظ عليه عبر المزود لا عبر خطوات مزعجة إضافية.","hint":"<p>اختر ما يزيل سببًا من أسباب التخلي عن السلة.</p>","why":"يحول أسباب التخلي إلى قرارات تصميم محددة.","axis":"a4"},{"id":"a4e4","title":"قارن بين تجربتين","icon":"🔍","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"نطلب إنشاء حساب قبل الدفع لضمان عودة العميل.","b":"نتيح الشراء كضيف ونعرض الحساب بعد الشراء.","answer":"b"},{"a":"نعرض حد الشحن المجاني في السلة.","b":"نفاجئ العميل بالشحن في آخر خطوة.","answer":"a"},{"a":"نخزن أرقام البطاقات لدينا لتسهيل الطلبات المتكررة.","b":"نترك حفظ البطاقة للمزود المعتمد.","answer":"b"},{"a":"نفعّل التحقق الثلاثي لتقليل الاحتيال.","b":"نلغي أي تحقق إضافي لتسريع الدفع.","answer":"a"},{"a":"نرسل رسائل التذكير لمن وافق عليها فقط.","b":"نرسل رسائل التذكير لكل من زار المتجر.","answer":"a"},{"a":"نجمع تاريخ الميلاد والوظيفة لكل طلب.","b":"نجمع البيانات الضرورية للتوصيل والتأكيد فقط.","answer":"b"},{"a":"نراجع الطلبات الكبيرة المشبوهة قبل الشحن.","b":"نشحن كل طلب فورًا ونتعامل مع المشكلات لاحقًا.","answer":"a"},{"a":"نعرض رسالة خطأ عامة تمسح النموذج.","b":"نحدد الحقل الخاطئ ونحتفظ بما أدخله العميل.","answer":"b"},{"a":"نعرض رقم الطلب وموعد التوصيل بعد الدفع.","b":"نعيد العميل للرئيسية بعد الدفع.","answer":"a"},{"a":"نمنح كل موظف الصلاحيات التي يحتاجها فقط.","b":"نمنح الجميع صلاحيات المدير لتسهيل العمل.","answer":"a"}],"principle":"التفاصيل الصغيرة في صفحة الدفع تصنع الفرق بين الإتمام والمغادرة.","hint":"<p>اختاروا العبارة التي تمثل الممارسة الأصح أمانًا أو إتمامًا.</p>","why":"يدرب المجموعة على الحكم السريع على قرارات الدفع والأمان.","axis":"a4"},{"id":"a4e5","title":"صمّم صفحة إتمام الشراء","icon":"🧪","mode":"individual","format":"sim","steps":[],"sim":"checkout","scenario":"<p>ورثت صفحة إتمام شراء سيئة: حساب إجباري، و14 حقلًا، وشحن يظهر في آخر خطوة، وبطاقات ائتمان فقط، ونافذة عروض منبثقة قبل الدفع. معدل الإتمام الحالي منخفض. أعد تصميمها بإضافة العناصر أو حذفها، وراقب «معدل الإتمام المتوقع» يتغير مباشرة.</p>","principle":"كل حقل أو خطوة أو مفاجأة تحذفها، وكل وسيلة دفع متوقعة وعنصر ثقة تضيفه، يرفع احتمال الإتمام.","hint":"<p>ليس الهدف الوصول إلى أعلى رقم فقط؛ اسأل نفسك: أي تغيير هو الأسهل تنفيذًا والأعلى أثرًا في متجري؟</p>","why":"يجعل أسباب التخلي عن السلة ملموسة: ترى أثر كل قرار تصميمي بالأرقام.","axis":"a4"}],"highlights":["معايير أمن البطاقات والتحقق الثلاثي","حماية البيانات الشخصية والتزامات التاجر","إشارات الاحتيال وأدوات الحماية","أسباب التخلي عن السلة","تصميم صفحة إتمام شراء سريعة وواضحة"],"unit":2,"icon":"shield","color":3,"scene":"trust","title":"دفع آمن وسلة لا تُهجر","classic":"متطلبات الامتثال والحماية من الاحتيال وأمن البيانات، وأفضل الممارسات لتحسين إتمام الشراء وتقليل التخلي عن السلة","duration":"35 دقيقة","desc":"<p>العميل لا يدفع إلا إذا شعر بالأمان، والتاجر لا ينجو إذا تساهل في حماية البيانات أو تجاهل الاحتيال. في هذا المحور نجمع بين الأمان الحقيقي والأمان المحسوس، ونعالج أكبر نقطة تسرب في أي متجر: صفحة إتمام الشراء.</p>","outcome":"يطبق متطلبات الأمان وحماية البيانات ويعيد تصميم صفحة إتمام الشراء لرفع معدل الإتمام."},{"id":"a5","slides":[{"type":"opening","title":"الوعد يُكتب في المتجر ويُنفّذ في المستودع","text":"<p>كل صفحة منتج تحمل وعدًا ضمنيًا: «سيصلك هذا المنتج كما تراه، في الموعد الذي نذكره». التسويق يجلب العميل مرة، أما التنفيذ الجيد فيجعله يعود. وأي خلل في المخزون أو التغليف أو التوصيل يحوّل عميلًا راضيًا إلى تقييم سلبي.</p>","rule":"<p>التوصيل ليس نهاية عملية البيع؛ هو بداية قرار العميل بالعودة.</p>","chart":{"kind":"flow","items":["استلام الطلب","التجهيز","التغليف","الشحن","التسليم*"]},"id":"a5s1","note":"⏱ 2 د. اسأل: «آخر طلب وصلكم متأخرًا، هل عدتم للشراء من المتجر نفسه؟»."},{"type":"principle","title":"رحلة الطلب داخل العمليات","points":["الاستلام والتحقق: تأكيد الدفع، ومراجعة العنوان، وفحص الطلبات المشبوهة.","الالتقاط والتجهيز: سحب المنتجات الصحيحة من مواقعها بالرمز (SKU) لا بالذاكرة.","التغليف: حماية مناسبة لطبيعة المنتج، وتجربة فتح تعكس العلامة، وفاتورة ومرفقات.","الشحن: إنشاء بوليصة الشحن، وتسليمها للناقل، وإرسال رقم التتبع للعميل.","التسليم وما بعده: تأكيد الاستلام، وطلب التقييم، ومعالجة أي مشكلة بسرعة."],"intro":"<p>بعد ضغط العميل على «ادفع»، يمر الطلب بمراحل يجب أن تكون كل منها واضحة المسؤول والمدة:</p>","rule":"<p>كل مرحلة بلا مسؤول واضح ومدة محددة تصبح مكانًا لتأخير لا يراه أحد حتى يشتكي العميل.</p>","chart":{"kind":"steps","items":["استلام::تأكيد الدفع والعنوان","التقاط::بالرمز SKU","تغليف::حماية وتجربة فتح","شحن::بوليصة ورقم تتبع","تسليم::تأكيد وتقييم"]},"id":"a5s2","note":"⏱ 3 د. اطلب تحديد أضعف مرحلة في رحلة الطلب لديهم الآن."},{"type":"principle","title":"ثلاثة نماذج للتنفيذ والتوصيل","points":["التوصيل الذاتي (داخلي): فريقك وسياراتك. تحكم كامل وتجربة شخصية، لكن تكلفة ثابتة وصعوبة في التوسع.","شركات الطرف الثالث (3PL): شركة متخصصة تتولى التخزين و/أو التجهيز والتوصيل. مرونة وتوسع أسهل، مقابل رسوم لكل طلب وتحكم أقل في التجربة.","تنفيذ الأسواق الإلكترونية: ترسل المخزون لمستودعات السوق (مثل برامج التنفيذ لدى Amazon وNoon) ويتولى السوق التخزين والتوصيل وخدمة العملاء أحيانًا، مع ظهور أفضل وشارات توصيل سريع.","النموذج المختلط شائع: توصيل ذاتي داخل الدوحة للطلبات العاجلة، وشركة شحن للمناطق البعيدة والدول الأخرى."],"intro":"<p>يختار المشروع نموذج التنفيذ حسب حجم الطلبات وطبيعة المنتجات وموارده:</p>","rule":"<p>كلما زادت الطلبات وتنوعت الوجهات، زادت قيمة الشريك المتخصص.</p>","chart":{"kind":"compare","items":["🚐 توصيل ذاتي :: تحكم كامل ; تجربة شخصية ; تكلفة ثابتة ; توسع صعب","🏭 طرف ثالث 3PL :: رسوم لكل طلب ; توسع أسهل ; تحكم أقل ; تغطية أوسع","🛍️ تنفيذ السوق :: ظهور أفضل ; توصيل سريع ; رسوم تخزين ; قواعد صارمة"]},"id":"a5s3","note":"⏱ 4 د. اربط النماذج بقصة «رفيق» التي بدأت من مشكلة تغطية التوصيل."},{"type":"principle","title":"تخطيط المخزون: لا نفاد ولا تكدس","points":["متوسط المبيعات اليومية: كم وحدة تبيع يوميًا من كل منتج في المتوسط؟","مدة التوريد: كم يومًا يحتاج المورد لإيصال طلب جديد؟","مخزون الأمان: كمية احتياطية تحميك من تأخر المورد أو ارتفاع الطلب المفاجئ.","نقطة إعادة الطلب = (متوسط المبيعات اليومية × مدة التوريد) + مخزون الأمان.","تصنيف ABC: ركّز المتابعة على المنتجات القليلة التي تحقق معظم الإيرادات (الفئة A)."],"intro":"<p>المخزون مال متجمد على الرف. نفاده يضيع مبيعات، وتكدسه يحبس السيولة. أدوات عملية بسيطة:</p>","rule":"<p>لا تنتظر حتى ينفد المنتج؛ اطلب عندما يصل المخزون إلى نقطة إعادة الطلب.</p>","chart":{"kind":"equation","items":["المبيعات اليومية × مدة التوريد","مخزون الأمان","= نقطة إعادة الطلب"]},"id":"a5s4","note":"⏱ 4 د. احسب معادلة نقطة إعادة الطلب مع القاعة على رقم حقيقي من أحد المشاركين."},{"type":"examples","title":"حساب نقطة إعادة الطلب","items":["عطر يبيع 6 وحدات يوميًا::المورد يحتاج 10 أيام، ومخزون الأمان 20 وحدة؛ نقطة إعادة الطلب = (6 × 10) + 20 = 80 وحدة.","قهوة مختصة موسمية::الطلب يتضاعف في رمضان والشتاء؛ ارفع مخزون الأمان قبل المواسم بناءً على بيانات العام الماضي.","منتج بطيء الحركة::يبيع وحدة أسبوعيًا ومخزونه يكفي سنة؛ مال متجمد يمكن تحريره بعرض مجمّع أو تخفيض مدروس.","متجر يبيع على قناتين::بلا مزامنة للمخزون باع نفس القطعة مرتين؛ الحل: مخزون موحد يتحدث تلقائيًا في كل القنوات."],"id":"a5s5","note":"⏱ 3 د. ركز على الموسمية (رمضان، اليوم الوطني، الشتاء) في السوق القطري."},{"type":"principle","title":"إدارة الطلبات والمرتجعات","points":["حالات واضحة للطلب: جديد، قيد التجهيز، تم الشحن، تم التسليم، مرتجع.","إشعارات تلقائية للعميل في كل مرحلة، مع رقم تتبع.","مزامنة المخزون مع كل القنوات لحظيًا.","مسار واضح للمرتجعات: طلب إرجاع، استلام، فحص، ثم استرداد أو استبدال خلال مدة معلنة."],"intro":"<p>مع زيادة الطلبات يصبح نظام إدارة الطلبات (OMS) قلب العمليات: مكان واحد ترى فيه كل طلب وحالته أيًا كانت قناته. وما يجب أن يقدمه:</p>","rule":"<p>سياسة استرجاع واضحة وسهلة ترفع ثقة الشراء، ومسار مرتجعات منظم يحمي هامش ربحك.</p>","chart":{"kind":"cycle","items":["طلب جديد","تجهيز","شحن","تسليم","مرتجع أو تقييم"]},"id":"a5s6","note":"⏱ 3 د. اسأل عن سياسات الاسترجاع الحالية وكم يومًا تمنح."},{"type":"tools","title":"مؤشرات أداء التنفيذ والتوصيل","items":["نسبة الطلبات المشحونة في موعدها::كم من الطلبات خرجت من المستودع خلال المدة التي وعدت بها؟","متوسط مدة التوصيل::من الدفع حتى التسليم، مقسمة حسب المنطقة والناقل.","نسبة الطلبات الصحيحة::طلبات وصلت بالمنتج والكمية الصحيحة ودون تلف.","نسبة المرتجعات وأسبابها::مقاس خاطئ؟ تلف؟ توقع مختلف؟ كل سبب له علاج مختلف.","تكلفة التنفيذ لكل طلب::تغليف + تجهيز + شحن مقسومة على عدد الطلبات؛ تحدد هل الشحن المجاني مربح.","معدل نفاد المخزون::كم مرة ظهر منتج مطلوب «غير متوفر» خلال الشهر؟"],"rule":"<p>ما لا تقيسه في التوصيل ستسمع عنه من العميل في التقييمات.</p>","id":"a5s7","note":"⏱ 2 د. اطلب اختيار مؤشرين فقط للمتابعة الأسبوعية."},{"type":"summary","title":"التنفيذ الجيد يصنع العميل العائد","text":"<p>اختيار نموذج التنفيذ المناسب، وتخطيط المخزون بنقطة إعادة طلب ومخزون أمان، وإدارة الطلبات والمرتجعات في نظام واحد، هي ما يحول وعد صفحة المنتج إلى تجربة يثق بها العميل ويعود من أجلها.</p>","rule":"<p>وعد واقعي في المتجر، وتنفيذ دقيق في المستودع، وتواصل واضح مع العميل.</p>","chart":{"kind":"flow","items":["وعد واقعي","مخزون مخطط","تجهيز دقيق","توصيل متتبع","عميل عائد*"]},"id":"a5s8","note":"⏱ 1 د. انتقل إلى تمارين المحور، وخصص وقتًا لتمرين «خريطة تنفيذ طلباتكم»."}],"exercises":[{"id":"a5e1","title":"نموذج التنفيذ المناسب","icon":"🚚","mode":"individual","format":"mcq","steps":[],"items":[{"q":"متجر حلويات طازجة يبيع 15 طلبًا يوميًا داخل الدوحة ويحتاج توصيلًا خلال ساعتين. ما النموذج الأنسب؟","options":["تخزين في مستودع خارجي بعيد","توصيل ذاتي أو شريك توصيل سريع محلي","تنفيذ سوق إلكتروني دولي","شحن دولي اقتصادي"],"answer":1},{"q":"متجر إلكترونيات صغيرة يرسل 300 طلب يوميًا لقطر والخليج. ما الخيار الأكثر منطقية؟","options":["شريك 3PL يتولى التخزين والتجهيز والشحن","توصيل ذاتي بسيارة واحدة","التسليم من المنزل","إيقاف الشحن للخليج"],"answer":0},{"q":"بائع على Noon يريد شارة التوصيل السريع وظهورًا أفضل. ما الخيار المرتبط بذلك غالبًا؟","options":["برنامج التنفيذ التابع للسوق الإلكتروني","التوصيل الذاتي","إرسال الطلبات بالبريد العادي","إلغاء المرتجعات"],"answer":0},{"q":"عطر يبيع 5 وحدات يوميًا، مدة التوريد 8 أيام، ومخزون الأمان 15 وحدة. ما نقطة إعادة الطلب؟","options":["13","40","55","28"],"answer":2},{"q":"ما الهدف من مخزون الأمان؟","options":["زيادة عدد المنتجات","تقليل الأسعار","الحماية من تأخر المورد أو ارتفاع الطلب المفاجئ","تسريع الشحن الدولي"],"answer":2},{"q":"متجر يبيع على متجره الخاص وسوقين دون مزامنة للمخزون. ما الخطر الأكبر؟","options":["ارتفاع رسوم الدفع","بيع المنتج نفسه أكثر من مرة بعد نفاده","بطء الموقع","تغير ألوان الصور"],"answer":1},{"q":"في تصنيف ABC، أي فئة تستحق المتابعة الأدق؟","options":["A: منتجات قليلة تحقق معظم الإيرادات","B فقط","C: منتجات كثيرة قليلة الإيراد","لا فرق بين الفئات"],"answer":0},{"q":"نسبة المرتجعات في الملابس مرتفعة وسببها الأول «مقاس غير مناسب». ما الإجراء الأنسب؟","options":["دليل مقاسات واضح وصور على عارضين بمقاسات مذكورة","إلغاء الاسترجاع","رفع أسعار الشحن","إخفاء التقييمات"],"answer":0},{"q":"ما المؤشر الذي يحدد إن كان الشحن المجاني مربحًا؟","options":["تكلفة التنفيذ لكل طلب مقارنة بهامش الربح","سرعة الموقع","عدد الصور","عدد المتابعين"],"answer":0},{"q":"عميل لا يعرف أين طلبه منذ ثلاثة أيام. ما الذي كان سيمنع هذه المشكلة؟","options":["منتج مجاني","تغليف أجمل","إشعارات تلقائية بحالة الطلب مع رقم تتبع","خصم إضافي"],"answer":2}],"scenario":"<p>عشرة مواقف تشغيلية. اختر الإجراء أو النموذج الأنسب لكل موقف.</p>","principle":"نموذج التنفيذ يتبع حجم الطلبات والوجهات وطبيعة المنتج والموارد المتاحة.","hint":"<p>فكّر في الحجم، والتحكم المطلوب، والتكلفة لكل طلب.</p>","why":"يدرب على قرارات التنفيذ اليومية بناءً على منطق واضح.","axis":"a5"},{"id":"a5e2","title":"صح أم خطأ: المستودع والمرتجعات","icon":"📦","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"تكدس المخزون أفضل دائمًا من نفاده.","answer":false},{"q":"نقطة إعادة الطلب تساعد على الطلب قبل نفاد المنتج.","answer":true},{"q":"شركات 3PL تتقاضى رسومًا غالبًا لكل طلب أو لكل وحدة تخزين.","answer":true},{"q":"سياسة الاسترجاع الواضحة تقلل ثقة العميل بالشراء.","answer":false},{"q":"إرسال رقم التتبع للعميل يقلل استفسارات «أين طلبي؟».","answer":true},{"q":"التجهيز بالاعتماد على ذاكرة الموظف أدق من الاعتماد على رمز SKU.","answer":false},{"q":"تنفيذ الأسواق الإلكترونية لا يترتب عليه أي رسوم تخزين.","answer":false},{"q":"تحليل أسباب المرتجعات يكشف مشكلات في وصف المنتج أو التغليف.","answer":true},{"q":"مزامنة المخزون بين القنوات تمنع بيع المنتج نفسه مرتين.","answer":true},{"q":"الموسمية لا تؤثر على تخطيط المخزون في التجارة الإلكترونية.","answer":false}],"principle":"قرارات المستودع والمرتجعات تحدد رضا العميل وهامش الربح معًا.","hint":"<p>فكّر في أثر كل عبارة على العميل وعلى السيولة.</p>","why":"يصحح افتراضات شائعة في التشغيل اللوجستي.","axis":"a5"},{"id":"a5e3","title":"خريطة تنفيذ طلباتكم","icon":"🗺️","mode":"group","format":"text","steps":["قسّموا الطلبات حسب الوجهة واختاروا نموذج التنفيذ لكل قسم.","اقترحوا حلًا لمشكلة الكسر.","صمموا مسار مرتجعات من 4 خطوات."],"scenario":"<p>متجر قطري للأواني المنزلية الفاخرة، 80 طلبًا يوميًا (60 داخل الدوحة، 15 خارجها، 5 للخليج). يوصّل حاليًا بسائقَين، ويتأخر في المناطق البعيدة، ونسبة الكسر 4%، والمرتجعات تُعالج عبر واتساب بلا نظام.</p>","principle":"التنفيذ الجيد يجمع النموذج المناسب لكل وجهة مع مخزون مخطط وإدارة طلبات ومرتجعات واضحة.","task":"<p>اكتبوا خطة التنفيذ: النموذج لكل وجهة (الدوحة، خارجها، الخليج) مع السبب، وحلين لتقليل الكسر، ومسار المرتجعات المقترح، ومؤشرين ستتابعونهما أسبوعيًا.</p>","why":"يدمج كل مفاهيم المحور في خطة تشغيلية واحدة قابلة للتنفيذ.","model":"<p>مثال من مجال مختلف: صيدلية توصّل الأدوية؛ طلبات الحي القريب بمندوبها خلال ساعة، والطلبات البعيدة عبر شركة توصيل، والأدوية المبردة في صناديق حافظة للحرارة مع مؤشر «نسبة الوصول في الموعد». طبقوا المنطق نفسه على متجر الأواني.</p>","axis":"a5"},{"id":"a5e4","title":"أكمل الفراغ: لغة العمليات","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"شركة متخصصة تتولى التخزين والتوصيل نيابة عنك تُعرف اختصارًا بـ ___.","answer":"3PL"},{"text":"الكمية الاحتياطية التي تحميك من تأخر المورد تسمى مخزون ___.","answer":"الأمان"},{"text":"المدة التي يحتاجها المورد لإيصال الطلب تسمى مدة ___.","answer":"التوريد"},{"text":"عندما يصل المخزون إلى نقطة إعادة ___ نطلب كمية جديدة.","answer":"الطلب"},{"text":"الرقم الذي يتابع به العميل شحنته يسمى رقم ___.","answer":"التتبع"},{"text":"نظام إدارة ___ يجمع كل الطلبات وحالاتها في مكان واحد.","answer":"الطلبات"},{"text":"المنتجات القليلة التي تحقق معظم الإيرادات تقع في الفئة ___.","answer":"A"},{"text":"وثيقة الشحن التي تُسلّم مع الطرد للناقل تسمى ___ الشحن.","answer":"بوليصة"},{"text":"المنتجات التي يعيدها العملاء تسمى ___.","answer":"المرتجعات"},{"text":"سحب المنتجات من مواقعها لتجهيز الطلب يسمى ___.","answer":"الالتقاط"}],"principle":"المصطلحات الدقيقة توحد لغة الفريق مع شركات الشحن والمستودعات.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط الكلمة ثم الفراغ، واضغط فراغًا ممتلئًا لإفراغه.</p>","why":"يثبت مفردات التشغيل الأساسية.","axis":"a5"}],"highlights":["رحلة الطلب: استلام، تجهيز، تغليف، شحن، تسليم","التوصيل الذاتي مقابل شركات الطرف الثالث (3PL)","تنفيذ الأسواق الإلكترونية وشروطه","تخطيط المخزون ونقطة إعادة الطلب","مؤشرات أداء التنفيذ والتوصيل"],"unit":3,"icon":"truck","color":4,"scene":"complete","title":"من الرف إلى باب العميل","classic":"نماذج التوصيل (داخلي، طرف ثالث 3PL، تنفيذ الأسواق الإلكترونية) وتخطيط المخزون وإدارة الطلبات","duration":"35 دقيقة","desc":"<p>العميل لا يرى مستودعك، لكنه يحكم على متجرك من لحظة وصول الشحنة: هل وصلت في موعدها؟ كاملة؟ سليمة؟ هنا نقارن نماذج التنفيذ والتوصيل، ونتعلم كيف نخطط المخزون وندير الطلب من لحظة الدفع حتى التسليم.</p>","outcome":"يختار نموذج التنفيذ المناسب ويحسب نقطة إعادة الطلب ويصمم مسارًا للمرتجعات."},{"id":"a6","slides":[{"type":"opening","title":"الطرد لا يعبر الحدود وحده","text":"<p>عندما يطلب عميل في الرياض أو لندن منتجك، لا يعبر الطرد الحدود بمجرد تسليمه للناقل. يمر عبر جمارك دولة الوجهة، ويُطلب له تصنيف ومستندات، وقد تُفرض عليه رسوم وضرائب. أي نقص في ذلك يعني تأخيرًا، أو رسومًا مفاجئة على العميل، أو طردًا يعود إليك.</p>","rule":"<p>التجارة عبر الحدود تنجح بالتحضير قبل الشحن، لا بالمعالجة بعد التأخير.</p>","chart":{"kind":"flow","items":["طلب دولي","مستندات وتصنيف","شحن","جمارك الوجهة","تسليم*"]},"id":"a6s1","note":"⏱ 2 د. اسأل: «من جرب البيع خارج قطر؟ وما أول مشكلة واجهها؟»."},{"type":"principle","title":"المستندات الأساسية للشحن الدولي","points":["الفاتورة التجارية: وصف دقيق للمنتج، والكمية، والقيمة الحقيقية، والعملة، وبيانات المرسل والمستلم.","رمز النظام المنسق (HS Code): رمز دولي يصنّف المنتج جمركيًا، ويحدد الرسوم المطبقة عليه.","بلد المنشأ وشهادته: أين صُنع المنتج؟ وقد يحدد ذلك الإعفاء أو الرسوم.","بوليصة الشحن: وثيقة الناقل لتتبع الطرد وإثبات الشحن.","تراخيص خاصة: بعض المنتجات تحتاج موافقات إضافية (أغذية، مستحضرات تجميل، مكملات، إلكترونيات لاسلكية)."],"intro":"<p>شركة الشحن تساعدك في كثير منها، لكن دقة البيانات مسؤوليتك أنت:</p>","rule":"<p>الوصف الغامض مثل «هدايا» أو «مستلزمات» سبب شائع لتأخير الطرود في الجمارك.</p>","chart":{"kind":"cards","items":["🧾 فاتورة تجارية","🔢 رمز HS","🏷️ بلد المنشأ","📄 بوليصة الشحن","✅ تراخيص خاصة"]},"id":"a6s2","note":"⏱ 3 د. اعرض فاتورة تجارية نموذجية وأشر إلى رمز HS والوصف الدقيق."},{"type":"principle","title":"الرسوم الجمركية والضرائب في دولة الوجهة","points":["الرسوم الجمركية: نسبة من قيمة البضاعة حسب رمز HS وقواعد دولة الوجهة.","ضريبة القيمة المضافة في الوجهة: مثلًا 15% في السعودية و5% في الإمارات، وتُحسب عادة على قيمة البضاعة مع الشحن والرسوم.","حد الإعفاء: بعض الدول تعفي الشحنات منخفضة القيمة من الرسوم أو جزء منها، وتختلف الحدود بين الدول وتتغير.","رسوم تخليص: قد يتقاضاها الناقل مقابل إنهاء الإجراءات نيابة عن العميل.","للعلم: لم تطبق قطر ضريبة القيمة المضافة حتى وقت إعداد هذا المحتوى؛ تحقق دائمًا من الوضع الحالي في كل دولة تبيع لها."],"intro":"<p>ما يدفعه العميل الدولي ليس سعر المنتج والشحن فقط. تختلف القواعد من دولة لأخرى، والمبادئ العامة:</p>","rule":"<p>قبل أن تبيع لدولة جديدة، اعرف ثلاثة أرقام: نسبة الرسوم لمنتجك، ونسبة الضريبة، وحد الإعفاء.</p>","chart":{"kind":"equation","items":["قيمة المنتج","الشحن","الرسوم الجمركية","ضريبة الوجهة","= التكلفة التي يدفعها العميل فعلًا"]},"id":"a6s3","note":"⏱ 4 د. نبّه أن القواعد والنسب تتغير؛ المرجع دائمًا الجهات الرسمية وشريك الشحن. اربط بقصة «يو باي»."},{"type":"principle","title":"البيع داخل دول مجلس التعاون الخليجي","points":["التعرفة الجمركية الموحدة: تُطبق دول المجلس تعرفة خارجية موحدة (5% على أغلب السلع المستوردة من خارج المجلس).","المنتجات الوطنية الخليجية: السلع ذات المنشأ الوطني في إحدى دول المجلس تُعامل بمزايا وإعفاءات عند انتقالها بين الدول وفق شروط إثبات المنشأ.","إعادة التصدير: منتج مستورد من خارج الخليج ثم يُعاد بيعه لدولة خليجية أخرى تحكمه قواعد خاصة؛ اسأل شريك الشحن والمخلص الجمركي.","اختلاف ضريبة القيمة المضافة: كل دولة لها نسبتها وقواعد تسجيلها؛ وقد تحتاج تسجيلًا ضريبيًا في دولة الوجهة إذا تجاوزت مبيعاتك حدودًا معينة."],"intro":"<p>السوق الخليجي الأقرب والأكثر تشابهًا في الذوق والقوة الشرائية، ويتميز بإطار جمركي موحد:</p>","rule":"<p>الخليج سوق واحد في الذوق، لكنه أسواق متعددة في الضرائب والتسجيل؛ ادرس كل دولة على حدة.</p>","chart":{"kind":"hub","items":["🌍 البيع الخليجي","تعرفة موحدة 5%","مزايا المنشأ الوطني","قواعد إعادة التصدير","ضريبة كل دولة"]},"id":"a6s4","note":"⏱ 3 د. ميّز بين المنتج الوطني والمعاد تصديره بمثال بسيط."},{"type":"principle","title":"من يدفع الرسوم؟ DDP مقابل DAP","points":["DAP (التسليم في المكان): أنت تدفع الشحن، والعميل يدفع الرسوم والضرائب عند الاستلام. أسهل لك، لكنه قد يفاجئ العميل فيرفض الطرد.","DDP (التسليم خالص الرسوم): أنت تدفع الشحن والرسوم والضرائب مسبقًا وتضيفها للسعر. تجربة أوضح للعميل، لكنها تحتاج حسابًا دقيقًا وشريكًا يدعمها.","المفاجأة عند الباب أحد أسباب رفض الطرود الدولية وتكاليف إعادتها."],"intro":"<p>هذا القرار يؤثر مباشرة على تجربة العميل الدولي:</p>","rule":"<p>إن اخترت DAP فأخبر العميل بوضوح قبل الدفع أنه قد يدفع رسومًا عند الاستلام.</p>","chart":{"kind":"compare","items":["📦 DAP :: الشحن عليك ; الرسوم على العميل عند الباب ; أسهل حسابيًا ; خطر رفض الطرد","✅ DDP :: الشحن والرسوم عليك ; سعر نهائي واضح للعميل ; يحتاج حسابًا دقيقًا ; تجربة أفضل"]},"id":"a6s5","note":"⏱ 3 د. استخدم سيناريو العميل الذي يرفض الطرد عند الباب؛ هذا سؤال في التقييم البعدي."},{"type":"tools","title":"معايير اختيار شريك الشحن","items":["التغطية::هل يغطي المدن والمناطق والدول التي تستهدفها؟ وما مدد التوصيل الفعلية لكل منها؟","التكلفة::السعر حسب الوزن والحجم (الوزن الحجمي)، والرسوم الإضافية للمناطق البعيدة والوقود.","الموثوقية::نسبة التسليم في الموعد، ونسبة التلف والفقد، وسمعته لدى متاجر مشابهة.","التكامل التقني::ربط مع منصة متجرك لإنشاء البوليصة وتحديث التتبع تلقائيًا.","خدمات إضافية::الدفع عند الاستلام، التخليص الجمركي، DDP، المرتجعات الدولية، التخزين.","خدمة العملاء::سرعة الاستجابة لمشكلات الطرود، وقناة تواصل مباشرة للتجار."],"rule":"<p>جرّب شريكين على عينة طلبات حقيقية قبل الالتزام بعقد طويل.</p>","id":"a6s6","note":"⏱ 2 د. شجع على تجربة شريكين على عينة طلبات قبل التعاقد."},{"type":"mistakes","title":"أخطاء تكلف غاليًا في الشحن الدولي","items":["كتابة قيمة أقل في الفاتورة لتقليل الرسوم::ممارسة مخالفة تعرض الطرود للمصادرة والغرامات؛ اكتب القيمة الحقيقية دائمًا.","وصف عام للمنتج مثل «هدايا»::اكتب وصفًا دقيقًا للمادة والاستخدام مع رمز HS الصحيح.","تجاهل قيود بعض المنتجات::العطور والسوائل والبطاريات والأغذية لها قيود شحن ومتطلبات خاصة؛ تحقق قبل عرضها للبيع دوليًا.","إخفاء احتمال الرسوم عن العميل::وضّح قبل الدفع من يدفع الرسوم، أو قدّم سعرًا شاملًا.","الحكم على الناقل بالسعر فقط::قارن مدة التوصيل والموثوقية وخدمة المشكلات والتكامل."],"id":"a6s7","note":"⏱ 2 د. شدد على عدم تخفيض القيمة في الفاتورة، ووضح أنها مخالفة."},{"type":"summary","title":"جاهزية قبل العبور","text":"<p>الشحن عبر الحدود يحتاج مستندات دقيقة، وفهمًا للرسوم والضرائب في كل دولة، وقرارًا واضحًا في من يدفع، وشريكًا موثوقًا بتكامل جيد. بهذا تتحول الحدود من عائق إلى فرصة نمو.</p>","rule":"<p>مستندات دقيقة، تكلفة شفافة للعميل، وشريك مجرّب؛ ثم توسع دولة بعد دولة.</p>","chart":{"kind":"steps","items":["ادرس::رسوم وضرائب الوجهة","جهّز::المستندات ورمز HS","قرّر::DDP أو DAP","جرّب::شريكين على عينة","توسّع::دولة بعد دولة"]},"id":"a6s8","note":"⏱ 1 د. خلاصة اليوم الأول: اطلب من كل متدرب كتابة فكرة واحدة سيطبقها غدًا في مشروعه."}],"exercises":[{"id":"a6e1","title":"جاهز للجمارك؟","icon":"🛃","mode":"individual","format":"mcq","steps":[],"items":[{"q":"ما الذي يحدد التصنيف الجمركي للمنتج دوليًا؟","options":["اسم العلامة التجارية","رقم الطلب","لون العبوة","رمز النظام المنسق (HS Code)"],"answer":3},{"q":"متجر كتب في الفاتورة «هدايا» لطرد عطور. ما النتيجة المحتملة؟","options":["تسريع التخليص","لا أثر","إعفاء كامل من الرسوم","تأخير في الجمارك وطلب معلومات إضافية"],"answer":3},{"q":"في شروط DDP، من يتحمل الرسوم الجمركية والضرائب؟","options":["العميل عند الاستلام","شركة الشحن مجانًا","لا أحد","البائع مسبقًا ضمن السعر"],"answer":3},{"q":"عميل سعودي رفض استلام الطرد بسبب رسوم لم يتوقعها. ما الإجراء الذي كان سيمنع ذلك؟","options":["تغليف أجمل","شحن أسرع","خصم على الطلب التالي","توضيح الرسوم قبل الدفع أو الشحن بشروط DDP"],"answer":3},{"q":"ما نسبة التعرفة الجمركية الخليجية الموحدة على أغلب السلع المستوردة من خارج دول المجلس؟","options":["15%","0%","25%","5%"],"answer":3},{"q":"ما الذي يجب معرفته قبل البيع لدولة جديدة؟","options":["أسماء منافسيك فقط","نسبة الرسوم لمنتجك ونسبة الضريبة وحد الإعفاء","عدد سكانها فقط","ألوان علمها"],"answer":1},{"q":"كتابة قيمة أقل من الحقيقية في الفاتورة التجارية:","options":["تسرّع التخليص","مخالفة قد تعرّض الطرد للمصادرة والتاجر للغرامة","ممارسة ذكية لتوفير الرسوم","إجراء مطلوب للشحنات الصغيرة"],"answer":1},{"q":"أي معيار يقيس موثوقية شريك الشحن؟","options":["شعار الشركة","نسبة التسليم في الموعد ونسبة التلف والفقد","لون سياراته","عدد إعلاناته"],"answer":1},{"q":"قبل توقيع عقد طويل مع شركة شحن جديدة، ما الأسلم؟","options":["تجربة شريكين على عينة طلبات حقيقية والمقارنة","التوقيع فورًا للحصول على الخصم","اختيار الأرخص دون تجربة","الاعتماد على رأي صديق"],"answer":0},{"q":"ما المقصود بالوزن الحجمي؟","options":["وزن الشحنة الشهرية","الوزن الفعلي فقط","وزن محسوب من أبعاد الطرد يُستخدم في التسعير إذا كان أكبر من الوزن الفعلي","وزن المنتج دون تغليف"],"answer":2}],"scenario":"<p>عشرة أسئلة عن مستندات الشحن الدولي والرسوم وقرارات الشحن.</p>","principle":"التحضير الصحيح للمستندات والتكلفة يمنع التأخير والرفض والرسوم المفاجئة.","hint":"<p>الإجابة الأصح هي التي تحمي العميل والتاجر معًا وتلتزم بالأنظمة.</p>","why":"يرسخ المفاهيم الأساسية للتجارة عبر الحدود.","axis":"a6"},{"id":"a6e2","title":"أي العبارتين أدق؟","icon":"⚖️","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"نكتب وصفًا دقيقًا للمنتج مع رمز HS.","b":"نكتب «مستلزمات متنوعة» لتسريع الشحن.","answer":"a"},{"a":"نوضح للعميل قبل الدفع احتمال دفع رسوم عند الاستلام.","b":"نترك الرسوم مفاجأة عند الباب.","answer":"a"},{"a":"نعامل كل دول الخليج كسوق ضريبي واحد.","b":"ندرس ضريبة وتسجيل كل دولة على حدة.","answer":"b"},{"a":"نختار شريك الشحن بالسعر الأقل فقط.","b":"نقارن السعر مع الموثوقية والتكامل والخدمة.","answer":"b"},{"a":"نتحقق من قيود شحن العطور والبطاريات قبل البيع دوليًا.","b":"نعرض كل المنتجات دوليًا ونعالج المشكلات لاحقًا.","answer":"a"},{"a":"نكتب القيمة الحقيقية في الفاتورة التجارية.","b":"نخفض القيمة المكتوبة لتقليل الرسوم على العميل.","answer":"a"},{"a":"نتوسع لكل الدول دفعة واحدة.","b":"نتوسع دولة بعد دولة بعد تجربة ناجحة.","answer":"b"},{"a":"نربط شركة الشحن بالمتجر لتحديث التتبع تلقائيًا.","b":"ننسخ أرقام التتبع يدويًا ونرسلها عند السؤال.","answer":"a"},{"a":"نحسب الوزن الحجمي عند تسعير الشحن.","b":"نحسب السعر بالوزن الفعلي فقط دائمًا.","answer":"a"},{"a":"نعرض سعرًا شاملًا للرسوم عند الشحن بشروط DDP.","b":"نعرض سعر المنتج فقط ونضيف الرسوم بعد الشحن.","answer":"a"}],"principle":"قرارات الشحن الدولي تحتاج التزامًا بالأنظمة وشفافية مع العميل.","hint":"<p>اختاروا العبارة التي تمثل الممارسة الأصح والأكثر أمانًا.</p>","why":"يفتح نقاشًا جماعيًا حول القرارات الحساسة في التجارة عبر الحدود.","axis":"a6"},{"id":"a6e3","title":"خطة دخول سوق خليجي","icon":"🌍","mode":"group","format":"text","steps":["حددوا المتطلبات الخاصة بمنتج غذائي (تراخيص، تغليف، حرارة).","قرروا DDP أو DAP مع السبب.","حددوا معايير اختيار شريك الشحن لهذا المنتج تحديدًا."],"scenario":"<p>علامة قطرية لمنتجات التمور المحشوة والشوكولاتة الفاخرة تريد البيع للسعودية والكويت خلال الربع القادم. تبيع حاليًا داخل قطر فقط، والمنتج غذائي حساس للحرارة، ومتوسط الطلب 250 ريالًا.</p>","principle":"التوسع عبر الحدود يبدأ بدراسة متطلبات الوجهة ثم تجربة مضبوطة مع شريك مناسب.","task":"<p>اكتبوا خطة دخول من خمس نقاط: الدولة الأولى ولماذا، المتطلبات والمستندات، قرار DDP/DAP، معايير شريك الشحن، وتجربة أولية (عدد الطلبات والمؤشر الذي سيحدد النجاح).</p>","why":"يربط مفاهيم الجمارك والشحن بقرار توسع واقعي لمنتج حساس.","model":"<p>مثال من مجال مختلف: علامة مستحضرات عناية تدخل الإمارات؛ بدأت بتسجيل المنتجات لدى الجهة المختصة، وشحنت بشروط DDP بسعر شامل، وجرّبت 50 طلبًا قبل التعاقد السنوي. طبقوا المنطق نفسه على التمور والشوكولاتة.</p>","axis":"a6"},{"id":"a6e4","title":"صح أم خطأ: عبور الحدود","icon":"🧭","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"حدود الإعفاء الجمركي متطابقة في كل الدول.","answer":false},{"q":"ضريبة القيمة المضافة في السعودية 15%.","answer":true},{"q":"المنتجات الغذائية ومستحضرات التجميل قد تحتاج تراخيص إضافية في دولة الوجهة.","answer":true},{"q":"في شروط DAP يدفع البائع كل الرسوم الجمركية مسبقًا.","answer":false},{"q":"الفاتورة التجارية يجب أن تتضمن وصفًا دقيقًا وقيمة حقيقية.","answer":true},{"q":"الرسوم المفاجئة عند الباب قد تؤدي إلى رفض الطرد وإعادته.","answer":true},{"q":"شريك الشحن الأرخص هو الأفضل دائمًا للمتاجر الناشئة.","answer":false},{"q":"السوائل والبطاريات لها قيود في الشحن الجوي تستحق التحقق.","answer":true},{"q":"بلد المنشأ لا يؤثر إطلاقًا على المعاملة الجمركية.","answer":false},{"q":"التوسع التدريجي دولة بعد دولة يقلل المخاطر التشغيلية.","answer":true}],"principle":"القواعد الجمركية والضريبية تختلف بين الدول وتتغير، والتحقق المستمر جزء من العمل.","hint":"<p>انتبه للعبارات المطلقة.</p>","why":"يختبر فهمك لأساسيات الشحن الدولي.","axis":"a6"}],"highlights":["مستندات الشحن الدولي ورمز النظام المنسق HS","الرسوم الجمركية والضرائب في دولة الوجهة","البيع الخليجي والتعرفة الجمركية الموحدة","من يدفع؟ DDP مقابل DAP","معايير اختيار شريك الشحن لكل سوق"],"unit":3,"icon":"globe","color":5,"scene":"globe","title":"خارج الحدود: الشحن الدولي والشريك المناسب","classic":"الشحن عبر الحدود (الجمارك، الرسوم، المستندات، الأنظمة) واختيار شركاء اللوجستيات للأسواق المحلية والإقليمية والدولية","duration":"30 دقيقة","desc":"<p>البيع خارج قطر يفتح أسواقًا أكبر بكثير، لكنه يضيف أسئلة جديدة: من يدفع الرسوم الجمركية؟ ما المستندات المطلوبة؟ كم سيدفع العميل فعلًا عند الباب؟ هنا نفهم أساسيات الشحن عبر الحدود ونبني معايير اختيار شريك الشحن.</p>","outcome":"يجهز مستندات الشحن الدولي ويحسب التكلفة الواصلة للعميل ويختار بين DDP وDAP وشريك الشحن."},{"id":"a7","slides":[{"type":"opening","title":"في السوق الإلكتروني... البائع هو الصفحة","text":"<p>في المتجر الفعلي يستطيع البائع أن يشرح ويطمئن ويجيب. في السوق الإلكتروني لا يوجد إلا صفحة المنتج: صورة، وعنوان، ونقاط، وسعر، وتقييمات. إن لم تُظهرك نتائج البحث فلن يراك أحد، وإن ظهرت بصفحة ضعيفة فسيختار العميل منافسك في الصف نفسه.</p>","rule":"<p>الظهور يجلب النقرة، والصفحة المقنعة تحوّل النقرة إلى شراء.</p>","chart":{"kind":"flow","items":["بحث العميل","الظهور في النتائج","النقرة","صفحة مقنعة","الشراء*"]},"id":"a7s1","note":"⏱ 2 د. اعرض صفحة منتج على سوق إلكتروني واسأل: «هل كنتم ستشترون؟ لماذا؟»."},{"type":"principle","title":"كيف تقرر الأسواق الإلكترونية ترتيب المنتجات؟","points":["الصلة: تطابق العنوان والخصائص والكلمات المفتاحية مع ما يكتبه العميل.","الأداء: معدل النقر، ومعدل التحويل، وحجم المبيعات.","رضا العميل: التقييمات، والمرتجعات، والإلغاءات، وسرعة الرد.","الجاهزية: توفر المخزون، والسعر التنافسي، وسرعة التوصيل (خصوصًا مع برامج تنفيذ السوق)."],"intro":"<p>لكل سوق خوارزميته الخاصة، لكنها تشترك غالبًا في منطق واحد: عرض المنتج الأكثر احتمالًا للبيع وإرضاء العميل. أبرز العوامل:</p>","rule":"<p>الخوارزمية تكافئ المنتج الذي يبيع ويُرضي؛ لا يمكن خداعها طويلًا بالكلمات فقط.</p>","chart":{"kind":"hub","items":["🔎 ترتيب المنتج","الصلة بالبحث","الأداء والمبيعات","رضا العميل","المخزون والسعر والتوصيل"]},"id":"a7s2","note":"⏱ 3 د. وضح أن الخوارزمية تكافئ ما يبيع ويرضي، لا الكلمات فقط."},{"type":"principle","title":"الكلمات المفتاحية: ابدأ من لغة العميل","points":["اكتب في شريط البحث بداية الكلمة ولاحظ الاقتراحات التلقائية؛ هذه عبارات يبحث عنها الناس فعلًا.","راجع عناوين المنافسين الأعلى ترتيبًا، والكلمات المتكررة في تقييماتهم وأسئلتهم.","اجمع العربية والإنجليزية والعامية الشائعة (مثال: عطر عود، oud perfume، دهن عود).","ميّز بين الكلمات العامة (عطر) والكلمات الطويلة المحددة (عطر عود طبيعي للرجال 100 مل)؛ الطويلة أقل منافسة وأعلى نية شراء."],"intro":"<p>العميل لا يبحث باسم منتجك الداخلي، بل بكلماته هو. طريقة عملية لبناء قائمة الكلمات:</p>","rule":"<p>الكلمة المفتاحية الجيدة هي ما يكتبه العميل وهو مستعد للشراء.</p>","chart":{"kind":"vflow","items":["كلمة عامة: عطر","عطر عود","عطر عود للرجال","عطر عود طبيعي للرجال 100 مل*"]},"id":"a7s3","note":"⏱ 4 د. نفذ مباشرة: اكتب «عطر» في شريط بحث سوق إلكتروني ولاحظ الاقتراحات أمام القاعة."},{"type":"principle","title":"تشريح قائمة منتج قوية","points":["العنوان: العلامة + نوع المنتج + الخاصية الأهم + الحجم أو الكمية + الاستخدام. واضح ومقروء، لا قائمة كلمات متراصة.","الصور: الصورة الأولى على خلفية نظيفة حسب شروط السوق، ثم صور الاستخدام، والتفاصيل، والمقاسات، والعبوة.","النقاط الرئيسية: خمس نقاط تبدأ كل منها بالفائدة ثم الخاصية، وتجيب عن أهم أسئلة العميل.","الوصف: قصة المنتج، وطريقة الاستخدام، والمكونات أو المواد، وما يميزه عن البدائل.","الخصائص المنظمة: املأ كل الحقول التي يطلبها السوق (اللون، المادة، المقاس...) لأنها تُستخدم في التصفية والبحث."],"intro":"<p>كل عنصر في صفحة المنتج له وظيفة محددة في قرار الشراء:</p>","rule":"<p>اكتب لعميل مستعجل: ما لا يُفهم في خمس ثوانٍ لا يُقرأ.</p>","chart":{"kind":"table","items":["العنصر ; وظيفته في القرار","العنوان ; الظهور وفهم المنتج فورًا","الصور ; الثقة وتخيّل الاستخدام","النقاط ; الإجابة عن الأسئلة الأهم","الوصف ; التمييز والإقناع","الخصائص ; الظهور في التصفية والبحث"]},"id":"a7s4","note":"⏱ 3 د. استخدم الجدول كقائمة تدقيق لصفحة منتج أحد المتدربين (بموافقته)."},{"type":"examples","title":"عنوان ضعيف وعنوان قوي","items":["ضعيف: «عطر رائع جديد»::لا يذكر العلامة ولا النوع ولا الحجم؛ لن يطابق بحث أحد.","قوي: «بيت العود — عطر عود طبيعي للرجال، ثبات طويل، 100 مل»::علامة + نوع + فئة + فائدة + حجم.","ضعيف: «أفضل ترمس قهوة عطر عود هدية رجال نساء سفر مكتب»::حشو كلمات يربك العميل وقد يخالف شروط السوق.","قوي: «ترمس قهوة عربية ستانلس ستيل، يحفظ الحرارة 12 ساعة، 1 لتر»::كل كلمة تجيب عن سؤال حقيقي.","نقطة ضعيفة: «مصنوع من الستانلس ستيل»::خاصية بلا فائدة واضحة.","نقطة قوية: «قهوتك ساخنة طوال يوم العمل: ستانلس ستيل مزدوج الجدار يحفظ الحرارة 12 ساعة»::فائدة أولًا ثم الخاصية."],"id":"a7s5","note":"⏱ 3 د. اطلب من القاعة تحسين عنوان ضعيف في 60 ثانية."},{"type":"principle","title":"التقييمات والأسئلة: صوت العميل في الصفحة","points":["اطلب التقييم بعد التسليم بطريقة لطيفة وضمن سياسات السوق، دون حوافز مشروطة بتقييم إيجابي.","رُد على التقييمات السلبية بمهنية وحل واضح؛ ردك موجه للقارئ القادم أكثر من صاحب التقييم.","حوّل الأسئلة المتكررة إلى نقاط أو صور في القائمة نفسها.","حلل التقييمات دوريًا: الكلمات المتكررة تكشف نقاط القوة التي تُبرز، والمشكلات التي تُصلح."],"intro":"<p>المشتري يثق بتجارب المشترين قبله أكثر مما يثق بوصفك. لذلك:</p>","rule":"<p>كل تقييم سلبي متكرر هو تعليمات مجانية لتحسين المنتج أو الصفحة.</p>","chart":{"kind":"cycle","items":["تسليم ممتاز","طلب التقييم","رد مهني","تحسين الصفحة والمنتج"]},"id":"a7s6","note":"⏱ 2 د. اسأل: «هل تقرؤون التقييمات السلبية قبل الإيجابية؟»."},{"type":"principle","title":"ظهور متجرك الخاص في محركات البحث","points":["عناوين الصفحات ووصفها: كلمة مفتاحية واضحة في عنوان كل صفحة تصنيف ومنتج.","روابط مقروءة: رابط يحتوي اسم المنتج لا أرقامًا عشوائية.","محتوى أصيل: لا تنسخ وصف المورد كما هو؛ اكتب وصفًا خاصًا بك.","سرعة وتوافق مع الجوال: الصفحات البطيئة تخسر الترتيب والعميل معًا.","الصور: أسماء ملفات ونص بديل يصف الصورة.","محتوى يخدم البحث: أدلة وشروحات تجيب عن أسئلة عملائك (كيف تختار؟ ما الفرق بين؟)."],"intro":"<p>متجرك الخاص يحتاج أيضًا أن يظهر في Google. أساسيات عملية لكل متجر:</p>","rule":"<p>تحسين الظهور في محركات البحث استثمار بطيء النتائج طويل الأثر؛ ابدأ به من اليوم الأول.</p>","id":"a7s7","note":"⏱ 2 د. ركز على الوصف الأصيل وسرعة الصفحة على الجوال."},{"type":"mistakes","title":"أخطاء تُسقط المنتج في نتائج البحث","items":["حشو الكلمات في العنوان::عنوان مقروء بمعادلة واضحة يخدم العميل والخوارزمية معًا.","صور بإضاءة ضعيفة أو خلفيات مزدحمة::صور احترافية بخلفية نظيفة وزوايا متعددة وصورة استخدام.","ترك الخصائص المنظمة فارغة::املأ كل حقل؛ المنتج بلا خصائص يختفي عند التصفية.","نسخ وصف المورد::اكتب وصفًا أصيلًا يبرز الفائدة ويخاطب عميلك المحلي.","تجاهل التقييمات السلبية::رُد بمهنية، وأصلح السبب في المنتج أو الصفحة."],"id":"a7s8","note":"⏱ 1 د. مرور سريع، ثم انتقل إلى تمرين «أعد كتابة القائمة» الجماعي."},{"type":"summary","title":"اظهر أولًا، ثم أقنع","text":"<p>النجاح في الأسواق الإلكترونية معادلة من شقين: ظهور يعتمد على الصلة والأداء ورضا العميل، وإقناع يعتمد على عنوان واضح وصور قوية ونقاط تجيب عن الأسئلة وتقييمات حقيقية.</p>","rule":"<p>اكتب بلغة العميل، وأجب قبل أن يسأل، ودع التقييمات تكمل الإقناع.</p>","chart":{"kind":"equation","items":["كلمات العميل","عنوان واضح","صور مقنعة","تقييمات حقيقية","= ظهور وتحويل أعلى"]},"id":"a7s9","note":"⏱ 1 د. اعرض أفضل عنوان كتبته المجموعات على الشاشة."}],"exercises":[{"id":"a7e1","title":"أعد كتابة القائمة","icon":"✍️","mode":"group","format":"text","steps":["استخرجوا 5 كلمات مفتاحية من لغة العميل (عربية وإنجليزية).","اكتبوا عنوانًا بمعادلة: العلامة + النوع + الخاصية + الحجم + الاستخدام.","اكتبوا 5 نقاط تبدأ بالفائدة، وخطة من 5 صور."],"scenario":"<p>قائمة منتج على سوق إلكتروني بعنوان: «ترمس جديد ممتاز أصلي عرض خاص». صورة واحدة بخلفية مزدحمة، ونقطتان فقط: «جودة عالية» و«سعر مناسب». الخصائص فارغة، ولا توجد تقييمات بعد. المنتج فعليًا: ترمس قهوة عربية ستانلس ستيل مزدوج الجدار، سعة 1 لتر، يحفظ الحرارة 12 ساعة، بلونين.</p>","principle":"القائمة القوية تجمع الكلمات التي يبحث بها العميل مع إجابات أسئلته في عنوان وصور ونقاط واضحة.","task":"<p>اكتبوا: الكلمات المفتاحية الخمس، والعنوان الجديد، والنقاط الخمس، وقائمة الصور الخمس بالترتيب، وإجراءً واحدًا للحصول على أول التقييمات ضمن سياسات السوق.</p>","why":"يطبق معادلة القائمة القوية على منتج حقيقي بجهد جماعي.","model":"<p>مثال من منتج مختلف: سماعة لاسلكية — العنوان: «العلامة — سماعة بلوتوث لاسلكية بعزل ضوضاء، بطارية 30 ساعة، سوداء». نقطة: «ركّز في عملك: عزل ضوضاء نشط يحجب أصوات المكتب». طبقوا المنطق نفسه على الترمس.</p>","axis":"a7"},{"id":"a7e2","title":"اختر الأقوى","icon":"🏆","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أي عنوان أقوى لقائمة عطر؟","options":["«عطر عطر عود مسك عنبر هدية رجال نساء»","«عرض خاص لفترة محدودة»","«عطر رائع جديد»","«بيت العود — عطر عود طبيعي للرجال، ثبات طويل، 100 مل»"],"answer":3},{"q":"ما الطريقة الأسرع لمعرفة ما يبحث عنه العملاء فعلًا؟","options":["اختيار كلمات من القاموس","نسخ اسم المنتج الداخلي","سؤال الموردين","الاقتراحات التلقائية في شريط بحث السوق"],"answer":3},{"q":"لماذا الكلمات الطويلة المحددة مفيدة؟","options":["لأنها لا تحتاج صورًا","لأنها أطول فقط","لأن الخوارزمية تحبها دائمًا","لأنها أقل منافسة وتعكس نية شراء أعلى"],"answer":3},{"q":"أي نقطة أقوى؟","options":["«أفضل منتج في السوق»","«مصنوع من ستانلس ستيل»","«جودة عالية»","«قهوتك ساخنة طوال يوم العمل: ستانلس ستيل مزدوج الجدار يحفظ الحرارة 12 ساعة»"],"answer":3},{"q":"لماذا يجب ملء الخصائص المنظمة (اللون، المادة، المقاس)؟","options":["لأنها تخفض العمولة","لتجميل الصفحة","لا فائدة منها","لأن السوق يستخدمها في التصفية والبحث"],"answer":3},{"q":"تقييم سلبي يشكو من «صغر المقاس مقارنة بالصور». ما أفضل تصرف؟","options":["حذف المنتج","تجاهله","الرد على العميل بحدة","الرد بمهنية وإضافة صورة توضح المقاس مع جدول أبعاد"],"answer":3},{"q":"أي عامل لا يؤثر عادة على ترتيب المنتج في الأسواق الإلكترونية؟","options":["لون شعار البائع في ملفه الشخصي","التقييمات","معدل التحويل","توفر المخزون"],"answer":0},{"q":"ما أفضل صورة أولى في قائمة المنتج غالبًا؟","options":["صورة واضحة للمنتج على خلفية نظيفة وفق شروط السوق","صورة مزدحمة بالنصوص","صورة جماعية لكل المنتجات","صورة الشعار فقط"],"answer":0},{"q":"لتحسين ظهور متجرك الخاص في Google، أي ممارسة صحيحة؟","options":["كتابة وصف أصيل وعناوين صفحات تحتوي الكلمة المفتاحية","نسخ وصف المورد حرفيًا","تغيير الروابط أسبوعيًا","إخفاء النصوص وتكثيف الصور"],"answer":0},{"q":"كيف تطلب التقييمات بطريقة سليمة؟","options":["طلب لطيف بعد التسليم ضمن سياسات السوق دون حوافز مشروطة","مقابل خصم مشروط بتقييم 5 نجوم","عدم طلبها أبدًا","كتابة تقييمات بأسماء وهمية"],"answer":0}],"scenario":"<p>عشرة أسئلة عن الظهور وقوائم المنتجات في الأسواق الإلكترونية.</p>","principle":"الظهور والإقناع يعتمدان على الصلة ورضا العميل ووضوح الصفحة.","hint":"<p>اختر ما يخدم العميل والخوارزمية معًا.</p>","why":"يرسخ معايير الحكم على قائمة المنتج.","axis":"a7"},{"id":"a7e3","title":"أكمل الفراغ: لغة الظهور","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"تطابق العنوان مع ما يكتبه العميل يسمى ___ بالبحث.","answer":"الصلة"},{"text":"الكلمات ___ المحددة أقل منافسة وأعلى نية شراء.","answer":"الطويلة"},{"text":"النقطة القوية تبدأ بذكر ___ ثم الخاصية.","answer":"الفائدة"},{"text":"حقول اللون والمادة والمقاس تسمى الخصائص ___.","answer":"المنظمة"},{"text":"وضع كلمات كثيرة متراصة في العنوان يسمى ___ الكلمات.","answer":"حشو"},{"text":"نسبة من يشتري بعد زيارة الصفحة تسمى معدل ___.","answer":"التحويل"},{"text":"الاقتراحات ___ في شريط البحث تكشف ما يبحث عنه الناس.","answer":"التلقائية"},{"text":"الرد المهني على التقييم ___ يخاطب القارئ القادم.","answer":"السلبي"},{"text":"الوصف ___ أفضل من نسخ وصف المورد.","answer":"الأصيل"},{"text":"النص ___ للصورة يساعد محركات البحث على فهمها.","answer":"البديل"}],"principle":"المصطلحات الموحدة تسرّع العمل مع المسوقين ومديري الأسواق الإلكترونية.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط الكلمة ثم الفراغ، واضغط فراغًا ممتلئًا لإفراغه.</p>","why":"يثبت مفردات المحور بطريقة جماعية.","axis":"a7"},{"id":"a7e4","title":"صح أم خطأ: أساطير البحث","icon":"🔎","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"تكرار الكلمة المفتاحية عشر مرات في العنوان يضمن الصدارة.","answer":false},{"q":"التقييمات والمرتجعات قد تؤثر على ترتيب المنتج.","answer":true},{"q":"نفاد المخزون قد يضعف ظهور المنتج في النتائج.","answer":true},{"q":"الصورة الأولى لا تؤثر على قرار النقر.","answer":false},{"q":"الكلمات العامية الشائعة قد تكون جزءًا من لغة بحث العميل.","answer":true},{"q":"شراء تقييمات وهمية ممارسة آمنة لا تكتشفها الأسواق.","answer":false},{"q":"سرعة الصفحة وتوافقها مع الجوال يؤثران على ظهور المتجر الخاص في محركات البحث.","answer":true},{"q":"يكفي كتابة الوصف بالإنجليزية فقط لسوق عملاؤه عرب.","answer":false},{"q":"تحليل التقييمات يكشف نقاط قوة يمكن إبرازها في الصفحة.","answer":true},{"q":"الخصائص المنظمة تساعد في ظهور المنتج عند استخدام العميل للتصفية.","answer":true}],"principle":"الخوارزميات تكافئ الصلة والأداء ورضا العميل على المدى الطويل.","hint":"<p>فكّر في مصلحة المنصة: عرض ما يبيع ويرضي العميل.</p>","why":"يصحح ممارسات شائعة تضر بالظهور.","axis":"a7"}],"highlights":["كيف تختار الأسواق الإلكترونية ما تعرضه أولًا","الكلمات المفتاحية من لغة العميل","معادلة العنوان والصور والنقاط","التقييمات والأسئلة كعنصر إقناع","تحسين الظهور في محركات البحث للمتجر الخاص"],"unit":4,"icon":"bag","color":6,"scene":"content","title":"صفحة منتج تبيع وحدها","classic":"تحسين الظهور في محركات بحث الأسواق الإلكترونية (Marketplace SEO) وتحسين قوائم المنتجات","duration":"30 دقيقة","desc":"<p>أغلب المشترين في الأسواق الإلكترونية يبدؤون بالبحث، ويقررون خلال ثوانٍ من الصورة والعنوان والسعر والتقييم. هنا نتعلم كيف تظهر في نتائج البحث، وكيف تقنع صفحة المنتج بالشراء دون بائع يشرح.</p>","outcome":"يكتب قائمة منتج قوية بكلمات العميل ويحسن ظهورها في الأسواق الإلكترونية ومحركات البحث."},{"id":"a8","slides":[{"type":"opening","title":"لا تشترِ الزيارات... اشترِ العملاء المربحين","text":"<p>من السهل أن تنفق على الإعلانات وتحصد إعجابات وزيارات. الصعب أن تعرف: كم كلفك العميل الذي اشترى فعلًا؟ وكم سيشتري منك خلال سنة؟ التسويق المبني على البيانات يبدأ من هذين السؤالين، لا من عدد المتابعين.</p>","rule":"<p>قرار الإنفاق التسويقي يُحكم بمقارنة تكلفة جلب العميل بقيمته على المدى الطويل.</p>","chart":{"kind":"balance","items":["قيمة العميل على المدى الطويل","تكلفة جلب العميل"]},"id":"a8s1","note":"⏱ 2 د. اسأل: «كم كلفكم آخر عميل جديد؟ من يعرف الرقم؟». غالبًا لا أحد يعرفه، وهذه نقطة البداية."},{"type":"principle","title":"مسار العميل: لكل مرحلة قناة ورسالة","points":["الوعي: أن يعرف أنك موجود. محتوى قصير، مؤثرون، إعلانات وصول واسع.","الاهتمام والتقييم: أن يقارن ويقتنع. محتوى تعليمي، تقييمات، إعادة استهداف لمن زار.","الشراء: أن يتخذ القرار الآن. إعلانات بحث وتسوق، عروض واضحة، رسائل السلة المتروكة.","الولاء والتوصية: أن يعود ويوصي. بريد ورسائل مخصصة، برنامج ولاء، خدمة ما بعد البيع."],"intro":"<p>العميل لا ينتقل من «لا أعرفك» إلى «اشتريت» في خطوة واحدة. لكل مرحلة هدف وقنوات مختلفة:</p>","rule":"<p>رسالة الوعي لا تصلح للشراء، ورسالة الشراء تزعج من لم يعرفك بعد.</p>","chart":{"kind":"funnel","items":["الوعي","الاهتمام","الشراء","الولاء","التوصية"]},"id":"a8s2","note":"⏱ 3 د. اربط كل مرحلة بقناة من تجربة المتدربين."},{"type":"tools","title":"قنوات الاستقطاب وأين تناسب","items":["إعلانات Meta (إنستغرام وفيسبوك)::استهداف حسب الاهتمامات والسلوك، ممتازة للمنتجات البصرية وإعادة الاستهداف.","إعلانات Google (البحث والتسوق)::تلتقط من يبحث عن منتجك الآن؛ نية شراء عالية.","تيك توك وسناب شات::وصول واسع للفئات الأصغر عمرًا في الخليج، ومحتوى قصير أصيل يتفوق على الإعلان المصقول.","إعلانات الأسواق الإلكترونية::منتجات مُموّلة داخل نتائج البحث في Amazon وNoon؛ قريبة جدًا من لحظة الشراء.","التسويق بالمحتوى::أدلة وفيديوهات تعليمية تبني الثقة والظهور العضوي بتكلفة تراكمية منخفضة.","المؤثرون::ثقة مستعارة وجمهور جاهز؛ اختر حسب التطابق مع جمهورك ومعدل التفاعل الحقيقي، لا عدد المتابعين، وتأكد من الإفصاح الإعلاني ومتطلبات الترخيص المعمول بها.","البريد وواتساب للأعمال::قنوات مملوكة لك للتواصل مع العملاء الحاليين، بموافقتهم."],"rule":"<p>ابدأ بقناة أو قناتين تصل لعميلك فعلًا، وقِس قبل أن تضيف غيرهما.</p>","id":"a8s3","note":"⏱ 3 د. نبّه إلى الإفصاح الإعلاني ومتطلبات الترخيص عند التعامل مع المؤثرين."},{"type":"principle","title":"أرقام التسويق التي تحكم القرار","points":["تكلفة الاستحواذ على العميل (CAC): إجمالي الإنفاق التسويقي ÷ عدد العملاء الجدد.","العائد على الإنفاق الإعلاني (ROAS): الإيرادات من الإعلان ÷ تكلفة الإعلان. عائد 4 يعني 4 ريالات إيراد لكل ريال إنفاق.","معدل التحويل: الطلبات ÷ الزيارات.","متوسط قيمة الطلب (AOV): الإيرادات ÷ عدد الطلبات.","القيمة الدائمة للعميل (CLV): ما يحققه العميل من ربح خلال علاقته بك."],"intro":"<p>خمسة مؤشرات تكفي لقراءة أداء التسويق في أغلب المتاجر:</p>","rule":"<p>العائد على الإنفاق المرتفع لا يعني ربحًا إذا كان هامش المنتج ضعيفًا؛ اربط الأرقام دائمًا بالهامش.</p>","chart":{"kind":"table","items":["المؤشر ; المعادلة ; السؤال الذي يجيب عنه","CAC ; الإنفاق ÷ العملاء الجدد ; كم يكلفني العميل الجديد؟","ROAS ; إيراد الإعلان ÷ تكلفته ; هل يعيد الإعلان ما أنفقته؟","معدل التحويل ; الطلبات ÷ الزيارات ; هل تقنع الصفحة الزوار؟","AOV ; الإيرادات ÷ الطلبات ; كم ينفق العميل في الطلب الواحد؟","CLV ; الربح من العميل طوال العلاقة ; كم يستحق العميل أن أنفق لجلبه؟"]},"id":"a8s4","note":"⏱ 4 د. احسب مثالًا حيًا لتكلفة الاستحواذ والعائد مع القاعة، ثم اربط العائد بالهامش."},{"type":"principle","title":"القيمة الدائمة للعميل (CLV)","points":["القيمة الدائمة ≈ متوسط قيمة الطلب × عدد مرات الشراء في السنة × عدد سنوات العلاقة × هامش الربح.","مثال: طلب متوسطه 200 ريال، يتكرر 4 مرات سنويًا، لمدة سنتين، بهامش 30%: 200 × 4 × 2 × 0.3 = 480 ريالًا ربحًا متوقعًا.","القاعدة العملية: إذا كانت تكلفة جلب العميل 150 ريالًا وقيمته الدائمة 480 ريالًا، فالعلاقة صحية (نحو 3 إلى 1).","طرق رفع القيمة: زيادة قيمة الطلب (منتجات مكملة، باقات)، زيادة التكرار (اشتراكات، تذكير بإعادة الشراء)، إطالة العلاقة (خدمة ممتازة، برنامج ولاء)."],"intro":"<p>صيغة مبسطة وعملية لتقدير قيمة العميل:</p>","rule":"<p>كل تحسين في تجربة ما بعد البيع يرفع القيمة الدائمة ويسمح بإنفاق أكبر على الاستقطاب.</p>","chart":{"kind":"equation","items":["متوسط الطلب","تكرار الشراء","مدة العلاقة","هامش الربح","= القيمة الدائمة للعميل"]},"id":"a8s5","note":"⏱ 3 د. اربط القيمة الدائمة بقصة «ممز ورلد» والمجتمع حول المتجر."},{"type":"principle","title":"إدارة علاقات العملاء وإعادة الاستهداف","points":["التقسيم: عملاء جدد، عملاء متكررون، عملاء خاملون، وعملاء ذوو قيمة عالية؛ لكل فئة رسالة مختلفة.","الرسائل الآلية: ترحيب، تذكير بالسلة المتروكة، تذكير بإعادة الشراء، طلب تقييم، تهنئة بمناسبة.","إعادة الاستهداف: إعلانات تعرض المنتج الذي شاهده الزائر أو تركه في السلة، خلال مدة مناسبة ودون إزعاج.","الموافقة والخصوصية: راسل من وافق فقط، وأتح إلغاء الاشتراك بسهولة."],"intro":"<p>إدارة علاقات العملاء (CRM) تحوّل قائمة المشترين إلى علاقات مخصصة. أبرز تطبيقاتها في المتاجر:</p>","rule":"<p>الرسالة المخصصة في التوقيت المناسب تتفوق على أي عرض عام يُرسل للجميع.</p>","chart":{"kind":"cards","items":["👋 ترحيب::بعد التسجيل","🛒 سلة متروكة::خلال ساعات","🔁 إعادة شراء::قبل نفاد المنتج","⭐ تقييم::بعد التسليم","💤 عميل خامل::عرض عودة"]},"id":"a8s6","note":"⏱ 2 د. اطلب تصميم رسالة سلة متروكة في جملة واحدة."},{"type":"tools","title":"أدوات تتبع سلوك العملاء","items":["Google Analytics 4::الزيارات ومصادرها، مسار التصفح، التحويلات، والإيرادات حسب القناة.","بكسلات الإعلانات::Meta Pixel وTikTok Pixel وغيرهما؛ تقيس التحويلات وتبني جماهير إعادة الاستهداف.","روابط التتبع (UTM)::وسوم تضاف لروابط الحملات لمعرفة أي حملة أو مؤثر جلب كل عملية بيع.","أكواد الخصم المخصصة::كود لكل مؤثر أو حملة لقياس أثرها مباشرة.","لوحات المنصات::تحليلات Shopify ولوحات الأسواق الإلكترونية للمبيعات والتحويل.","خرائط الحرارة وتسجيلات الجلسات::أدوات مثل Hotjar أو Microsoft Clarity تكشف أين يتردد العميل في الصفحة."],"rule":"<p>حملة بلا تتبع هي إنفاق بلا تعلم.</p>","id":"a8s7","note":"⏱ 2 د. تأكد أن الجميع يعرف روابط UTM؛ اعرض مثالًا."},{"type":"mistakes","title":"أخطاء تحرق الميزانية","items":["اختيار مؤثر بعدد المتابعين فقط::قيّم التطابق مع جمهورك ومعدل التفاعل الحقيقي، وقِس بكود خاص أو رابط UTM.","الحكم على الحملة بعدد الإعجابات::احكم بالتحويلات وتكلفة الاستحواذ والعائد على الإنفاق.","رسالة واحدة لكل العملاء::قسّم العملاء وخصص الرسالة حسب المرحلة والسلوك.","إعادة استهداف مزعجة بلا حد::حدد مدة ومرات ظهور، واستبعد من اشترى فعلًا.","إنفاق كل الميزانية على الاستقطاب::خصص جزءًا للاحتفاظ بالعملاء؛ غالبًا يكون أرخص وأربح."],"id":"a8s8","note":"⏱ 1 د. مرور سريع."},{"type":"summary","title":"استقطاب يُقاس وعلاقة تدوم","text":"<p>التسويق المبني على البيانات يربط كل قناة بمرحلة من مسار العميل، ويقيس كل حملة بتكلفة الاستحواذ والعائد، ثم يحول المشتري إلى علاقة مستمرة عبر رسائل مخصصة وإعادة استهداف ذكية تزيد قيمته الدائمة.</p>","rule":"<p>اجلب العميل المناسب، وقِس ما يحدث، وابنِ علاقة تجعله يعود.</p>","chart":{"kind":"cycle","items":["استقطاب","تتبع وقياس","تحويل","علاقة وولاء","توصية"]},"id":"a8s9","note":"⏱ 1 د. انتقل إلى «لعبة ميزانية التسويق» (12 دقيقة)، ثم اعرض لوحة المقارنة من وضع العرض وناقش توزيع المجموعة الفائزة."}],"exercises":[{"id":"a8e1","title":"احسبها صح","icon":"🧮","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أنفقت 3,000 ريال على الإعلانات وحصلت على 60 عميلًا جديدًا. كم تكلفة الاستحواذ؟","options":["20 ريالًا","50 ريالًا","60 ريالًا","180 ريالًا"],"answer":1},{"q":"حملة كلفت 2,000 ريال وحققت إيرادات 8,000 ريال. كم العائد على الإنفاق الإعلاني؟","options":["4","2","10","6"],"answer":0},{"q":"5,000 زيارة أنتجت 100 طلب. كم معدل التحويل؟","options":["20%","5%","2%","0.5%"],"answer":2},{"q":"إيرادات 24,000 ريال من 120 طلبًا. كم متوسط قيمة الطلب؟","options":["2,000 ريال","120 ريالًا","200 ريال","240 ريالًا"],"answer":2},{"q":"طلب متوسطه 150 ريالًا، يتكرر 4 مرات سنويًا، لمدة سنتين، بهامش 25%. كم القيمة الدائمة التقريبية؟","options":["150 ريالًا","300 ريال","1,200 ريال","600 ريال"],"answer":1},{"q":"حملة عائدها على الإنفاق 3، لكن هامش المنتج 20% فقط. ماذا يعني ذلك غالبًا؟","options":["لا علاقة للهامش بالقرار","قد تكون الحملة خاسرة بعد احتساب تكلفة المنتج والإعلان","ربح ممتاز مضمون","يجب مضاعفة الإنفاق فورًا"],"answer":1},{"q":"أي قناة تلتقط العميل الذي يبحث عن منتجك الآن؟","options":["إعلانات البحث والتسوق في Google","إعلانات الوعي الواسع","منشور عضوي قديم","لوحة إعلانية في الشارع"],"answer":0},{"q":"كيف تقيس أثر مؤثر بدقة؟","options":["كود خصم مخصص أو رابط UTM خاص به","عدد الإعجابات على المنشور","عدد متابعيه","شعورك بعد الحملة"],"answer":0},{"q":"أي رسالة أنسب لعميل اشترى القهوة قبل 25 يومًا وعادةً يشتري كل شهر؟","options":["إعلان وعي عام","ترحيب بالعضوية","تذكير بإعادة الشراء قبل نفاد المنتج","لا شيء"],"answer":2},{"q":"تكلفة الاستحواذ 200 ريال والقيمة الدائمة 180 ريالًا. ما الاستنتاج؟","options":["العلاقة صحية","زِد الإنفاق فورًا","كل عميل جديد يخسرك مالًا؛ خفّض التكلفة أو ارفع القيمة الدائمة","لا يمكن استنتاج شيء"],"answer":2}],"scenario":"<p>عشرة أسئلة حسابية ومفاهيمية عن مؤشرات التسويق. استخدم المعادلات التي شرحناها.</p>","principle":"القرار التسويقي يُحكم بالأرقام المرتبطة بالهامش والقيمة الدائمة للعميل.","hint":"<p>CAC = الإنفاق ÷ العملاء الجدد. ROAS = الإيراد ÷ الإنفاق. AOV = الإيرادات ÷ الطلبات.</p>","why":"يحول المعادلات إلى مهارة حساب سريعة قبل أي قرار إنفاق.","axis":"a8"},{"id":"a8e2","title":"قناة لكل مرحلة","icon":"📣","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"نعرض إعلان «اشترِ الآن بخصم» لمن لم يسمع بنا أبدًا.","b":"نعرّف بالعلامة بمحتوى قصير لمن لم يعرفنا بعد.","answer":"b"},{"a":"نختار المؤثر بتطابق جمهوره ومعدل تفاعله.","b":"نختار المؤثر بعدد متابعيه فقط.","answer":"a"},{"a":"نحكم على الحملة بعدد الإعجابات.","b":"نحكم على الحملة بتكلفة الاستحواذ والعائد.","answer":"b"},{"a":"نستبعد من اشترى من إعلانات إعادة الاستهداف للمنتج نفسه.","b":"نستمر في عرض المنتج نفسه لمن اشتراه.","answer":"a"},{"a":"نرسل الرسائل التسويقية لمن وافق عليها.","b":"نرسل الرسائل لكل رقم وصلنا.","answer":"a"},{"a":"نضيف روابط UTM لكل حملة.","b":"نعتمد على التخمين لمعرفة مصدر المبيعات.","answer":"a"},{"a":"نخصص جزءًا من الميزانية للاحتفاظ بالعملاء.","b":"ننفق كل الميزانية على العملاء الجدد.","answer":"a"},{"a":"نرسل عرضًا واحدًا للجميع في كل مناسبة.","b":"نقسّم العملاء ونخصص الرسالة لكل فئة.","answer":"b"},{"a":"نربط العائد على الإنفاق بهامش المنتج.","b":"نعتبر أي عائد أعلى من 1 ربحًا.","answer":"a"},{"a":"نبدأ بقناتين نقيسهما جيدًا.","b":"نفتح كل القنوات دفعة واحدة.","answer":"a"}],"principle":"لكل مرحلة من مسار العميل قناة ورسالة تناسبها.","hint":"<p>اختاروا الممارسة التي تربط القناة بالمرحلة والقياس الصحيح.</p>","why":"يدرب المجموعة على تصميم مزيج تسويقي منطقي.","axis":"a8"},{"id":"a8e3","title":"خطة تسويق 30 يومًا","icon":"🗓️","mode":"group","format":"text","steps":["وزعوا الميزانية على الاستقطاب والاحتفاظ.","اختاروا قناتين للاستقطاب ورسالة لكل منهما.","صمموا 3 رسائل آلية للعملاء الحاليين."],"scenario":"<p>متجر قطري لمنتجات القهوة المختصة بميزانية تسويق شهرية 10,000 ريال. متوسط الطلب 180 ريالًا، والهامش 35%، و40% من العملاء يعودون للشراء شهريًا. المتجر لديه 2,500 متابع على إنستغرام وقائمة 800 عميل وافقوا على الرسائل.</p>","principle":"خطة التسويق الجيدة توزع الميزانية على مراحل المسار وتحدد مؤشرات القياس مسبقًا.","task":"<p>اكتبوا خطة 30 يومًا: توزيع الميزانية بالأرقام، القنوات والرسائل، الرسائل الآلية الثلاث، وثلاثة مؤشرات مع الرقم المستهدف لكل منها (مثل تكلفة استحواذ مستهدفة).</p>","why":"يدمج القنوات والمؤشرات والعلاقة مع العملاء في خطة واحدة.","model":"<p>مثال من مجال مختلف: مطعم صحي بميزانية 8,000 ريال — 60% لإعلانات تيك توك وإنستغرام محليًا، 25% لرسائل العملاء الحاليين (خصم الطلب الثاني)، 15% لتجارب مؤثرين محليين بأكواد خاصة؛ الهدف: تكلفة استحواذ أقل من 40 ريالًا. طبقوا المنطق نفسه على متجر القهوة.</p>","axis":"a8"},{"id":"a8e4","title":"صح أم خطأ: التسويق بالأرقام","icon":"📈","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"عدد المتابعين وحده مقياس كافٍ لنجاح التسويق.","answer":false},{"q":"الاحتفاظ بالعميل الحالي غالبًا أرخص من جلب عميل جديد.","answer":true},{"q":"إذا كانت تكلفة جلب العميل أعلى من قيمته الدائمة فالنمو يستنزف المال.","answer":true},{"q":"روابط UTM تساعد على معرفة الحملة التي جلبت الزيارة.","answer":true},{"q":"إعلانات إعادة الاستهداف تستهدف أشخاصًا لم يزوروا المتجر أبدًا.","answer":false},{"q":"البكسل يساعد على قياس التحويلات وبناء جماهير إعادة الاستهداف.","answer":true},{"q":"رفع تكرار الشراء لا يؤثر على القيمة الدائمة للعميل.","answer":false},{"q":"مراسلة العملاء دون موافقتهم ممارسة سليمة إذا كان العرض مغريًا.","answer":false},{"q":"إعلانات البحث تلتقط عادة نية شراء أعلى من إعلانات الوعي.","answer":true},{"q":"خرائط الحرارة تكشف أين يتردد الزوار داخل الصفحة.","answer":true}],"principle":"الأرقام تحمي الميزانية من الانطباعات.","hint":"<p>تذكّر علاقة تكلفة الاستحواذ بالقيمة الدائمة.</p>","why":"يختبر فهمك لمنطق التسويق المبني على البيانات.","axis":"a8"},{"id":"a8e5","title":"لعبة ميزانية التسويق","icon":"🎯","mode":"group","format":"sim","steps":[],"sim":"budget","scenario":"<p>مجموعتكم مسؤولة عن تسويق متجر قهوة مختصة لمدة شهر بميزانية 10,000 ريال. وزعوا الميزانية على القنوات السبع، وراقبوا الطلبات والعائد وتكلفة الاستحواذ والربح. النتائج تحسب بنموذج فيه «عوائد متناقصة»: مضاعفة الإنفاق على قناة واحدة لا تضاعف نتائجها. المجموعة صاحبة أعلى نقاط تتصدر لوحة المقارنة.</p>","principle":"التسويق المبني على البيانات يوزع الميزانية على مراحل مسار العميل، ويحكم عليها بتكلفة الاستحواذ والعائد والربح والقيمة الدائمة، لا بعدد الزيارات.","hint":"<p>لا تنسوا العملاء الحاليين؛ الاحتفاظ غالبًا أرخص من الاستقطاب. وجرّبوا أكثر من توزيع قبل الحفظ.</p>","why":"يحاكي قرار توزيع الميزانية الحقيقي ويكشف لماذا يفشل وضع كل الميزانية في قناة واحدة.","axis":"a8"}],"highlights":["مسار العميل: وعي، اهتمام، شراء، ولاء","الإعلانات المدفوعة والمحتوى والمؤثرون","مؤشرات التسويق: تكلفة الاستحواذ والعائد على الإنفاق","إدارة علاقات العملاء وإعادة الاستهداف","القيمة الدائمة للعميل وأدوات التتبع"],"unit":4,"icon":"megaphone","color":7,"scene":"megaphone","title":"محرك الاستقطاب والولاء","classic":"الإعلانات المدفوعة ووسائل التواصل والمحتوى والمؤثرون، وإدارة علاقات العملاء وإعادة الاستهداف والقيمة الدائمة للعميل، وأدوات تتبع السلوك","duration":"30 دقيقة","desc":"<p>جلب العميل الأول مكلف، والاحتفاظ به أرخص وأربح. في هذا المحور نبني محركًا متكاملًا: قنوات تجلب زوارًا مناسبين، وتتبع يكشف ما ينجح، وإعادة استهداف تعيد المترددين، وعلاقة تحول المشتري إلى عميل دائم.</p>","outcome":"يوزع ميزانية تسويق على القنوات ويحكم عليها بتكلفة الاستحواذ والعائد والقيمة الدائمة للعميل."},{"id":"a9","slides":[{"type":"opening","title":"ساعات تضيع في نسخ ولصق","text":"<p>صاحب متجر يقضي ساعتين يوميًا في نسخ بيانات الطلبات إلى جدول، ثم إلى نظام شركة الشحن، ثم يرسل رقم التتبع لكل عميل يدويًا. الخطأ في رقم واحد يعني طردًا ضائعًا وعميلًا غاضبًا. هذه الساعات لا تبني المتجر؛ تستهلكه.</p>","rule":"<p>كل مهمة تتكرر يوميًا بالطريقة نفسها مرشحة للأتمتة.</p>","chart":{"kind":"gap","items":["وقت يمكن أن يذهب للنمو","الفجوة","وقت يضيع في مهام يدوية","أخطاء وإرهاق"]},"id":"a9s1","note":"⏱ 2 د. اسأل: «كم ساعة أسبوعيًا تقضون في نسخ ولصق الطلبات؟»."},{"type":"principle","title":"ماذا نؤتمت أولًا؟","points":["متكررة: تحدث كل يوم أو مع كل طلب.","قائمة على قواعد: خطواتها ثابتة ولا تحتاج حكمًا بشريًا في كل مرة.","كثيرة الأخطاء يدويًا: نسخ أرقام وعناوين ورموز.","مؤثرة على العميل: تأخرها يظهر في تجربته مباشرة (تأكيد الطلب، رقم التتبع).","ما لا نؤتمته كليًا: الشكاوى المعقدة، والقرارات الاستثنائية، والتعامل مع العميل الغاضب؛ هنا يبقى الإنسان في الواجهة."],"intro":"<p>ليست كل مهمة تستحق الأتمتة الآن. اختر المهام التي تجمع أكثر من صفة من التالية:</p>","rule":"<p>ابدأ بالمهمة التي توفر أكبر وقت وتمنع أكثر الأخطاء، لا بالمهمة الأكثر إبهارًا.</p>","chart":{"kind":"matrix","items":["عدد مرات التكرار","أثر الخطأ على العميل","مراقبة دورية","أتمتة أولًا ✓","تجاهل مؤقتًا","أتمتة لاحقًا"]},"id":"a9s2","note":"⏱ 3 د. استخدم المصفوفة لتحديد أول مهمة تستحق الأتمتة لكل متدرب."},{"type":"principle","title":"منطق كل أتمتة: محفز، شرط، إجراء","points":["المحفز: الحدث الذي يبدأ الأتمتة. مثال: «وصل طلب جديد مدفوع».","الشرط: فحص اختياري يحدد متى يُنفّذ الإجراء. مثال: «إذا كانت الوجهة خارج قطر».","الإجراء: ما يحدث تلقائيًا. مثال: «أنشئ بوليصة شحن دولي وأرسل رقم التتبع للعميل».","سلاسل الأتمتة: يمكن ربط عدة إجراءات متتالية، مع إشعار للإنسان عند أي استثناء."],"intro":"<p>أي أتمتة مهما بدت معقدة تتكون من ثلاثة أجزاء بسيطة:</p>","rule":"<p>اكتب الأتمتة بجملة واحدة: «عندما يحدث كذا، وإذا كان كذا، افعل كذا».</p>","chart":{"kind":"flow","items":["المحفز: طلب جديد","الشرط: خارج قطر؟","الإجراء: بوليصة دولية","إشعار العميل*"]},"id":"a9s3","note":"⏱ 3 د. اكتب مع القاعة أتمتة واحدة بصيغة «عندما… إذا… افعل…»."},{"type":"examples","title":"أتمتة الطلبات والمخزون وخدمة العملاء","items":["تأكيد الطلب::عند الدفع ← رسالة تأكيد فورية برقم الطلب والموعد المتوقع عبر البريد أو واتساب.","إنشاء الشحنة::عند تحديد الطلب «جاهز» ← إنشاء بوليصة لدى شركة الشحن وإرسال رقم التتبع تلقائيًا.","تنبيه المخزون::عند وصول منتج لنقطة إعادة الطلب ← تنبيه للمشتريات أو مسودة طلب شراء للمورد.","مزامنة القنوات::عند بيع قطعة في أي قناة ← خصمها من المخزون في كل القنوات.","وسم العملاء::عند الطلب الثالث ← نقل العميل لفئة «عميل متكرر» وإرسال شكر خاص.","الأسئلة الشائعة::عند سؤال «أين طلبي؟» ← رد آلي يطلب رقم الطلب ويعرض الحالة، مع تحويل لموظف عند الحاجة.","طلب التقييم::بعد التسليم بيومين ← رسالة لطيفة تطلب التقييم."],"id":"a9s4","note":"⏱ 3 د. اختر مثالين واسأل عن الأدوات التي يستخدمونها حاليًا."},{"type":"principle","title":"المسار الرقمي المتكامل: من البيع إلى الاسترجاع","points":["المبيعات: الطلب من أي قناة يدخل نظامًا واحدًا بحالة «جديد».","الدفع: التأكيد يغيّر الحالة إلى «مدفوع» ويحجز المخزون.","التنفيذ: قائمة تجهيز تلقائية للمستودع، ثم بوليصة ورقم تتبع.","التواصل: إشعار العميل في كل مرحلة دون تدخل يدوي.","الاسترجاع: نموذج طلب إرجاع، موافقة حسب السياسة، ملصق إرجاع، فحص، ثم استرداد وتحديث المخزون.","التقارير: كل ذلك يُسجّل تلقائيًا لتقارير المبيعات والمخزون والمرتجعات."],"intro":"<p>الأتمتة الحقيقية ليست أدوات متفرقة، بل مسار متصل تنتقل فيه البيانات وحدها من مرحلة إلى أخرى:</p>","rule":"<p>إذا كان موظف ينقل البيانات بين نظامين يدويًا، فهناك حلقة مفقودة في المسار.</p>","chart":{"kind":"cycle","items":["طلب","دفع","تجهيز وشحن","تسليم","إرجاع واسترداد","تقارير"]},"id":"a9s5","note":"⏱ 3 د. ارسم المسار المتكامل على السبورة إن أمكن."},{"type":"tools","title":"أدوات بناء الأتمتة والربط","items":["أتمتة المنصة المدمجة::مثل Shopify Flow أو قواعد الأتمتة في منصات المتاجر؛ ابدأ بها لأنها لا تحتاج ربطًا خارجيًا.","منصات الربط دون برمجة::Zapier وMake تربط مئات التطبيقات بمنطق محفز وإجراء.","تكاملات شركات الشحن::تطبيقات رسمية تنشئ البوالص وتحدث التتبع تلقائيًا.","واتساب للأعمال::رسائل آلية للتأكيد والتتبع، وردود سريعة، وتصنيف المحادثات.","المساعدات الذكية للدردشة::تجيب عن الأسئلة الشائعة على مدار الساعة وتحول الحالات المعقدة لموظف.","أنظمة إدارة الطلبات والمخزون::توحّد الطلبات والمخزون من عدة قنوات."],"rule":"<p>كل أداة إضافية نقطة عطل محتملة؛ وثّق كل أتمتة: ماذا تفعل، ومن مسؤول عنها، وماذا تفعل إذا توقفت.</p>","id":"a9s6","note":"⏱ 2 د. نبّه أن كل أداة إضافية نقطة عطل محتملة."},{"type":"mistakes","title":"أخطاء في الأتمتة","items":["أتمتة عملية فوضوية كما هي::نظّم العملية وبسطها أولًا، ثم أتمتها؛ الأتمتة تسرّع الفوضى أيضًا.","إخفاء الإنسان خلف الردود الآلية::اجعل التحويل لموظف متاحًا وسهلًا في أي لحظة.","أتمتة بلا مراقبة::راجع سجلات الأتمتة أسبوعيًا، وفعّل تنبيهًا عند الفشل.","رسائل آلية كثيرة ومكررة::صمم رحلة رسائل متوازنة وقلل التكرار.","عدم توثيق الأتمتة::وثّق المحفز والشرط والإجراء والمسؤول، حتى لا يتوقف كل شيء عند غياب شخص واحد."],"id":"a9s7","note":"⏱ 2 د. شدد على «نظّم ثم أتمت»."},{"type":"summary","title":"أتمت المتكرر، واحفظ الإنسان للمهم","text":"<p>الأتمتة الذكية تبدأ من المهام المتكررة القائمة على قواعد والكثيرة الأخطاء، وتُبنى بمنطق المحفز والشرط والإجراء، وتتصل في مسار واحد من البيع إلى الاسترجاع، مع إنسان حاضر عند الاستثناءات.</p>","rule":"<p>عندما يحدث كذا، وإذا كان كذا، افعل كذا — ثم راقب وحسّن.</p>","chart":{"kind":"steps","items":["اكتشف::المهام المتكررة","نظّم::العملية قبل الأتمتة","أتمت::محفز وشرط وإجراء","راقب::السجلات والتنبيهات","حسّن::بناءً على النتائج"]},"id":"a9s8","note":"⏱ 1 د. انتقل إلى «صمم أتمتتك الأولى»."}],"exercises":[{"id":"a9e1","title":"صمم أتمتتك الأولى","icon":"⚙️","mode":"individual","format":"text","steps":["اختر مهمة متكررة قائمة على قواعد.","حدد المحفز والشرط والإجراء.","حدد متى يتدخل الإنسان."],"scenario":"<p>فكّر في يوم عمل عادي في مشروعك (أو مشروع تعرفه). ما المهمة التي تتكرر كل يوم وتستهلك وقتًا أو تسبب أخطاء؟</p>","principle":"الأتمتة الجيدة تُكتب بجملة واحدة: عندما يحدث كذا، وإذا كان كذا، افعل كذا.","task":"<p>اكتب: المهمة المختارة وكم تستغرق أسبوعيًا، ثم الأتمتة بصيغة (المحفز / الشرط / الإجراء)، والأداة المقترحة، والحالة الاستثنائية التي ستُحوّل لإنسان.</p>","why":"يحول مفهوم الأتمتة إلى تصميم عملي لمشروعك.","model":"<p>مثال من مجال مختلف: عيادة تجميل — المحفز: حجز موعد جديد. الشرط: إذا كان الموعد بعد أكثر من 24 ساعة. الإجراء: رسالة تذكير قبل الموعد بيوم مع رابط التأكيد أو الإلغاء. الاستثناء: إذا لم يؤكد العميل، يتصل موظف الاستقبال. طبّق الطريقة نفسها على مهمتك.</p>","axis":"a9"},{"id":"a9e2","title":"محفز أم شرط أم إجراء؟","icon":"🔗","mode":"individual","format":"mcq","steps":[],"items":[{"q":"في الأتمتة «عندما يصل طلب مدفوع، إذا كان المبلغ أكبر من 2,000 ريال، أرسل تنبيهًا للمدير»، ما المحفز؟","options":["المدير","وصول طلب مدفوع","إرسال التنبيه","المبلغ أكبر من 2,000 ريال"],"answer":1},{"q":"في المثال نفسه، ما الشرط؟","options":["المبلغ أكبر من 2,000 ريال","الدفع","وصول الطلب","إرسال التنبيه"],"answer":0},{"q":"أي مهمة أنسب للأتمتة أولًا؟","options":["إرسال رقم التتبع لكل طلب بعد شحنه","الرد على عميل غاضب بسبب تلف منتج","اختيار منتجات الموسم القادم","التفاوض مع مورد جديد"],"answer":0},{"q":"أي مهمة يجب أن يبقى فيها الإنسان في الواجهة؟","options":["تأكيد الطلب","معالجة شكوى معقدة من عميل مهم","إرسال طلب التقييم","تحديث المخزون بعد البيع"],"answer":1},{"q":"متجر يبيع على ثلاث قنوات ويبيع أحيانًا قطعًا نفدت. ما الأتمتة الأنسب؟","options":["رسائل اعتذار آلية","خصم تلقائي","مزامنة المخزون تلقائيًا بين القنوات عند كل بيع","إيقاف قناتين"],"answer":2},{"q":"قبل أتمتة عملية مرتجعات فوضوية، ما الخطوة الأصح؟","options":["أتمتتها كما هي فورًا","شراء أداة أغلى","تنظيم العملية وتبسيط خطواتها أولًا","إلغاء المرتجعات"],"answer":2},{"q":"ما أهم إجراء بعد تشغيل أي أتمتة؟","options":["مراقبة سجلاتها وتفعيل تنبيه عند الفشل","إخفاؤها عن الفريق","نسيانها","إضافة أتمتة أخرى فورًا"],"answer":0},{"q":"منطق «عندما يصل منتج لنقطة إعادة الطلب، أرسل مسودة طلب شراء للمورد» يخدم أي مجال؟","options":["المخزون والمشتريات","الدفع","التسويق","التصميم"],"answer":0},{"q":"ما فائدة توثيق كل أتمتة؟","options":["لا فائدة","ضمان استمرار العمل وإصلاحها عند غياب الشخص الذي بناها","تجميل التقارير","زيادة عدد الأدوات"],"answer":1},{"q":"رد آلي على سؤال «أين طلبي؟» يجب أن:","options":["يمنع التواصل مع موظف","يعرض الحالة ويتيح التحويل لموظف عند الحاجة","يرسل رسالة عامة فقط","يطلب من العميل الانتظار أسبوعًا"],"answer":1}],"scenario":"<p>عشرة أسئلة عن منطق الأتمتة واختيار ما يُؤتمت.</p>","principle":"كل أتمتة = محفز يبدأها + شرط يحددها + إجراء ينفذها.","hint":"<p>المحفز حدث، والشرط فحص، والإجراء فعل.</p>","why":"يبني حسًا سريعًا لتفكيك أي عملية إلى أجزاء قابلة للأتمتة.","axis":"a9"},{"id":"a9e3","title":"ارسموا المسار المتكامل","icon":"🧭","mode":"group","format":"text","steps":["ارسموا المسار الحالي وحددوا نقاط النقل اليدوي.","صمموا ثلاث أتمتات بصيغة محفز/شرط/إجراء.","صمموا مسار مرتجعات رقميًا."],"scenario":"<p>متجر إلكتروني للعبايات والأزياء المحتشمة يستقبل 120 طلبًا يوميًا من متجره وإنستغرام وسوق إلكتروني. حاليًا: موظفة تنسخ طلبات إنستغرام يدويًا، والمخزون يُحدّث آخر اليوم، والعملاء يسألون عن طلباتهم عبر واتساب طوال اليوم، والمرتجعات (12% بسبب المقاسات) تُسجل في دفتر.</p>","principle":"المسار الرقمي المتكامل ينقل البيانات تلقائيًا من الطلب حتى المرتجع ويترك للإنسان الاستثناءات.","task":"<p>اكتبوا: نقاط النقل اليدوي الحالية، وثلاث أتمتات مقترحة بصيغة (المحفز / الشرط / الإجراء)، ومسار المرتجعات الرقمي بخطواته، ومؤشرًا واحدًا يثبت نجاح التحول بعد شهر.</p>","why":"يدمج مفاهيم الأتمتة في تصميم مسار عمليات كامل لمتجر متعدد القنوات.","model":"<p>مثال من مجال مختلف: مكتبة إلكترونية تبيع كتبًا من متجرها ومعارض الكتب؛ وحّدت الطلبات في نظام واحد، وأتمتت رقم التتبع، وجعلت الإرجاع نموذجًا إلكترونيًا يولّد ملصق إرجاع. المؤشر: انخفاض رسائل «أين طلبي؟» بنسبة 60%. طبقوا المنطق نفسه على متجر العبايات.</p>","axis":"a9"},{"id":"a9e4","title":"أكمل الفراغ: لغة الأتمتة","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"الحدث الذي يبدأ الأتمتة يسمى ___.","answer":"المحفز"},{"text":"الفحص الذي يحدد متى يُنفّذ الإجراء يسمى ___.","answer":"الشرط"},{"text":"ما يحدث تلقائيًا بعد تحقق الشرط يسمى ___.","answer":"الإجراء"},{"text":"منصات مثل Zapier وMake تربط التطبيقات دون ___.","answer":"برمجة"},{"text":"عند بيع قطعة في قناة، ___ المخزون تخصمها من كل القنوات.","answer":"مزامنة"},{"text":"الأتمتة تسرّع العملية المنظمة، وتسرّع ___ أيضًا.","answer":"الفوضى"},{"text":"الحالات الاستثنائية المعقدة تُحوّل إلى ___.","answer":"موظف"},{"text":"مراجعة ___ الأتمتة تكشف الأعطال مبكرًا.","answer":"سجلات"},{"text":"وصف الأتمتة ومسؤولها كتابيًا يسمى ___.","answer":"التوثيق"},{"text":"المسار الذي ينقل البيانات وحدها من الطلب حتى المرتجع يسمى المسار ___.","answer":"المتكامل"}],"principle":"المفردات المشتركة تسهل الحوار مع مزودي الأنظمة والمطورين.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط الكلمة ثم الفراغ، واضغط فراغًا ممتلئًا لإفراغه.</p>","why":"يثبت مصطلحات المحور بطريقة تفاعلية جماعية.","axis":"a9"}],"highlights":["كيف تكتشف المهام التي تستحق الأتمتة","منطق الأتمتة: محفز، شرط، إجراء","أتمتة الطلبات والمخزون وخدمة العملاء","مسار رقمي متكامل من البيع إلى الاسترجاع","أدوات الربط بين الأنظمة"],"unit":5,"icon":"loop","color":8,"scene":"loop","title":"دع الأنظمة تعمل عنك","classic":"أتمتة المهام الروتينية (الطلبات، المخزون، خدمة العملاء) وبناء مسارات رقمية متكاملة للمبيعات والتنفيذ والمرتجعات","duration":"25 دقيقة","desc":"<p>في المتجر الصغير يستطيع صاحبه أن ينسخ الطلبات ويحدّث المخزون ويرد على كل رسالة بنفسه. لكن مع كل زيادة في الطلبات يتحول هذا الجهد اليدوي إلى أخطاء وتأخير وإرهاق. هنا نتعلم ماذا نؤتمت، وكيف نبني مسارًا رقميًا متصلًا من الطلب حتى المرتجع.</p>","outcome":"يصمم أتمتة بصيغة محفز/شرط/إجراء ويرسم مسارًا رقميًا متكاملًا من الطلب حتى الاسترجاع."},{"id":"a10","slides":[{"type":"opening","title":"متجر يعمل حتى لو غبت","text":"<p>صاحب المتجر يعرف كيف يغلف الطلب الهش، ومتى يرد على التقييم السلبي، وما الذي يُكتب في الفاتورة الدولية. لكن عندما ينضم موظف جديد، أو يسافر صاحب المتجر، أو يتضاعف عدد الطلبات، تبدأ الأخطاء. المعرفة غير المكتوبة لا تتوسع.</p>","rule":"<p>ما لا يُكتب لا يُكرر بالجودة نفسها.</p>","chart":{"kind":"compare","items":["🧠 معرفة في الذاكرة :: تعتمد على شخص ; جودة متذبذبة ; تدريب طويل ; توسع صعب","📘 إجراء مكتوب :: يطبقه أي فرد ; جودة ثابتة ; تدريب أسرع ; توسع ممكن"]},"id":"a10s1","note":"⏱ 2 د. اسأل: «لو سافرت أسبوعين، هل يعمل متجرك بالجودة نفسها؟»."},{"type":"principle","title":"هيكل إجراء التشغيل القياسي","points":["العنوان والهدف: ما العملية؟ ولماذا هي مهمة؟","النطاق والمسؤول: متى يُطبّق؟ ومن ينفذه؟ ومن يراجعه؟","الخطوات المرقمة: فعل واضح في كل خطوة، مع صور أو لقطات شاشة عند الحاجة.","معيار الجودة: كيف نعرف أن الخطوة تمت بشكل صحيح؟","الاستثناءات: ماذا نفعل إذا حدث شيء غير متوقع؟ ولمن نصعّد؟","تاريخ المراجعة: الإجراءات تتغير مع الأدوات والسياسات؛ حدّثها دوريًا."],"intro":"<p>الإجراء الجيد قصير وواضح ويمكن اتباعه دون سؤال أحد. عناصره الأساسية:</p>","rule":"<p>اختبر الإجراء بأن تعطيه لشخص جديد: إن نفّذه بلا أسئلة فهو جاهز.</p>","chart":{"kind":"vflow","items":["العنوان والهدف","النطاق والم
