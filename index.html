<!DOCTYPE html>
<!--
  تسريع التجارة الإلكترونية للمشاريع الصغيرة والمتوسطة — منصة تدريبية تفاعلية
  ملف HTML واحد قائم بذاته (Vanilla JS) + Firebase Realtime Database
  الاتصال الحقيقي يعتمد على databaseURL في firebaseConfig (أسفل الملف).
  لمعاينة محلية دون لمس قاعدة البيانات الحقيقية أضف ?demo=1 إلى الرابط.
  يُستضاف كملف HTML عادي (Netlify Drop مثلًا، أو Google Sites بخيار Embed URL).
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8A1538">
<title>تسريع التجارة الإلكترونية للمشاريع الصغيرة والمتوسطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#F6F4F2;
  --bg-dots:#E6DFDB;
  --surface:#FFFFFF;
  --surface-2:#F7FAFB;
  --ink:#1C2340;
  --ink-2:#4A5470;
  --ink-3:#7D879C;
  --line:#E1E9EC;
  --brand:#8A1538;
  --brand-2:#C8702A;
  --brand-3:#D9A62E;
  --mint:#138A5E;
  --danger:#E5484D;
  --ok:#138A5E;
  --ok-bg:#E6F7EE;
  --bad-bg:#FDECEC;
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --sh-1:0 1px 2px rgba(20,40,70,.05),0 4px 14px rgba(20,40,70,.06);
  --sh-2:0 18px 44px rgba(20,40,70,.14);
  --f-display:'Cairo',sans-serif;
  --f-ui:'IBM Plex Sans Arabic',sans-serif;
  --f-body:'Noto Sans Arabic','IBM Plex Sans Arabic',sans-serif;
  --grad:linear-gradient(120deg,#1F3A5F 0%,#8A1538 45%,#138A5E 100%);
  --grad-warm:linear-gradient(120deg,#D9A62E 0%,#C8702A 100%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(var(--bg-dots) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-weight:400;line-height:1.85;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.35;color:var(--ink)}
p{margin:0 0 .5em}
p:last-child{margin-bottom:0}
button,input,select,textarea{font-family:var(--f-ui);font-size:15px}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--brand)}
ul,ol{margin:.3em 0;padding-inline-start:1.3em}
.hidden{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-3)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.num{font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate}

/* ---------- Buttons ---------- */
.btn{font-family:var(--f-ui);font-weight:600;font-size:15px;padding:11px 20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .15s,background .15s,opacity .15s;white-space:nowrap;line-height:1.3;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(138,21,56,.28)}
.btn-primary:hover{box-shadow:0 10px 28px rgba(138,21,56,.38)}
.btn-dark{background:var(--ink);color:#fff}
.btn-soft{background:#F7E8EC;color:var(--brand)}
.btn-soft:hover{background:#CDEAEE}
.btn-ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.btn-ghost:hover{border-color:#DCC3CB}
.btn-mint{background:#00827F;color:#fff}
.btn-danger{background:#FDECEC;color:#C62F35}
.btn-danger:hover{background:#FBDADB}
.btn-sm{padding:7px 13px;font-size:13px}
.btn-xs{padding:4px 10px;font-size:12px;font-weight:600}
.btn-block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);position:relative}
.icon-btn:hover{border-color:#DCC3CB}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:64px;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;flex:1}
.brand-logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px rgba(138,21,56,.3)}
.brand-text{min-width:0}
.brand-title{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:var(--f-ui);font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-ui);font-size:13px;font-weight:600;max-width:220px}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.user-chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){.brand-sub{display:none}.user-chip .nm{display:none}.user-chip{padding:3px}.top-actions .lbl{display:none}.brand-title{font-size:14px}}

.crumbs{display:flex;align-items:center;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-ui);font-weight:600;font-size:14px;color:var(--ink-2)}
.back-btn:hover{border-color:#DCC3CB}
.crumb-tag{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}

/* ---------- Banners ---------- */
.banner{padding:10px 16px;font-family:var(--f-ui);font-size:14px;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;text-align:center}
.banner-iframe{background:#1C2340;color:#fff}
.banner-broadcast{background:var(--grad);color:#fff;font-weight:600}
.banner .x{background:rgba(255,255,255,.2);color:#fff;border-radius:999px;width:28px;height:28px}

/* ---------- Cards & sections ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.pad{padding:22px}
.section{margin:34px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-title{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.sec-kicker{font-family:var(--f-ui);font-size:12px;letter-spacing:.5px;font-weight:700;color:var(--brand);text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-family:var(--f-ui);font-size:12.5px;font-weight:600;background:#F3E9EC;color:var(--ink-2);white-space:nowrap}

/* ---------- Hero ---------- */
.hero{position:relative;margin:22px 0 10px;border-radius:var(--r-xl);overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-2)}
.hero-cover{position:relative;background:linear-gradient(135deg,#E2F3F5,#FFF0E0 55%,#FFF6DB);line-height:0}
.hero-cover svg,.hero-cover img{width:100%;height:auto;display:block;max-height:380px;object-fit:cover}
.hero-body{padding:26px 28px 28px}
.hero h1{font-size:clamp(26px,4.4vw,42px);font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.hero-desc{color:var(--ink-2);font-size:16.5px;max-width:760px;margin-top:8px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--ink)}
.stat span{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}

/* ---------- Axis grid ---------- */
.axis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.axis-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;box-shadow:var(--sh-1);text-align:start}
.axis-card:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.axis-art{position:relative;height:170px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding-top:34px}
.axis-art img{width:100%;height:100%;object-fit:cover}
.axis-art .decor{position:absolute;inset:0}
.axis-art .axis-icon{position:relative;width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.axis-no{position:absolute;top:12px;inset-inline-start:12px;max-width:calc(100% - 24px);background:rgba(255,255,255,.92);color:var(--ink);font-family:var(--f-ui);font-weight:700;font-size:11.5px;line-height:1.5;padding:4px 11px;border-radius:14px}
.unit-head{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;padding:8px 16px 8px 0;margin-top:14px;border-inline-start:6px solid var(--brand);border-image:var(--grad) 1}
.unit-head:first-child{margin-top:0}
.unit-head .unit-no{font-family:var(--f-ui);font-size:12.5px;font-weight:700;color:var(--brand)}
.unit-head h3{font-size:clamp(17px,2.2vw,21px);font-weight:800}
.axis-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.axis-title{font-size:18px;font-weight:800}
.axis-classic{font-family:var(--f-ui);font-size:13px;color:var(--ink-3);line-height:1.6}
.axis-desc{color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.axis-desc p{margin:0}
.axis-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.axis-card.disabled{filter:grayscale(.85);opacity:.62}
.soon-badge{position:absolute;top:12px;inset-inline-end:12px;background:#1C2340;color:#fff;font-family:var(--f-ui);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;z-index:2}

/* Activities */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.act-card{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:start;box-shadow:var(--sh-1);transition:transform .15s}
.act-card:hover{transform:translateY(-2px)}
.act-ico{font-size:26px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#FFF4D6,#FFE8D1);display:flex;align-items:center;justify-content:center;flex:none}
.act-card h3{font-size:16px}
.lab-banner{display:flex;gap:20px;align-items:center;padding:22px;border-radius:26px;background:#1C2340;color:#fff;cursor:pointer;overflow:hidden;position:relative}
.lab-banner h3{color:#fff;font-size:22px}
.lab-banner p{color:#CDD5E3}
.lab-banner .lab-ico{width:74px;height:74px;border-radius:22px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}

/* ---------- Deck ---------- */
.axis-hero{display:flex;gap:18px;align-items:center;padding:20px;border-radius:26px;color:#fff;position:relative;overflow:hidden;margin-top:8px}
.axis-hero h1{color:#fff;font-size:clamp(22px,3.4vw,32px)}
.axis-hero .sub{opacity:.9;font-family:var(--f-ui);font-size:14px}
.axis-hero .big-ico{width:70px;height:70px;border-radius:20px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.deck{margin-top:18px;background:var(--surface);border-radius:28px;border:1px solid var(--line);box-shadow:var(--sh-2);overflow:hidden;position:relative}
.deck-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.deck-dots{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.deck-dot{height:6px;flex:1;min-width:8px;max-width:40px;border-radius:6px;background:#DCE6EA;cursor:pointer;transition:background .2s}
.deck-dot.on{background:var(--ac,var(--brand))}
.deck-count{font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--ink-3)}
.deck-viewport{overflow:hidden;touch-action:pan-y;transition:height .35s ease}
.deck-track{display:flex;align-items:flex-start;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.slide{flex:0 0 100%;min-width:0;padding:26px 28px 30px}
.slide-type{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;color:#fff;background:var(--ac,var(--brand));margin-bottom:10px}
.slide h2{font-size:clamp(20px,2.8vw,28px);font-weight:800;margin-bottom:14px}
.slide-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:start}
.slide-grid.single{grid-template-columns:1fr}
@media (max-width:860px){.slide-grid{grid-template-columns:1fr}.slide{padding:20px 18px 24px}}
.slide-text{font-size:16.5px;color:var(--ink-2)}
.slide-text .lede{font-weight:700;color:var(--ink)}
.slide-img{width:100%;border-radius:18px;margin-bottom:16px;max-height:340px;object-fit:cover;display:block}
.rule-box{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--acg,#F7E8EC);border-inline-start:5px solid var(--ac,var(--brand));font-weight:600;color:var(--ink)}
.rule-box .lbl{display:block;font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--ac,var(--brand));margin-bottom:2px}
.points{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.points li{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.points li .n{width:26px;height:26px;border-radius:9px;background:var(--ac,var(--brand));color:#fff;font-family:var(--f-ui);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.pairs{display:grid;gap:10px;margin-top:6px}
.pair{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.pair .h{padding:9px 14px;font-weight:700;font-family:var(--f-ui);background:var(--acg,#F7E8EC);color:var(--ink)}
.pair .b{padding:10px 14px;color:var(--ink-2)}
.pair.mis .h{background:#FDECEC;color:#A12A2E}
.pair.mis .b{background:#EEFAF3;color:#146B40}
.pair.mis .b::before{content:"✓ التصحيح: ";font-weight:700}
.pair.tool .h::before{content:"🛠 ";}
.slide-visual{min-width:0}
.slide-visual svg{width:100%;height:auto;display:block}
.slide-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.video-box{position:relative;width:100%;padding-top:56.25%;border-radius:16px;overflow:hidden;background:#000;margin-top:16px}
.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.deck-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);gap:10px}
.deck-arrow{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.deck-arrow[disabled]{opacity:.25}
.swipe-hint{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}

/* ---------- Exercises list ---------- */
.ex-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ex-item{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:start;transition:transform .15s,border-color .15s}
.ex-item:hover{transform:translateY(-2px);border-color:var(--ac,#DCC3CB)}
.ex-item .ico{font-size:22px;width:46px;height:46px;border-radius:14px;background:var(--acg,#F7E8EC);display:flex;align-items:center;justify-content:center;flex:none}
.ex-item h4{font-size:15px;font-weight:700}
.ex-item .done{margin-inline-start:auto;color:var(--ok);font-size:18px}
.nav-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.nav-row .btn{flex:1;min-width:150px}

/* ---------- Exercise page ---------- */
.ex-head{display:flex;gap:16px;align-items:center;margin-top:8px}
.ex-head .ico{font-size:34px;width:70px;height:70px;border-radius:22px;background:var(--acg,#F7E8EC);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line)}
.ex-head h1{font-size:clamp(21px,3vw,30px);font-weight:800}
.ex-block{margin-top:16px;padding:18px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.ex-block>.lbl{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:15px;margin-bottom:8px;color:var(--ink)}
.ex-block.scenario{background:linear-gradient(135deg,#FFFDF6,#FFF7EE);border-color:#F2E4D3}
.ex-block.extract{background:var(--acg,#F7E8EC);border:none}
.ex-block.principle{border-inline-start:5px solid var(--ac,var(--brand))}
.ex-block.task{background:#1C2340;color:#fff;border:none}
.ex-block.task>.lbl{color:#D9A62E}
.ex-block.task p,.ex-block.task li{color:#F3E9EC}
.ex-block.hint{background:#FFF7E6;border-color:#FBE3B1}
.steps-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps-list li{display:flex;gap:10px;align-items:flex-start}
.steps-list .n{width:26px;height:26px;border-radius:50%;background:var(--ac,var(--brand));color:#fff;font-family:var(--f-ui);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.ex-img{width:100%;max-height:360px;object-fit:cover;border-radius:22px;margin-top:14px;display:block}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.model-box .model-body{margin-top:10px;padding:12px 14px;border-radius:14px;background:#EEFAF3;color:#10573A}

/* Answer box */
.answer-box{margin-top:16px;padding:18px 20px;border-radius:22px;background:var(--surface);border:2px solid var(--ac,var(--brand));box-shadow:var(--sh-1)}
.answer-box textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--f-body);font-size:15.5px;line-height:1.8;resize:vertical;background:var(--surface-2)}
.answer-box textarea:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #9FD5DD;border-color:#C98A9C}
.answer-view{padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--line);white-space:pre-wrap}
.locked-note{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:#EEF3F5;color:var(--ink-3);font-family:var(--f-ui);font-weight:600}
.group-picker{margin-top:16px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.group-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.group-btn{padding:8px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-ui);font-weight:600;font-size:14px}
.group-btn.on{background:var(--ac,var(--brand));color:#fff;border-color:transparent}
.assign-hint{padding:10px 14px;border-radius:12px;background:#FFF7E6;border:1px solid #FBE3B1;font-family:var(--f-ui);font-size:14px;margin-top:6px}
.members-line{margin-top:10px;font-family:var(--f-ui);font-size:13.5px;color:var(--ink-2)}

/* Interactive formats */
.q-card{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);margin-top:10px}
.q-card .qt{font-weight:700;margin-bottom:8px;display:flex;gap:8px}
.q-card .qn{width:26px;height:26px;border-radius:8px;background:var(--acg,#F7E8EC);color:var(--ink);font-family:var(--f-ui);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);text-align:start;font-family:var(--f-body);font-size:15px;width:100%}
.opt:hover:not([disabled]){border-color:#C98A9C}
.opt.sel{border-color:var(--ac,var(--brand));background:var(--acg,#F7E8EC);font-weight:600}
.opt .mk{width:22px;height:22px;border-radius:50%;border:2px solid #BCCAD2;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px}
.opt.sel .mk{border-color:var(--ac,var(--brand));background:var(--ac,var(--brand));color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--danger);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.poll{position:relative;overflow:hidden}
.opt.poll>*{position:relative}
.opt.poll .poll-bar{position:absolute;inset-block:0;inset-inline-start:0;background:var(--acg,#F7E8EC);border-radius:10px;transition:width .5s ease;z-index:0}
.opt.poll.sel .poll-bar{background:var(--ac,var(--brand));opacity:.18}
.opt.poll.right .poll-bar{background:var(--ok);opacity:.18}
.opt.poll.wrong .poll-bar{background:var(--danger);opacity:.16}
.opt .poll-pct{font-family:var(--f-ui);font-weight:700;font-size:14px;color:var(--ink-2);min-width:42px;text-align:end}
.poll-total{margin-top:6px;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}
.tf-row{display:flex;gap:8px}
.tf-row .opt{justify-content:center;width:auto;flex:1}
.disabled-area{opacity:.55;pointer-events:none;filter:grayscale(.3)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:16px;background:#F8EEF1;border:1px dashed #8FCFD8;margin-top:10px;min-height:52px}
.chip{padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid #A9DAE1;font-family:var(--f-ui);font-weight:600;font-size:14px}
.chip.sel{background:var(--ac,var(--brand));color:#fff;border-color:transparent}
.chip.used{opacity:.3;text-decoration:line-through}
.blank{display:inline-flex;min-width:110px;padding:2px 12px;margin:0 4px;border-radius:10px;border:2px dashed #C98A9C;background:#fff;font-family:var(--f-ui);font-weight:700;color:var(--brand);justify-content:center;vertical-align:middle;line-height:1.7}
.blank.filled{border-style:solid;background:var(--acg,#F7E8EC)}
.blank.right{border-color:var(--ok);background:var(--ok-bg);color:#10573A}
.blank.wrong{border-color:var(--danger);background:var(--bad-bg);color:#A12A2E}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:620px){.cmp-row{grid-template-columns:1fr}}
.cmp-opt{padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);text-align:start;font-family:var(--f-body);font-size:15px;line-height:1.7;min-height:70px}
.cmp-opt b{font-family:var(--f-ui);color:var(--ink-3);display:block;font-size:12px}
.cmp-opt.sel{border-color:var(--ac,var(--brand));background:var(--acg,#F7E8EC)}
.cmp-opt.compact{padding:6px 10px;min-height:0;font-size:13.5px;line-height:1.6;border-radius:10px}
.cmp-opt.right{border-color:var(--ok);background:var(--ok-bg)}
.cmp-opt.wrong{border-color:var(--danger);background:var(--bad-bg)}
.correct-note{font-family:var(--f-ui);font-size:12.5px;color:#10573A;margin-top:4px}
.save-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.status-note{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}

/* Feed */
.feed{margin-top:18px}
.feed-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.feed-head h3{font-size:18px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#FF3D5A;box-shadow:0 0 0 0 rgba(255,61,90,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,61,90,.55)}70%{box-shadow:0 0 0 10px rgba(255,61,90,0)}100%{box-shadow:0 0 0 0 rgba(255,61,90,0)}}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.post{padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.post.mine{border-color:var(--ac,var(--brand));box-shadow:0 0 0 3px var(--acg,#F7E8EC)}
.post-head{display:flex;align-items:center;gap:8px}
.post-head .av{width:32px;height:32px;border-radius:50%;background:var(--acg,#F7E8EC);color:var(--ink);font-weight:700;font-family:var(--f-ui);display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.post-head .who{font-family:var(--f-ui);font-weight:700;font-size:14px;line-height:1.3}
.post-head .role{font-family:var(--f-ui);font-size:12px;color:var(--ink-3);line-height:1.3}
.post-body{white-space:pre-wrap;font-size:15px;color:var(--ink-2)}
.post-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.like-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-ui);font-weight:600;font-size:13px}
.like-btn.on{background:#FFF0E0;border-color:#FFCF99}
.like-btn[disabled]{opacity:.6;cursor:default}
.del-btn{margin-inline-start:auto;color:#C62F35;font-size:13px;padding:3px 8px;border-radius:8px}
.del-btn:hover{background:#FDECEC}
.empty{padding:22px;border-radius:18px;border:1.5px dashed var(--line);text-align:center;color:var(--ink-3);font-family:var(--f-ui)}
.group-answers{display:grid;gap:12px;margin-top:12px}
.ga-card{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.ga-card.mine{border-color:var(--ac,var(--brand));box-shadow:0 0 0 3px var(--acg,#F7E8EC)}
.ga-card h4{font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.ga-item{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ga-item:last-child{border-bottom:none}
.ga-item .qn{font-family:var(--f-ui);font-weight:700;color:var(--ink-3);min-width:22px}
.tag-ok{color:var(--ok);font-weight:700}
.tag-bad{color:var(--danger);font-weight:700}

/* ---------- Lab ---------- */
.lab-timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;border-radius:22px;background:#1C2340;color:#fff}
.lab-timer .clock{font-family:var(--f-display);font-size:40px;font-weight:800;letter-spacing:1px;direction:ltr}
.lab-timer .muted{color:#B3BDD1}
.stage{margin-top:14px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.stage.locked{background:#F0F5F6}
.stage h3{font-size:17px;display:flex;align-items:center;gap:10px}
.stage .no{width:30px;height:30px;border-radius:10px;background:var(--grad);color:#fff;font-family:var(--f-ui);font-size:14px;display:flex;align-items:center;justify-content:center}
.lock-note{margin-top:8px;font-family:var(--f-ui);font-weight:700;color:var(--ink-3)}
.lab-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lab-group{padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.lab-group h4{font-size:16px;margin-bottom:8px}
.lab-ans{padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.lab-ans .st{font-family:var(--f-ui);font-weight:700;font-size:12.5px;color:var(--brand)}

/* ---------- Account ---------- */
.progress{height:12px;border-radius:12px;background:#E2ECEF;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--grad);border-radius:12px;transition:width .5s}
.big-pct{font-family:var(--f-display);font-size:46px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.badge{text-align:center;padding:14px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);position:relative}
.badge .medal{width:84px;height:84px;margin:0 auto 8px;display:block}
.badge h5{margin:0;font-family:var(--f-ui);font-size:13px;line-height:1.5}
.badge .pct{font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.badge.locked .medal{filter:grayscale(1);opacity:.35}
.badge .lock{position:absolute;top:10px;inset-inline-end:12px;font-size:14px}
.congrats-card{border-radius:26px;overflow:hidden;background:linear-gradient(135deg,#FFF8EC,#FFF3E6 50%,#F6EAED);border:1px solid #F2E2CF;padding:30px;text-align:center;position:relative}
.congrats-card .emo{font-size:52px}
.congrats-card h2{font-size:28px;margin:6px 0 12px}
.congrats-card .nm{font-family:var(--f-display);font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.congrats-foot{display:flex;justify-content:space-between;margin-top:18px;font-family:var(--f-ui);font-size:13px;color:var(--ink-2);gap:10px;flex-wrap:wrap}
.notice{padding:12px 14px;border-radius:14px;background:#FFF7E6;border:1px solid #FBE3B1;font-family:var(--f-ui);font-size:14px;margin-top:12px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-family:var(--f-ui);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-family:var(--f-body);font-size:15px;width:100%}
.field textarea{min-height:90px;resize:vertical;line-height:1.8}
.field .help{font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* Rich editor */
.rte{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.rte-bar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-bottom:1px solid var(--line);background:#fff;align-items:center}
.rte-bar button{min-width:32px;height:32px;border-radius:8px;font-weight:700;font-size:14px;color:var(--ink-2)}
.rte-bar button:hover{background:#F3E9EC}
.rte-bar select{height:32px;border-radius:8px;border:1px solid var(--line);padding:0 6px;font-size:13px;background:#fff}
.rte-bar input[type=color]{width:34px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.rte-bar .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.rte-area{min-height:90px;padding:10px 12px;outline:none;line-height:1.8;font-family:var(--f-body);font-size:15px}
.rte-area:focus{background:#fff}

/* Image picker */
.img-pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.img-pick .thumb{width:84px;height:60px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:#F3E9EC}
.img-pick .err{color:var(--danger);font-family:var(--f-ui);font-size:12.5px}

/* ---------- Modals & toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(28,35,64,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:24px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(20,30,55,.35);animation:pop .18s}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:20px;margin-bottom:10px}
.modal .actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1C2340;color:#fff;padding:12px 20px;border-radius:14px;font-family:var(--f-ui);font-weight:600;z-index:200;box-shadow:var(--sh-2);max-width:92vw;text-align:center;animation:pop .2s}
.float-badge{position:fixed;bottom:20px;inset-inline-start:20px;z-index:90;background:#1C2340;color:#fff;padding:12px 18px;border-radius:999px;font-family:var(--f-ui);font-weight:700;box-shadow:var(--sh-2)}

/* ---------- Login ---------- */
.login{max-width:980px;margin:26px auto;display:grid;grid-template-columns:1.05fr 1fr;border-radius:30px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-2)}
.login-art{background:linear-gradient(145deg,#DFF1F4,#FFEEDC 60%,#FFF6DB);display:flex;align-items:center;justify-content:center;padding:18px}
.login-art svg{width:100%;height:auto}
.login-form{padding:30px 28px}
.login-form h1{font-size:26px;font-weight:800;margin-bottom:6px}
.or-line{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-family:var(--f-ui);font-size:13px;margin:14px 0}
.or-line::before,.or-line::after{content:"";height:1px;background:var(--line);flex:1}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-art{max-height:260px;overflow:hidden}}

/* ---------- Footer ---------- */
.footer{margin-top:60px;background:#1C2340;color:#D4DBE8;padding:34px 0 26px}
.footer .wrap{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.footer .nm{font-family:var(--f-display);font-size:20px;font-weight:800;color:#fff}
.footer .bio{font-size:14px;max-width:560px}
.footer a{color:#D9A62E;font-family:var(--f-ui);font-weight:600;text-decoration:none;direction:ltr}
.socials{display:flex;gap:10px;margin-top:8px}
.socials a{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;transition:background .15s}
.socials a:hover{background:rgba(255,255,255,.18)}

/* ---------- Admin ---------- */
.admin-top{display:flex;align-items:center;gap:12px;margin:20px 0 8px;flex-wrap:wrap}
.admin-top h1{font-size:26px;font-weight:800;flex:1}
.bell-wrap{position:relative}
.bell-dot{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#FF3D5A;color:#fff;font-family:var(--f-ui);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.bell-menu{position:absolute;top:46px;inset-inline-end:0;width:min(360px,92vw);max-height:420px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);z-index:60;padding:8px}
.bell-item{padding:9px 10px;border-radius:12px;font-size:13.5px;font-family:var(--f-ui);display:flex;gap:8px}
.bell-item.unread{background:#F6EAED}
.bell-item .t{color:var(--ink-3);font-size:12px}
.admin-band{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.admin-band .bar{width:6px;height:28px;border-radius:6px;background:var(--bc,var(--brand))}
.admin-band h2{font-size:19px;font-weight:800}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tool{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);min-height:170px}
.tool .th{display:flex;align-items:center;gap:10px}
.tool .th .ti{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.tool .th h4{font-size:15px;font-weight:700;line-height:1.4}
.tool .tb{font-size:13.5px;color:var(--ink-2);font-family:var(--f-ui);flex:1}
.tool .tb .bigno{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--ink);line-height:1.2}
.tool .tf{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tool-drop{grid-column:1/-1;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1)}
.tool.danger-tool{border-color:#F5C2C4;background:#FFF7F7}
.acc{border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px;overflow:hidden;border-inline-start:6px solid var(--ac,var(--brand))}
.acc-head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--acg,#F2F7F8);cursor:pointer;flex-wrap:wrap}
.acc-head .aico{width:40px;height:40px;border-radius:12px;background:var(--ac,var(--brand));display:flex;align-items:center;justify-content:center;flex:none}
.acc-head h3{font-size:15.5px;font-weight:700;flex:1;min-width:160px}
.acc-head .arrow{transition:transform .2s;font-size:14px;color:var(--ink-3)}
.acc.open .acc-head .arrow{transform:rotate(-90deg)}
.acc-body{padding:12px 14px;display:none}
.acc.open .acc-body{display:block}
.acc-actions{display:flex;gap:6px;flex-wrap:wrap}
.drag-handle{cursor:grab;font-size:18px;color:var(--ink-3);padding:0 4px;user-select:none}
.acc.dragging{opacity:.5}
.acc.drop-target{outline:3px dashed var(--brand);outline-offset:2px}
.ex-row{padding:10px 0;border-bottom:1px dashed var(--line)}
.ex-row:last-child{border-bottom:none}
.ex-row .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex-row .nm{font-weight:700;font-family:var(--f-ui);font-size:14px;flex:1;min-width:180px}
.ex-row .summary{margin-top:6px;font-size:13px;color:var(--ink-2);font-family:var(--f-ui);background:var(--surface-2);border-radius:12px;padding:8px 10px}
.ex-row .summary .it{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-family:var(--f-ui);font-size:11.5px;font-weight:700}
.tag.added{background:#E7F8F2;color:#0B7A5E}
.tag.mod{background:#FFF1DB;color:#9A5B00}
.tag.hid{background:#EEE;color:#555}
.tag.off{background:#FDECEC;color:#A12A2E}
.tag.fmt{background:#F7E8EC;color:var(--brand)}
.slide-editor{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:var(--surface-2)}
.slide-editor .se-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.item-editor{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:#fff}
.form-page{max-width:900px;margin:0 auto}
.sticky-actions{position:sticky;bottom:0;background:rgba(243,247,248,.94);backdrop-filter:blur(6px);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:20px;z-index:20}
.assign-group{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.assign-group .ag-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);cursor:pointer}
.assign-group .ag-body{padding:12px;display:none}
.assign-group.open .ag-body{display:block}
.chk-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff}
.chk-list label{display:flex;gap:8px;align-items:center;padding:4px 0;font-family:var(--f-ui);font-size:14px}
.member-box{margin-top:10px;padding:10px;border-radius:12px;background:#F8EEF1}
.member-box .m{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;margin:3px;font-family:var(--f-ui);font-size:13px}
.people-list{display:grid;gap:6px}
.person{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-family:var(--f-ui);font-size:14px;flex-wrap:wrap}
.person .nm{flex:1;min-width:140px;font-weight:600}

/* شاشة معتمة (زر B في جهاز المؤشر) */

<script>
const COURSE = Object.freeze({"axes":[{"id":"a1","slides":[{"type":"opening","title":"السؤال الأول ليس «كيف»، بل «أين»","text":"<p>كثير من المشاريع تبدأ من اختيار قالب جميل أو تطبيق مشهور، ثم تكتشف بعد أشهر أن المنصة لا تناسب طريقة بيعها أو حجم نموها. قرار المنصة قرار تجاري قبل أن يكون قرارًا تقنيًا: هو الذي يحدد من يصل إليك، ومن يملك بيانات عملائك، وكم تدفع مقابل كل عملية بيع.</p>","rule":"<p>اختر المنصة بناءً على نموذج عملك وعميلك، لا بناءً على شهرة المنصة.</p>","chart":{"kind":"flow","items":["نموذج العمل","العميل المستهدف","القناة","المنصة*"]},"id":"a1s1","note":"⏱ 2 د. افتح بسؤال للقاعة: «من يبيع اليوم عبر إنستغرام فقط؟ ومن لديه متجر؟». اربط الإجابات بفكرة أن المنصة قرار تجاري قبل أن تكون تقنيًا."},{"type":"principle","title":"ثلاثة مسارات رئيسية للبيع عبر الإنترنت","points":["المتجر الخاص: موقعك باسم علامتك ونطاقك، تتحكم في التجربة والبيانات والأسعار، لكنك مسؤول عن جلب الزيارات.","السوق الإلكتروني (Marketplace): منصة كبيرة فيها مشترون جاهزون، تعرض منتجك بجانب منافسيك مقابل عمولة وقواعد صارمة.","القنوات الاجتماعية والمحادثة: البيع عبر إنستغرام أو واتساب أو تيك توك، سريع البدء لكنه صعب التوسع دون نظام خلفي."],"intro":"<p>كل منصة تقع تقريبًا تحت أحد ثلاثة مسارات، ولكل مسار منطق مختلف في الوصول والتحكم والتكلفة:</p>","rule":"<p>أغلب المشاريع الناجحة تجمع مسارين: قناة تمنحها الوصول، وقناة تمنحها التحكم.</p>","chart":{"kind":"cards","items":["🏬 متجر خاص::تحكم كامل ووصول تبنيه بنفسك","🛍️ سوق إلكتروني::وصول فوري وعمولة وقواعد","💬 قنوات اجتماعية::بدء سريع وتوسع محدود"]},"id":"a1s2","note":"⏱ 3 د. اطلب من كل متدرب تحديد مساره الحالي بالأصابع (1 متجر، 2 سوق، 3 تواصل). أكّد أن الجمع بين قناة وصول وقناة تحكم هو النمط الأنجح."},{"type":"tools","title":"أبرز المنصات العالمية والإقليمية","items":["Shopify::منصة جاهزة (SaaS) سهلة الإطلاق، متجر تطبيقات ضخم، مناسبة للتجزئة والعلامات الناشئة والمتوسطة.","WooCommerce::إضافة مفتوحة المصدر على ووردبريس، مرونة عالية وتكلفة ترخيص منخفضة، لكنها تحتاج استضافة وصيانة تقنية.","Wix / Squarespace::منصات بناء مواقع بواجهة سحب وإفلات، مناسبة للمتاجر الصغيرة والخدمات والحجوزات.","Magento (Adobe Commerce)::منصة قوية للكتالوجات الكبيرة وB2B والعمليات المعقدة، تحتاج فريقًا تقنيًا وميزانية أكبر.","سلة وزد::منصات إقليمية عربية الواجهة بتكاملات محلية للدفع والشحن؛ تحقّق من دعمها لنشاطك وموقعك قبل الاعتماد عليها.","Amazon وNoon::أسواق إلكترونية ضخمة في الخليج، وصول سريع لملايين المشترين مع عمولات ومتطلبات تسجيل في بلد السوق.","Etsy وeBay::أسواق عالمية؛ Etsy للمنتجات اليدوية والإبداعية، وeBay للمنتجات المتنوعة والمستعملة والنادرة.","الأسواق وتطبيقات التوصيل المحلية::تطبيقات محلية مثل «سنونو» تتيح البيع والتوصيل السريع داخل قطر للمنتجات اليومية."],"rule":"<p>لا توجد منصة «أفضل» مطلقًا؛ توجد منصة أنسب لمرحلتك ونموذجك.</p>","id":"a1s3","note":"⏱ 4 د. لا تشرح كل منصة بالتفصيل؛ اسأل: «أي منصة جربتموها؟ وما أكثر ما أزعجكم فيها؟». نبّه إلى التحقق من دعم الدفع والشحن المحلي قبل الاختيار."},{"type":"principle","title":"منصة جاهزة أم مفتوحة المصدر؟","points":["المنصة الجاهزة (SaaS): تدفع اشتراكًا شهريًا، والمزود يتولى الاستضافة والأمان والتحديثات. سرعة إطلاق عالية ومرونة محدودة بحدود المنصة.","المفتوحة المصدر: البرنامج مجاني غالبًا، لكنك تدفع للاستضافة والتطوير والصيانة والأمان. مرونة شبه كاملة ومسؤولية كاملة.","التكلفة الحقيقية: ليست سعر الاشتراك فقط، بل الاشتراك + التطبيقات + رسوم المعاملات + التصميم + الصيانة + وقت فريقك."],"intro":"<p>الفرق الجوهري بين النوعين هو: من يتحمل مسؤولية التقنية؟</p>","rule":"<p>المنصة المجانية ليست مجانية؛ السؤال الصحيح: ما التكلفة الإجمالية للتشغيل خلال سنة؟</p>","chart":{"kind":"compare","items":["☁️ جاهزة (SaaS) :: إطلاق خلال أيام ; الأمان والتحديثات على المزود ; اشتراك وتطبيقات مدفوعة ; مرونة ضمن حدود المنصة","🧩 مفتوحة المصدر :: إطلاق يحتاج تطويرًا ; الأمان والصيانة عليك ; استضافة ومطور ; مرونة شبه كاملة"]},"id":"a1s4","note":"⏱ 3 د. استخدم تشبيه «استئجار شقة مفروشة مقابل بناء بيت». ركز على أن المنصة المجانية ليست مجانية وأن التكلفة الإجمالية هي المعيار."},{"type":"principle","title":"الأسواق الإلكترونية: وصول سريع بثمن محدد","points":["العمولة: نسبة من كل عملية بيع، تختلف حسب الفئة، إضافة إلى رسوم الاشتراك والتخزين والشحن.","المنافسة المباشرة: منتجك يظهر بجانب منافسيك، والسعر والتقييمات يحسمان الاختيار.","ملكية العميل: العميل عميل السوق لا عميلك؛ بياناته وتواصلك معه محدودان.","القواعد: سياسات المنصة تتغير، ومخالفتها قد توقف حسابك."],"intro":"<p>السوق الإلكتروني يمنحك ما يصعب بناؤه وحدك: مشترين يبحثون فعلًا عن منتجك، وثقة جاهزة في المنصة، وخدمات شحن وتخزين أحيانًا. لكن في المقابل:</p>","rule":"<p>استخدم السوق الإلكتروني للوصول والاختبار، وابنِ متجرك الخاص للعلاقة والولاء.</p>","chart":{"kind":"balance","items":["الوصول والثقة الجاهزة","العمولة والتحكم المحدود"]},"id":"a1s5","note":"⏱ 3 د. اسأل: «ماذا يحدث لمبيعاتك إذا أُوقف حسابك في السوق غدًا؟». هذه اللحظة تمهد لفكرة تنويع القنوات."},{"type":"principle","title":"مواءمة المنصة مع نموذج العمل","points":["التجزئة (B2C): كتالوج منتجات، صور وخيارات (مقاس/لون)، سلة ودفع سريع، وتكامل مع الشحن.","الخدمات: حجز مواعيد، باقات واشتراكات، نماذج طلب مخصّصة، ودفع مقدم أو جزئي.","البيع للشركات (B2B): أسعار حسب العميل، طلبات بالجملة، عروض أسعار، فواتير آجلة، وحسابات متعددة المستخدمين.","النموذج الهجين: منتجات وخدمات معًا، أو بيع أونلاين مع متجر فعلي يحتاج مزامنة المخزون ونقطة بيع (POS)."],"intro":"<p>نموذج العمل يحدد الخصائص التي لا يمكنك الاستغناء عنها. أربعة نماذج شائعة لدى المشاريع الصغيرة والمتوسطة:</p>","rule":"<p>اكتب قائمة «الخصائص التي لا يعمل مشروعي بدونها» قبل أن تشاهد أي عرض توضيحي لمنصة.</p>","chart":{"kind":"matrix","items":["تعقيد العمليات","تنوع المنتجات والعملاء","خدمات بسيطة","B2B متعدد الأسعار ✓","متجر تجزئة صغير","هجين متعدد القنوات"]},"id":"a1s6","note":"⏱ 3 د. اطلب من كل متدرب كتابة خاصية واحدة لا يعمل مشروعه بدونها في محادثة جانبية. استخدم المصفوفة لتوضيح أن التعقيد يرفع متطلبات المنصة."},{"type":"examples","title":"أمثلة من السوق المحلي","items":["متجر عطور وعود ناشئ::يبدأ بمتجر Shopify أو منصة إقليمية بواجهة عربية، ويضيف إنستغرام وواتساب للبيع، ثم يختبر Noon في السعودية والإمارات.","مخبز منزلي في الدوحة::البيع عبر تطبيق توصيل محلي وقناة واتساب أولًا؛ المتجر الخاص يأتي عندما يستقر الطلب اليومي.","مورد مستلزمات مطاعم (B2B)::يحتاج أسعارًا لكل عميل وطلبات دورية وفواتير آجلة؛ منصة تدعم B2B أهم من قالب جذاب.","مركز تدريب أو استشارات::خدمة لا منتج؛ الأولوية لنظام حجز ودفع مقدم وتذكير بالمواعيد، وقد يكفي Wix أو منصة حجوزات.","حرفية منتجات يدوية::Etsy يفتح لها سوقًا عالميًا لمحبي المنتجات اليدوية، مع متجر خاص صغير لبناء علامتها."],"id":"a1s7","note":"⏱ 3 د. اختر مثالين قريبين من مشاريع القاعة واطلب تعليقًا سريعًا: «ماذا كنت ستفعل بدلًا منه؟»."},{"type":"mistakes","title":"أخطاء شائعة في اختيار المنصة","items":["اختيار المنصة لأن المنافس يستخدمها::قارن احتياجاتك أنت: نموذج العمل، الميزانية، المهارات المتاحة، وخطة النمو.","الحكم على المنصة من سعر الاشتراك فقط::احسب التكلفة الإجمالية: تطبيقات، رسوم معاملات، تصميم، تطوير، ووقت إدارة.","الاعتماد الكامل على سوق إلكتروني واحد::نوّع قنواتك تدريجيًا حتى لا يوقف تغيير سياسة واحدة مبيعاتك كلها.","تجاهل دعم الدفع والشحن المحلي::تأكد مبكرًا أن المنصة تتكامل مع بوابات الدفع وشركات الشحن العاملة في قطر.","الإطلاق على كل القنوات دفعة واحدة::ابدأ بقناة أو قناتين تديرهما جيدًا، ثم توسّع بعد استقرار العمليات."],"id":"a1s8","note":"⏱ 2 د. اقرأ كل خطأ واطلب رفع اليد لمن وقع فيه؛ الضحك الخفيف هنا يكسر الحاجز."},{"type":"summary","title":"القناة الصحيحة في المرحلة الصحيحة","text":"<p>خريطة المنصات واسعة، لكن القرار يصبح أوضح عندما تبدأ من نموذج عملك وعميلك ومرحلتك. المتجر الخاص يمنحك التحكم والعلاقة، والسوق الإلكتروني يمنحك الوصول السريع، والقنوات الاجتماعية تمنحك البدء السريع.</p>","rule":"<p>ابدأ بما تستطيع إدارته جيدًا اليوم، واختر ما لا يمنعك من النمو غدًا.</p>","chart":{"kind":"steps","items":["ابدأ::قناة واحدة تتقنها","اختبر::سوق إلكتروني للوصول","ثبّت::متجر خاص للعلاقة","توسّع::قنوات وأسواق جديدة"]},"id":"a1s9","note":"⏱ 2 د. انتقل مباشرة إلى تمرين التصويت «أين يبيع هذا المشروع؟» واعرض النتائج على الشاشة من وضع العرض."}],"exercises":[{"id":"a1e1","title":"أين يبيع هذا المشروع؟","icon":"🧭","mode":"individual","format":"mcq","steps":[],"items":[{"q":"مخبز منزلي جديد يبيع يوميًا داخل الدوحة ولا يملك فريقًا تقنيًا. ما البداية الأنسب؟","options":["متجر Magento مخصص","متجر على Etsy","سوق Amazon عالمي","تطبيق توصيل محلي مع قناة واتساب للطلبات"],"answer":3},{"q":"مورد مستلزمات فنادق يحتاج أسعارًا مختلفة لكل عميل وفواتير آجلة. ما أهم ما يبحث عنه في المنصة؟","options":["عدد كبير من القوالب المجانية","تكامل مع تيك توك","قوالب تصميم كثيرة","دعم خصائص البيع للشركات (B2B)"],"answer":3},{"q":"حرفية تصنع إكسسوارات يدوية وتريد الوصول لعملاء خارج الخليج. أي سوق يناسب طبيعة منتجاتها أكثر؟","options":["Etsy","منصة حجوزات","تطبيق توصيل محلي","سوق للأجهزة الإلكترونية"],"answer":0},{"q":"مركز استشارات يبيع جلسات بالمواعيد. ما الخاصية الحاسمة؟","options":["سلة شراء متعددة المنتجات","بيع بالجملة","تخزين في مستودعات السوق","نظام حجز مواعيد مع دفع مقدم"],"answer":3},{"q":"علامة عطور ناشئة تريد اختبار الطلب في السعودية والإمارات قبل فتح فروع. ما الخطوة الأنسب؟","options":["إيقاف متجرها الخاص","فتح مستودع في كل دولة فورًا","البيع عبر البريد الإلكتروني فقط","اختبار البيع عبر سوق إلكتروني إقليمي مثل Noon"],"answer":3},{"q":"متجر ملابس لديه فرع فعلي ويريد البيع أونلاين دون أن يبيع قطعة غير متوفرة. ما الذي يحتاجه أولًا؟","options":["قالبًا جديدًا","مزامنة المخزون بين المتجر الفعلي والإلكتروني (POS)","خصمًا دائمًا","مزيدًا من الإعلانات"],"answer":1},{"q":"مشروع لديه مطور ويحتاج مرونة كاملة في التصميم والتكاملات مع ميزانية تشغيل محدودة للترخيص. أي نوع منصة يناسبه أكثر؟","options":["قناة اجتماعية فقط","سوق إلكتروني فقط","منصة حجوزات جاهزة","منصة مفتوحة المصدر مثل WooCommerce"],"answer":3},{"q":"صاحب مشروع بلا خبرة تقنية يريد إطلاق متجر خلال أسبوعين. ما الأنسب؟","options":["Magento مخصص","منصة مفتوحة المصدر بلا مطور","منصة جاهزة (SaaS) مثل Shopify أو منصة إقليمية","تطوير منصة من الصفر"],"answer":2},{"q":"ما أكبر خطر على مشروع يبيع 100% من مبيعاته عبر سوق إلكتروني واحد؟","options":["ارتفاع تكلفة التصميم","تغيّر سياسات السوق أو إيقاف الحساب يوقف المبيعات كلها","بطء الموقع","صعوبة إضافة الصور"],"answer":1},{"q":"مشروع ينجح في البيع عبر إنستغرام لكن الطلبات أصبحت كثيرة وتضيع في الرسائل. ما الخطوة المنطقية التالية؟","options":["إضافة متجر أو نظام طلبات يربط القناة بعملية منظمة","إغلاق حساب إنستغرام","رفع الأسعار","الرد على الرسائل بشكل أسرع فقط"],"answer":0}],"scenario":"<p>ستقرأ عشرة مواقف لمشاريع صغيرة ومتوسطة في قطر. اختر لكل مشروع المسار أو المنصة الأنسب لمرحلته الحالية.</p>","principle":"المنصة المناسبة تُشتق من نموذج العمل والعميل والمرحلة، لا من شهرة المنصة.","hint":"<p>اسأل نفسك في كل موقف: ما الخاصية التي لا يعمل هذا المشروع بدونها؟</p>","why":"يدرّبك على ربط الخيار التقني بسؤال تجاري واضح.","axis":"a1"},{"id":"a1e2","title":"صح أم خطأ: حقائق المنصات","icon":"⚖️","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"المنصة مفتوحة المصدر مجانية بالكامل ولا تحتاج أي مصاريف تشغيل.","answer":false},{"q":"في المنصة الجاهزة (SaaS) يتولى المزود الاستضافة والتحديثات الأمنية.","answer":true},{"q":"العميل الذي يشتري منك عبر سوق إلكتروني يصبح عميلك بالكامل وتملك كل بياناته.","answer":false},{"q":"السوق الإلكتروني يمنح وصولًا سريعًا لمشترين يبحثون عن المنتج مقابل عمولة وقواعد.","answer":true},{"q":"كل المنصات العالمية تتكامل تلقائيًا مع كل بوابات الدفع المحلية في قطر.","answer":false},{"q":"نموذج البيع للشركات (B2B) قد يحتاج أسعارًا مختلفة لكل عميل وطلبات بالجملة.","answer":true},{"q":"من الأفضل دائمًا الإطلاق على كل القنوات والأسواق في يوم واحد.","answer":false},{"q":"التكلفة الحقيقية للمنصة تشمل التطبيقات ورسوم المعاملات والتصميم والوقت، لا الاشتراك فقط.","answer":true},{"q":"البيع عبر واتساب وإنستغرام قد يكون بداية جيدة لكنه يحتاج نظامًا خلفيًا مع زيادة الطلبات.","answer":true},{"q":"شهرة المنصة كافية وحدها لضمان نجاح المتجر.","answer":false}],"principle":"فهم طبيعة كل نوع من المنصات يمنع قرارات مكلفة يصعب التراجع عنها.","hint":"<p>انتبه للكلمات المطلقة مثل «دائمًا» و«مجانًا» و«لا يحتاج».</p>","why":"يصحّح التصورات الشائعة قبل الدخول في معايير الاختيار.","axis":"a1"},{"id":"a1e3","title":"خريطة قنوات مشروعك","icon":"🗺️","mode":"individual","format":"text","steps":["حدد نموذج عملك: تجزئة، خدمات، B2B، أو هجين.","حدد عميلك الأول: من هو؟ وأين يشتري عادة؟","اختر قناتين فقط للبداية مع سبب لكل منهما."],"scenario":"<p>فكّر في مشروعك الحالي أو مشروع تنوي إطلاقه. إن لم يكن لديك مشروع، اختر مشروعًا تعرفه جيدًا في السوق المحلي.</p>","principle":"المشاريع الناجحة غالبًا تجمع قناة تمنحها الوصول وقناة تمنحها التحكم والعلاقة.","task":"<p>اكتب: (1) نموذج عملك وعميلك الأول، (2) القناة الأولى التي ستمنحك الوصول ولماذا، (3) القناة الثانية التي ستمنحك التحكم والعلاقة ولماذا، (4) قناة واحدة ستؤجلها ولماذا.</p>","why":"يحول الخريطة العامة إلى قرار شخصي قابل للتنفيذ في مشروعك.","model":"<p>مثال من مجال مختلف: مدرب لياقة شخصي — عميله موظفون مشغولون يستخدمون إنستغرام. قناة الوصول: إنستغرام بمحتوى قصير. قناة التحكم: صفحة حجز ودفع مقدم باسمه. يؤجل: الأسواق الإلكترونية لأنها لا تناسب بيع الجلسات. طبّق الفكرة نفسها على مشروعك.</p>","axis":"a1"},{"id":"a1e4","title":"أكمل الفراغ: مفردات المنصات","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"المنصة التي تدفع لها اشتراكًا ويتولى مزودها الاستضافة تسمى منصة ___.","answer":"جاهزة"},{"text":"السوق الإلكتروني يأخذ ___ من كل عملية بيع.","answer":"عمولة"},{"text":"WooCommerce مثال على منصة ___ المصدر.","answer":"مفتوحة"},{"text":"في السوق الإلكتروني يكون العميل عميل ___ لا عميلك بالكامل.","answer":"السوق"},{"text":"البيع للشركات يُختصر بالرمز ___.","answer":"B2B"},{"text":"المتجر الخاص يمنحك ___ في التجربة والبيانات.","answer":"التحكم"},{"text":"التكلفة ___ تشمل الاشتراك والتطبيقات والرسوم والوقت.","answer":"الإجمالية"},{"text":"النموذج الذي يجمع متجرًا فعليًا وإلكترونيًا يسمى ___.","answer":"الهجين"},{"text":"ربط المخزون بين المتجر الفعلي والإلكتروني يحتاج نظام نقطة ___.","answer":"بيع"},{"text":"البيع عبر إنستغرام وواتساب يوفر بداية ___ لكنه صعب التوسع.","answer":"سريعة"}],"principle":"اللغة المشتركة تسهّل نقاش القرار داخل الفريق ومع المطورين والمزودين.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط الكلمة ثم الفراغ، واضغط فراغًا ممتلئًا لإفراغه.</p>","why":"يثبّت المصطلحات الأساسية للمحور بطريقة جماعية.","axis":"a1"}],"highlights":["ثلاثة مسارات للبيع: متجر خاص، سوق إلكتروني، قنوات اجتماعية","منصات جاهزة (SaaS) مقابل مفتوحة المصدر","الأسواق الإلكترونية: وصول سريع مقابل تحكم أقل","مواءمة المنصة مع نموذج العمل: تجزئة، خدمات، B2B، هجين","البدء بقناة واحدة ثم التوسع المدروس"],"unit":1,"icon":"store","color":0,"scene":"store","title":"أين تفتح متجرك؟ خريطة المنصات","classic":"نظرة عامة على منصات التجارة الإلكترونية العالمية والإقليمية ومواءمتها مع نماذج الأعمال","duration":"30 دقيقة","desc":"<p>قبل أي إعداد تقني، يحتاج صاحب المشروع إلى إجابة سؤال واحد: أين يبيع؟ في متجره الخاص، أم في سوق إلكتروني كبير، أم في الاثنين معًا؟ هنا نرسم خريطة المنصات ونربط كل نوع منها بنموذج العمل المناسب له.</p>","outcome":"يحدد المتدرب المسار الأنسب لمشروعه (متجر خاص، سوق إلكتروني، قنوات اجتماعية) ويبرر قناتين للبداية."},{"id":"a2","slides":[{"type":"opening","title":"منصة تناسبك اليوم... وتتسع لك غدًا","text":"<p>أصعب لحظة في حياة متجر ناجح هي الانتقال من منصة إلى أخرى: روابط تتغير، بيانات تُنقل، وعملاء يرتبكون. أغلب هذه اللحظات يمكن تجنبها بسؤال بسيط عند الاختيار: ماذا سيحدث عندما يتضاعف عدد منتجاتي وطلباتي خمس مرات؟</p>","rule":"<p>قيّم المنصة على حجمك بعد سنتين، لا على حجمك اليوم فقط.</p>","chart":{"kind":"gap","items":["ما يحتاجه المتجر اليوم","فجوة النمو","ما سيحتاجه بعد سنتين","إعادة بناء مكلفة"]},"id":"a2s1","note":"⏱ 2 د. اسأل: «من اضطر لنقل متجره من منصة لأخرى؟ كم كلفه ذلك؟». استخدم القصص الواقعية من القاعة إن وجدت."},{"type":"principle","title":"خمسة معايير أساسية لاختيار المنصة","points":["قابلية التوسع: هل تتحمل زيادة المنتجات والطلبات والزيارات دون بطء أو ترقية مكلفة؟","التكلفة الإجمالية: اشتراك، تطبيقات، رسوم معاملات، تصميم، تطوير، ووقت تشغيل.","ملاءمة القطاع: هل تدعم خصائص قطاعك (خيارات المنتج، الحجوزات، B2B، المنتجات الرقمية)؟","الوصول للسوق: دعم العربية والإنجليزية، العملات، بوابات الدفع وشركات الشحن المحلية والإقليمية.","سهولة التشغيل: هل يستطيع فريقك إدارتها يوميًا دون الاعتماد الدائم على مطور؟"],"intro":"<p>كل منصة جيدة في شيء ما؛ المعايير التالية تجعل المقارنة موضوعية:</p>","rule":"<p>المعيار الذي لا تستطيع التنازل عنه يُمنح الوزن الأعلى في المقارنة.</p>","chart":{"kind":"hub","items":["🎯 اختيار المنصة","قابلية التوسع","التكلفة الإجمالية","ملاءمة القطاع","الوصول للسوق","سهولة التشغيل"]},"id":"a2s2","note":"⏱ 3 د. اطلب من المتدربين ترتيب المعايير الخمسة حسب أهميتها لمشاريعهم؛ الاختلاف في الترتيب هو الرسالة."},{"type":"principle","title":"مصفوفة القرار الموزونة","points":["اكتب المعايير الخمسة، وامنح كل معيار وزنًا حسب أهميته لمشروعك بحيث يكون المجموع 100%.","قيّم كل منصة مرشحة على كل معيار من 1 إلى 5.","اضرب التقييم في الوزن، ثم اجمع النتائج لكل منصة.","ناقش النتيجة: إذا فازت منصة بفارق ضئيل، ارجع إلى المعيار الأعلى وزنًا ليحسم القرار."],"intro":"<p>طريقة عملية تحوّل الانطباعات إلى أرقام قابلة للنقاش:</p>","rule":"<p>المصفوفة لا تتخذ القرار عنك، لكنها تكشف لماذا تميل إلى خيار معين.</p>","chart":{"kind":"table","items":["المعيار (الوزن) ; المنصة أ ; المنصة ب","قابلية التوسع (25%) ; 4 ; 3","التكلفة الإجمالية (25%) ; 3 ; 5","ملاءمة القطاع (20%) ; 5 ; 3","الوصول للسوق (20%) ; 4 ; 4","سهولة التشغيل (10%) ; 4 ; 3","النتيجة الموزونة ; 3.95 ; 3.70"]},"id":"a2s3","note":"⏱ 4 د. اشرح الحساب على مثال الجدول خطوة بخطوة، ثم اطلب التطبيق في التمرين الجماعي «مصفوفة قرار مجموعتكم»."},{"type":"principle","title":"التكلفة الإجمالية للتشغيل (TCO)","points":["تكاليف ثابتة: الاشتراك الشهري أو الاستضافة، النطاق، شهادة الأمان، القالب.","تكاليف متغيرة: رسوم كل معاملة دفع، عمولات الأسواق، تطبيقات بحسب الاستخدام.","تكاليف التأسيس: التصميم، إدخال المنتجات، التصوير، الربط مع الدفع والشحن.","تكاليف خفية: وقت فريقك في الإدارة، الصيانة والتحديثات، والتعامل مع الأعطال."],"intro":"<p>الخطأ الأكثر شيوعًا مقارنة سعر الاشتراك فقط. التكلفة الحقيقية خلال سنة تتكون من:</p>","rule":"<p>احسب التكلفة الإجمالية على 12 شهرًا، ثم قسمها على عدد الطلبات المتوقعة لتعرف تكلفة المنصة لكل طلب.</p>","chart":{"kind":"equation","items":["ثابتة","متغيرة","تأسيس","خفية","= التكلفة الإجمالية للتشغيل"]},"id":"a2s4","note":"⏱ 3 د. حوّل المعادلة إلى رقم: اطلب تقديرًا سريعًا لتكلفة متجر صغير خلال سنة، وقارن التقديرات."},{"type":"principle","title":"إعداد المتجر للنمو: الأساس الذي لا يُرى","points":["هيكل الكتالوج: تصنيفات منطقية من منظور العميل، ووسوم وخصائص موحدة (مقاس، لون، مادة).","بيانات المنتج: رمز تعريف فريد لكل منتج (SKU)، أسماء ثابتة، وصور بمقاسات موحدة.","الروابط والنطاق: نطاق باسم علامتك، وروابط منتجات واضحة ثابتة لا تتغير.","السياسات: الشحن، الاسترجاع، الخصوصية، والشروط؛ مكتوبة بوضوح وظاهرة.","التتبع: ربط أدوات التحليل ومصادر الزيارات من اليوم الأول، حتى لا تبدأ القياس متأخرًا."],"intro":"<p>ما تبنيه في الأسبوع الأول يبقى معك سنوات. خمسة أسس يصعب تغييرها لاحقًا:</p>","rule":"<p>فوضى الكتالوج اليوم تصبح فوضى في المخزون والتقارير والإعلانات غدًا.</p>","chart":{"kind":"vflow","items":["هيكل الكتالوج","بيانات المنتج (SKU)","الروابط والنطاق","السياسات","التتبع والتحليل*"]},"id":"a2s5","note":"⏱ 3 د. أكد على SKU والتصنيفات بمنظور العميل؛ هذه أخطاء تظهر بعد أشهر ويصعب إصلاحها."},{"type":"tools","title":"قائمة إطلاق المتجر","items":["الهوية::الشعار، الألوان، الخطوط، ونبرة الكتابة موحدة في كل الصفحات.","الصفحات الأساسية::الرئيسية، التصنيفات، المنتج، السلة، الدفع، من نحن، تواصل معنا، الأسئلة الشائعة.","اللغة والعملة::العربية والإنجليزية، والريال القطري كعملة أساسية مع خيار عملات إضافية عند التوسع.","الدفع::بوابة دفع محلية تدعم البطاقات المحلية والدولية والمحافظ الرقمية، مع اختبار عملية دفع حقيقية.","الشحن::مناطق التوصيل، الأسعار، المدد المتوقعة، والتكامل مع شركة الشحن.","الترخيص والامتثال::رخصة التجارة الإلكترونية من وزارة التجارة والصناعة (قرار رقم 25 لسنة 2026: رسوم 500 ريال، تشمل 194 نشاطًا، تُقدَّم عبر النافذة الواحدة، وتتطلب نطاقًا ينتهي بـ .qa أو .com.qa من مزود معتمد)، مع سياسة خصوصية وشروط استخدام واضحة.","التتبع::أداة تحليل، بكسل الإعلانات، وروابط تتبع للحملات.","اختبار ما قبل الإطلاق::طلب تجريبي كامل من الجوال والحاسوب حتى وصول الشحنة وإشعار العميل."],"rule":"<p>لا تطلق المتجر قبل أن تنجح في إتمام طلب تجريبي كامل بنفسك. وتحقق من أحدث متطلبات الترخيص على موقع وزارة التجارة والصناعة.</p>","srcUrl":"https://www.arabianbusiness.com/business/qatar-e-commerce-licence-business","srcLabel":"خبر رخصة التجارة الإلكترونية الجديدة في قطر","id":"a2s6","note":"⏱ 3 د. نبّه إلى رخصة التجارة الإلكترونية الجديدة (500 ريال، 194 نشاطًا، نطاق .qa) وأنها جزء من الجاهزية. اربطها مباشرة بمحاكي إعداد المتجر."},{"type":"mistakes","title":"أخطاء إعداد تتكرر","items":["تصنيفات حسب منطق المخزن لا منطق العميل::رتّب التصنيفات كما يبحث العميل: حسب الاستخدام أو المناسبة أو الفئة.","منتجات بلا رمز SKU موحد::امنح كل منتج وكل خيار منه رمزًا فريدًا ثابتًا من البداية.","إخفاء سياسة الاسترجاع والشحن::اعرضها بوضوح في صفحة المنتج وقبل الدفع لتقليل التردد.","تركيب عشرات التطبيقات دفعة واحدة::كل تطبيق يضيف تكلفة وبطئًا؛ ركّب فقط ما يحل مشكلة قائمة.","الإطلاق دون أدوات تتبع::اربط أدوات التحليل قبل أول زيارة حتى تعرف من أين يأتي عملاؤك."],"id":"a2s7","note":"⏱ 2 د. اسأل عن أكثر خطأ رأوه في متاجر زاروها مؤخرًا."},{"type":"summary","title":"اختيار منهجي وإعداد متين","text":"<p>الاختيار الجيد يبدأ من معايير موزونة وتكلفة إجمالية محسوبة، والإعداد الجيد يبدأ من كتالوج منظم وسياسات واضحة وتتبع مبكر. بهذا تبني متجرًا ينمو دون أن تضطر لإعادة بنائه.</p>","rule":"<p>قرار موزون، إعداد منظم، طلب تجريبي كامل، ثم إطلاق.</p>","chart":{"kind":"flow","items":["معايير موزونة","تكلفة إجمالية","إعداد منظم","طلب تجريبي","إطلاق*"]},"id":"a2s8","note":"⏱ 1 د. انتقل إلى «محاكي إعداد متجرك»: هدف 90% جاهزية خلال 8 دقائق، ثم اعرض أعلى النتائج."}],"exercises":[{"id":"a2e1","title":"مصفوفة قرار مجموعتكم","icon":"📊","mode":"group","format":"text","steps":["اتفقوا على أوزان المعايير الخمسة بحيث يكون المجموع 100%.","قيّموا كل منصة من 1 إلى 5 على كل معيار.","احسبوا النتيجة الموزونة لكل منصة وناقشوا الفارق."],"scenario":"<p>مشروع قطري لبيع مستلزمات القهوة المختصة (أدوات، بن مختار، اشتراكات شهرية). لديه 120 منتجًا حاليًا، ويتوقع 600 منتج خلال سنتين، ويريد البيع داخل قطر ثم في السعودية والإمارات. الفريق: مؤسس ومسوق، دون مطور متفرغ. المرشحون: منصة جاهزة عالمية، منصة إقليمية، ومنصة مفتوحة المصدر.</p>","principle":"المصفوفة الموزونة تحول الانطباعات إلى قرار قابل للنقاش والتبرير.","task":"<p>اكتبوا: الأوزان التي اخترتموها ولماذا، تقييم المنصات الثلاث، النتيجة الموزونة، والقرار النهائي مع خاصية واحدة لا يمكن التنازل عنها في هذا المشروع (مثل الاشتراكات الشهرية).</p>","why":"يدربكم على اتخاذ قرار جماعي مبرر بدل الاعتماد على الانطباع أو التفضيل الشخصي.","model":"<p>مثال من مجال مختلف: عيادة أسنان تختار نظام حجز؛ منحت «سهولة التشغيل» 30% لأن موظف الاستقبال سيستخدمه يوميًا، و«التذكير بالرسائل» خاصية لا تنازل عنها. طبّقوا المنطق نفسه على مشروع القهوة.</p>","axis":"a2"},{"id":"a2e2","title":"اختر الإجراء الأصح","icon":"🛠️","mode":"individual","format":"mcq","steps":[],"items":[{"q":"متجر يرتب تصنيفاته حسب أسماء الموردين. ما التحسين الأصح؟","options":["حذف التصنيفات","ترتيبها أبجديًا فقط","ترتيب التصنيفات حسب طريقة بحث العميل (الاستخدام، الفئة، المناسبة)","إضافة مزيد من الموردين"],"answer":2},{"q":"لديك قميص بثلاثة ألوان وأربعة مقاسات. كيف تنظم رموز المنتجات؟","options":["بلا رموز حتى تكثر المبيعات","رمز SKU فريد لكل خيار (لون + مقاس)","رمز لكل لون فقط","رمز واحد للقميص كله"],"answer":1},{"q":"منصتان متقاربتان في المصفوفة (3.9 مقابل 3.8). ما الخطوة الأصح؟","options":["إعادة التقييم حتى تفوز المفضلة","الرجوع إلى المعيار الأعلى وزنًا ليحسم القرار","اختيار الاثنتين معًا","اختيار الأرخص تلقائيًا"],"answer":1},{"q":"أي بند يُعد تكلفة خفية في التكلفة الإجمالية للتشغيل؟","options":["رسوم القالب","الاشتراك الشهري","سعر النطاق","وقت الفريق في الإدارة ومعالجة الأعطال"],"answer":3},{"q":"متى يجب ربط أدوات التحليل بالمتجر؟","options":["عند ملاحظة انخفاض المبيعات","بعد أول 100 طلب","عند بدء الإعلانات فقط","قبل الإطلاق ومن أول زيارة"],"answer":3},{"q":"قبل الإطلاق مباشرة، ما أهم اختبار؟","options":["زيادة عدد الصور","مراجعة ألوان الشعار","كتابة مقال في المدونة","إتمام طلب تجريبي كامل من الجوال والحاسوب حتى وصول الإشعار"],"answer":3},{"q":"متجر يخطط للبيع في السعودية والإمارات لاحقًا. أي معيار يرتبط مباشرة بهذا الهدف؟","options":["سهولة تغيير القالب","عدد الخطوط المتاحة","سرعة لوحة التحكم","الوصول للسوق: العملات واللغات وتكاملات الدفع والشحن الإقليمية"],"answer":3},{"q":"صاحب متجر ركّب 25 تطبيقًا في الأسبوع الأول. ما الأثر المتوقع؟","options":["لا أثر","تحسن ترتيب البحث تلقائيًا","تحسن فوري في المبيعات","زيادة التكلفة وبطء المتجر وتعقيد الإدارة"],"answer":3},{"q":"أين يفضل أن تظهر سياسة الاسترجاع؟","options":["لا حاجة لعرضها","في رسالة بعد الشراء فقط","في صفحة مخفية بالتذييل فقط","في صفحة المنتج وقبل الدفع بوضوح"],"answer":3},{"q":"ما السؤال الأهم لاختبار قابلية التوسع؟","options":["ماذا سيحدث عندما تتضاعف المنتجات والطلبات خمس مرات؟","هل القالب جميل؟","هل الاشتراك شهري أم سنوي؟","هل المنافس يستخدم المنصة؟"],"answer":0}],"scenario":"<p>عشرة مواقف من أسابيع الإعداد الأولى لمتجر جديد. اختر الإجراء الأصح في كل موقف.</p>","principle":"قرارات الإعداد الأولى تحدد سهولة النمو لاحقًا.","hint":"<p>فكّر: ماذا سيحدث لهذا القرار عندما يتضاعف عدد المنتجات والطلبات؟</p>","why":"يربط المعايير النظرية بقرارات تنفيذية يومية.","axis":"a2"},{"id":"a2e3","title":"أي العبارتين أدق؟","icon":"🔍","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"نختار المنصة الأرخص اشتراكًا لأنها الأوفر.","b":"نقارن التكلفة الإجمالية للتشغيل خلال سنة قبل الحكم.","answer":"b"},{"a":"نصمم التصنيفات بناءً على طريقة بحث العميل.","b":"نصمم التصنيفات بناءً على ترتيب رفوف المخزن.","answer":"a"},{"a":"نمنح كل خيار منتج رمزًا فريدًا (SKU).","b":"نكتفي باسم المنتج لأنه واضح للجميع.","answer":"a"},{"a":"نؤجل أدوات التحليل حتى تزيد المبيعات.","b":"نربط أدوات التحليل قبل الإطلاق.","answer":"b"},{"a":"نقيّم المنصة على حجمنا المتوقع بعد سنتين.","b":"نقيّم المنصة على حجمنا الحالي فقط.","answer":"a"},{"a":"نطلق المتجر بعد إتمام طلب تجريبي كامل.","b":"نطلق المتجر ثم نختبر الدفع مع أول عميل.","answer":"a"},{"a":"نختار المنصة التي يستخدمها أكبر منافس لنا.","b":"نختار المنصة التي تطابق خصائص نموذج عملنا.","answer":"b"},{"a":"نركّب التطبيقات التي تحل مشكلة قائمة فقط.","b":"نركّب كل تطبيق مفيد قد نحتاجه مستقبلًا.","answer":"a"},{"a":"نغيّر روابط المنتجات كلما حدّثنا أسماءها.","b":"نحافظ على روابط منتجات ثابتة وواضحة.","answer":"b"},{"a":"نعرض سياسات الشحن والاسترجاع قبل الدفع.","b":"نرسل السياسات للعميل بعد إتمام الطلب.","answer":"a"}],"principle":"التمييز بين الممارسة الصحيحة والشائعة الخاطئة يبني حكمًا مهنيًا سريعًا.","hint":"<p>في كل زوج اختاروا العبارة التي تعبّر عن الممارسة الأصح لنمو المتجر.</p>","why":"يحفّز النقاش داخل المجموعة حول تفاصيل الإعداد والاختيار.","axis":"a2"},{"id":"a2e4","title":"قائمة الإطلاق لمتجرك","icon":"✅","mode":"individual","format":"text","steps":["راجع بنود القائمة الثمانية.","حدد ثلاثة بنود هي الأضعف في مشروعك الآن.","ضع لكل بند إجراءً ومسؤولًا وموعدًا."],"scenario":"<p>تخيّل أن إطلاق متجرك بعد أسبوعين. لديك قائمة الإطلاق التي شرحناها (الهوية، الصفحات، اللغة والعملة، الدفع، الشحن، الامتثال، التتبع، الاختبار).</p>","principle":"الإطلاق الناجح نتيجة قائمة تحقق مكتملة، لا نتيجة حماس اللحظة الأخيرة.","task":"<p>اكتب أضعف ثلاثة بنود في جاهزية متجرك للإطلاق، ولكل بند: الإجراء المطلوب، ومن سيتولاه، ومتى ينتهي.</p>","why":"يحول قائمة عامة إلى خطة عمل قصيرة لمشروعك.","model":"<p>مثال من مجال مختلف: مطعم يفتتح فرعًا جديدًا — أضعف بنوده: تدريب الموظفين، ونظام الحجز، ولافتة الطريق. لكل بند إجراء ومسؤول وموعد. استخدم الطريقة نفسها مع متجرك.</p>","axis":"a2"},{"id":"a2e5","title":"محاكي إعداد متجرك","icon":"🏗️","mode":"individual","format":"sim","steps":[],"sim":"store","scenario":"<p>حان وقت التطبيق العملي: ستُعد متجرًا إلكترونيًا لمنتج واحد من الفكرة حتى الجاهزية للإطلاق، خطوة بخطوة. كل قرار تتخذه يظهر أثره فورًا على معاينة صفحة المنتج وعلى نسبة «جاهزية الإطلاق».</p>","principle":"الإعداد الجيد من اليوم الأول (هيكل المنتج، الشفافية في الشحن، وسائل الدفع المحلية، السياسات، والتتبع) يوفر إعادة البناء لاحقًا ويرفع ثقة العميل.","hint":"<p>ابدأ بمتجرك الحقيقي إن وجد. هدفك الوصول إلى جاهزية 90% أو أكثر، ثم قارن نتيجتك بنتائج زملائك.</p>","why":"يحول قائمة الإطلاق من قائمة نظرية إلى تجربة إعداد عملية تشبه لوحات تحكم المنصات الحقيقية.","axis":"a2"}],"highlights":["مصفوفة قرار بمعايير موزونة","قابلية التوسع والتكلفة الإجمالية للتشغيل","الوصول للسوق ودعم اللغة والعملة","هيكل الكتالوج والتصنيفات من البداية","قائمة الإطلاق: سياسات، دفع، شحن، تتبع"],"unit":1,"icon":"layers","color":1,"scene":"architecture","title":"قرار المنصة ومتجر يُبنى ليكبر","classic":"معايير اختيار المنصة (قابلية التوسع، التكلفة، القطاع، الوصول للسوق) وإعداد المتجر وتهيئته للنمو طويل المدى","duration":"35 دقيقة","desc":"<p>بعد رسم الخريطة، نحتاج طريقة منهجية للاختيار بين منصتين أو ثلاث، ثم إعدادًا صحيحًا من اليوم الأول يجنّبك إعادة البناء عندما يكبر المتجر.</p>","outcome":"يقارن بين منصتين بمصفوفة موزونة ويحسب التكلفة الإجمالية للتشغيل ويُعد متجرًا جاهزًا للإطلاق في المحاكي."},{"id":"a3","slides":[{"type":"opening","title":"زر واحد... وخلفه رحلة كاملة","text":"<p>عندما يضغط العميل «ادفع الآن»، تمر بياناته خلال ثوانٍ بعدة أطراف قبل أن يظهر له «تم الدفع بنجاح». وبعد أيام يصل المبلغ إلى حسابك البنكي مخصومًا منه رسوم لم تنتبه لها أحيانًا. من يفهم هذه الرحلة يختار البوابة بثقة ويقرأ فاتورتها بوضوح.</p>","rule":"<p>بوابة الدفع ليست مجرد زر؛ هي شريك يحدد تجربة عميلك وتدفقك النقدي.</p>","chart":{"kind":"flow","items":["العميل يدفع","بوابة الدفع","البنك المُصدر","الموافقة","التسوية في حسابك*"]},"id":"a3s1","note":"⏱ 2 د. ارسم على الشاشة رحلة الريال من العميل إلى الحساب، واسأل: «كم يومًا تنتظرون أموالكم عادة؟»."},{"type":"principle","title":"أطراف عملية الدفع الإلكتروني","points":["العميل وبنكه المُصدر: البنك الذي أصدر البطاقة ويوافق على العملية أو يرفضها.","التاجر: أنت، صاحب المتجر الذي يستقبل الطلب.","بوابة الدفع: التقنية التي تستقبل بيانات البطاقة بأمان وتنقلها للمعالجة.","المعالج أو مزود خدمة الدفع: ينسّق العملية بين الأطراف، وكثير من المزودين يجمعون البوابة والمعالجة في خدمة واحدة.","البنك المستحوذ: البنك الذي يستقبل الأموال لصالحك ويحوّلها إلى حسابك في موعد التسوية."],"intro":"<p>كل عملية دفع بالبطاقة تمر بخمسة أطراف رئيسية، ولكل طرف دور مختلف:</p>","rule":"<p>السؤال العملي: كم تستغرق التسوية؟ وكم يُخصم من كل عملية؟</p>","chart":{"kind":"steps","items":["العميل::يدخل بيانات البطاقة","البوابة::تشفّر وتنقل البيانات","المُصدر::يوافق أو يرفض","المستحوذ::يستقبل المبلغ","التاجر::يستلم بعد التسوية"]},"id":"a3s2","note":"⏱ 3 د. استخدم مثال بطاقة خصم محلية مقابل بطاقة ائتمان دولية لتوضيح دور المُصدر والمستحوذ."},{"type":"tools","title":"بوابات ومزودو دفع في السوق القطري والإقليمي","items":["QPay::البوابة الوطنية لبطاقات الخصم المحلية في قطر، مهمة لأن كثيرًا من العملاء يدفعون ببطاقات الخصم المحلية.","MyFatoorah::مزود إقليمي يجمع البطاقات المحلية والدولية وروابط الدفع والفواتير، ويعمل في عدة دول خليجية.","PayTabs::مزود إقليمي يقدم بوابة دفع وروابط وصفحات دفع، مع تكاملات مع منصات المتاجر.","Tap Payments::مزود إقليمي بتكاملات مع المتاجر ووسائل دفع متعددة في الخليج.","مزودون قطريون ناشئون::مثل SkipCash وSADAD وDibsy، يقدمون حلول دفع وروابط ومحافظ للسوق المحلي.","Stripe وPayPal::مزودون عالميون؛ إتاحة فتح الحساب واستلام الأموال تعتمد على بلد تسجيل الشركة وحسابها البنكي، فتحقق قبل البناء عليهما.","المحافظ الرقمية::Apple Pay وGoogle Pay ترفع سرعة الدفع من الجوال، وتُفعّل غالبًا عبر مزود الدفع."],"rule":"<p>تحقق دائمًا من ثلاثة أمور مع المزود مباشرة: الإتاحة لنشاطك في قطر، هيكل الرسوم، ومدة التسوية.</p>","id":"a3s3","note":"⏱ 4 د. ذكّر بأن الإتاحة والرسوم تتغير؛ شجع على طلب عرض أسعار مكتوب من مزودين اثنين على الأقل. اربط بقصة «تاب»."},{"type":"principle","title":"ماذا يتوقع العميل في صفحة الدفع؟","points":["بطاقات الخصم المحلية: شريحة كبيرة من العملاء تعتمد عليها.","بطاقات الائتمان الدولية: Visa وMastercard وغيرها للعملاء المحليين والزوار.","المحافظ الرقمية: الدفع بلمسة من الجوال دون إدخال بيانات البطاقة.","الدفع عند الاستلام: ما زال مطلوبًا لدى فئات من العملاء، لكنه يرفع مخاطر المرتجعات والتكلفة التشغيلية.","التقسيط (اشترِ الآن وادفع لاحقًا): يرفع متوسط قيمة الطلب في بعض الفئات، ويحتاج مزودًا متاحًا في السوق."],"intro":"<p>العميل يغادر إذا لم يجد وسيلة الدفع التي اعتادها. في السوق المحلي والخليجي تتكرر التوقعات التالية:</p>","rule":"<p>كل وسيلة دفع تضيفها يجب أن تحل ترددًا حقيقيًا لدى عميلك، لا أن تزيد الخيارات فقط.</p>","chart":{"kind":"cards","items":["💳 خصم محلي","🌍 ائتمان دولي","📱 محفظة رقمية","💵 عند الاستلام","🗓️ تقسيط"]},"id":"a3s4","note":"⏱ 3 د. اسأل: «ما وسيلة الدفع التي إن غابت تغادرون؟». غالبًا تظهر بطاقات الخصم المحلية والمحافظ."},{"type":"principle","title":"اقرأ هيكل الرسوم قبل أن توقّع","points":["رسوم التأسيس والاشتراك: هل توجد رسوم تفعيل أو اشتراك شهري أو سنوي؟","رسوم المعاملة: نسبة مئوية و/أو مبلغ ثابت لكل عملية، وقد تختلف بين البطاقات المحلية والدولية.","رسوم تحويل العملة: تُضاف عند الدفع بعملة غير عملة التسوية.","رسوم الاسترداد والاعتراض: تكلفة عند استرجاع مبلغ للعميل أو عند اعتراض العميل لدى بنكه.","مدة التسوية: عدد الأيام بين عملية البيع ووصول المال لحسابك؛ تؤثر مباشرة على السيولة."],"intro":"<p>المقارنة الصحيحة بين مزودي الدفع لا تكون بالنسبة المعلنة فقط، بل بكل ما يُخصم ومتى يصلك المال:</p>","rule":"<p>احسب متوسط الرسوم على طلب نموذجي من طلباتك، لا على المثال الذي يعرضه المزود.</p>","chart":{"kind":"equation","items":["رسوم المعاملة","تحويل العملة","الاسترداد والاعتراض","= التكلفة الفعلية لكل طلب"]},"id":"a3s5","note":"⏱ 3 د. احسب مع القاعة رسوم طلب متوسطه 200 ريال عند مزودين افتراضيين؛ هذا يمهد لسؤال التقييم."},{"type":"principle","title":"الدفع متعدد العملات للعملاء الدوليين","points":["عرض الأسعار بعملات متعددة: المتجر يحوّل السعر للعرض فقط، ويتم الدفع فعليًا بالريال القطري.","الدفع الفعلي بعدة عملات: العميل يدفع بعملته، والمزود يحوّل المبلغ عند التسوية.","انتبه لأسعار الصرف: من يتحمل فرق التحويل؟ أنت أم العميل؟ وهل تُقرّب الأسعار لتبدو منطقية بكل عملة؟","اتسق مع الشحن والضرائب: السعر المعروض بعملة العميل يجب أن يوضح ما يشمله: الشحن والرسوم الجمركية أو لا."],"intro":"<p>عندما تبيع لعميل في السعودية أو أوروبا، يفضل أن يرى السعر بعملته ويدفع بها. هناك مستويان:</p>","rule":"<p>العميل الدولي يثق بسعر يفهمه؛ عرض العملة المحلية للعميل يقلل التردد في صفحة الدفع.</p>","chart":{"kind":"compare","items":["👁️ عرض بعملات متعددة :: تحويل للعرض فقط ; الدفع بالريال ; أسهل تقنيًا","💱 دفع بعملات متعددة :: العميل يدفع بعملته ; تحويل عند التسوية ; يحتاج دعم المزود"]},"id":"a3s6","note":"⏱ 2 د. وضح الفرق بين عرض السعر بعملة العميل والدفع الفعلي بها بمثال عميل سعودي."},{"type":"examples","title":"مواقف دفع من الواقع","items":["متجر ملابس محلي بلا QPay::عملاء يحملون بطاقات خصم محلية فقط يغادرون عند صفحة الدفع؛ إضافة البوابة المحلية أعادت جزءًا منهم.","مورد يبيع لشركات::روابط دفع وفواتير إلكترونية بتاريخ استحقاق أنسب من سلة شراء تقليدية.","علامة تبيع للسعودية::عرض الأسعار بالريال السعودي مع توضيح الشحن رفع ثقة العملاء وقلل الاستفسارات.","متجر يعتمد على الدفع عند الاستلام::نسبة عالية من الطلبات المرفوضة عند الباب؛ تحفيز الدفع المسبق بخصم بسيط قلل المرتجعات.","مشروع ناشئ اختار مزودًا برسوم منخفضة::اكتشف أن التسوية تستغرق أسابيع، فتأثرت قدرته على شراء المخزون."],"id":"a3s7","note":"⏱ 2 د. اختر مثال «التسوية تستغرق أسابيع» لربط الدفع بالسيولة."},{"type":"summary","title":"اختر شريك الدفع كما تختار شريك العمل","text":"<p>بوابة الدفع تؤثر على ثلاثة أمور حيوية: من يستطيع أن يدفع لك، وكم تدفع مقابل كل عملية، ومتى يصلك المال. الاختيار الجيد يوازن بين وسائل الدفع التي يتوقعها عميلك، والتكلفة الفعلية، ومدة التسوية.</p>","rule":"<p>وسائل يتوقعها العميل + تكلفة محسوبة + تسوية تناسب سيولتك = بوابة مناسبة.</p>","chart":{"kind":"cycle","items":["وسائل يتوقعها العميل","تكلفة فعلية محسوبة","تسوية مناسبة للسيولة","دعم وتكامل موثوق"]},"id":"a3s8","note":"⏱ 1 د. انتقل إلى تمرين «اختيار بوابة لمشروع حقيقي» الجماعي."}],"exercises":[{"id":"a3e1","title":"رحلة الريال","icon":"💳","mode":"individual","format":"mcq","steps":[],"items":[{"q":"من يوافق على عملية الدفع أو يرفضها؟","options":["شركة الشحن","منصة المتجر","التاجر","البنك المُصدر للبطاقة"],"answer":3},{"q":"ما دور البنك المستحوذ؟","options":["إصدار البطاقة للعميل","استقبال الأموال لصالح التاجر وتحويلها إلى حسابه","تحديد سعر المنتج","تصميم صفحة الدفع"],"answer":1},{"q":"«مدة التسوية» تعني:","options":["مدة تحميل صفحة الدفع","الوقت بين عملية البيع ووصول المال لحساب التاجر","مدة صلاحية البطاقة","مدة الشحن"],"answer":1},{"q":"عميل يحمل بطاقة خصم محلية فقط. ما الذي يحتاجه المتجر ليخدمه؟","options":["تحويلًا بنكيًا دوليًا","PayPal فقط","بوابة تدعم بطاقات الخصم المحلية مثل QPay","دفعًا بالعملات الرقمية"],"answer":2},{"q":"عند المقارنة بين مزودين، ما الطريقة الأصح؟","options":["اختيار أول مزود يرد","مقارنة النسبة المعلنة فقط","حساب الرسوم الفعلية على طلب نموذجي مع مدة التسوية","اختيار الأشهر عالميًا"],"answer":2},{"q":"ما الذي يميز عرض الأسعار بعملات متعددة عن الدفع الفعلي بعدة عملات؟","options":["الأول يلغي رسوم التحويل","الأول تحويل للعرض فقط والدفع يتم بالعملة الأساسية","لا فرق بينهما","الثاني أسهل تقنيًا دائمًا"],"answer":1},{"q":"أي تكلفة تظهر عندما يعترض العميل على العملية لدى بنكه؟","options":["رسوم التصميم","رسوم الاعتراض (Chargeback)","رسوم الاشتراك","رسوم النطاق"],"answer":1},{"q":"مورد B2B يبيع بفواتير لشركات. أي أداة دفع أنسب؟","options":["سلة شراء تقليدية فقط","روابط دفع وفواتير إلكترونية بتاريخ استحقاق","بطاقات هدايا","الدفع عند الاستلام فقط"],"answer":1},{"q":"قبل الاعتماد على Stripe أو PayPal لشركة مسجلة في قطر، ما الذي يجب التحقق منه أولًا؟","options":["إتاحة فتح الحساب واستلام الأموال لبلد تسجيل الشركة","ألوان صفحة الدفع","عدد المتابعين","سرعة الموقع"],"answer":0},{"q":"متجر يعتمد كثيرًا على الدفع عند الاستلام ويعاني من رفض الطلبات عند الباب. ما الإجراء الأنسب؟","options":["رفع الأسعار لكل العملاء","إلغاء التوصيل","تحفيز الدفع المسبق بميزة واضحة مع إبقاء الخيار لفئة محددة","إخفاء خيار الدفع الإلكتروني"],"answer":2}],"scenario":"<p>عشرة أسئلة عن أطراف الدفع ورسومه وخياراته. اختر الإجابة الأدق.</p>","principle":"فهم سلسلة الدفع يكشف أين تذهب الرسوم ولماذا تتأخر الأموال.","hint":"<p>تذكّر الفرق بين البنك المُصدر (بنك العميل) والبنك المستحوذ (بنك التاجر).</p>","why":"يبني فهمًا عمليًا يساعدك في التفاوض مع مزودي الدفع.","axis":"a3"},{"id":"a3e2","title":"صح أم خطأ: أساطير الدفع","icon":"🧾","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"كثرة وسائل الدفع دائمًا أفضل مهما كانت.","answer":false},{"q":"مدة التسوية تؤثر على قدرة المشروع على شراء المخزون ودفع الالتزامات.","answer":true},{"q":"رسوم المعاملة قد تختلف بين البطاقات المحلية والدولية.","answer":true},{"q":"كل مزودي الدفع العالميين متاحون لأي شركة مسجلة في قطر دون قيود.","answer":false},{"q":"المحافظ الرقمية مثل Apple Pay تسرّع الدفع من الجوال.","answer":true},{"q":"الدفع عند الاستلام لا يحمل أي تكلفة تشغيلية على التاجر.","answer":false},{"q":"عرض السعر بعملة العميل الدولي يقلل تردده في صفحة الدفع.","answer":true},{"q":"البنك المستحوذ هو البنك الذي أصدر بطاقة العميل.","answer":false},{"q":"الرسوم المعلنة كنسبة مئوية هي كل ما يدفعه التاجر دائمًا.","answer":false},{"q":"روابط الدفع مفيدة للبيع عبر واتساب والفواتير للشركات.","answer":true}],"principle":"كثير من قرارات الدفع الخاطئة تبدأ من افتراضات غير دقيقة.","hint":"<p>فكّر في التكلفة الفعلية والعميل الحقيقي، لا في العرض التسويقي للمزود.</p>","why":"يصحح أفكارًا شائعة تؤثر على الإيرادات والسيولة.","axis":"a3"},{"id":"a3e3","title":"اختيار بوابة لمشروع حقيقي","icon":"🏦","mode":"group","format":"text","steps":["احسبوا الفرق التقريبي في الرسوم على طلب بقيمة 180 ريالًا (افترضوا النسب بأنفسكم).","حددوا أثر مدة التسوية على السيولة.","قرروا المزود المناسب وبرروا القرار."],"scenario":"<p>متجر قطري يبيع منتجات عناية طبيعية. 70% من طلباته داخل قطر، و30% للسعودية والكويت. متوسط الطلب 180 ريالًا. يعاني من ترك العملاء لصفحة الدفع، ولديه طلبات عبر واتساب تحتاج روابط دفع. أمامكم مزودان: الأول برسوم أقل وتسوية خلال 14 يومًا ولا يدعم بطاقات الخصم المحلية، والثاني برسوم أعلى قليلًا وتسوية خلال 3 أيام ويدعم البطاقات المحلية والمحافظ وروابط الدفع.</p>","principle":"البوابة المناسبة توازن بين وسائل يتوقعها العميل، والتكلفة الفعلية، ومدة التسوية.","task":"<p>اكتبوا قراركم مع ثلاثة مبررات (العميل، التكلفة، السيولة)، وإجراءً واحدًا لتقليل ترك صفحة الدفع، وخطة لعملاء السعودية والكويت (العملة والوسائل).</p>","why":"يدربكم على قرار دفع متوازن لا تحكمه النسبة المعلنة وحدها.","model":"<p>مثال من مجال مختلف: صالة رياضية تختار نظام اشتراكات؛ النظام الأرخص لا يدعم التجديد التلقائي، فخسرت اشتراكات أكثر من قيمة الفرق في الرسوم. طبقوا المنطق نفسه على المتجر.</p>","axis":"a3"},{"id":"a3e4","title":"أكمل الفراغ: لغة الدفع","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"البنك الذي أصدر بطاقة العميل يسمى البنك ___.","answer":"المُصدر"},{"text":"البنك الذي يستقبل الأموال لصالح التاجر هو البنك ___.","answer":"المستحوذ"},{"text":"الوقت بين البيع ووصول المال للحساب يسمى مدة ___.","answer":
