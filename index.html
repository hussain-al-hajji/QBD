سؤول","خطوات مرقمة","معيار الجودة","الاستثناءات والتصعيد","تاريخ المراجعة*"]},"id":"a10s2","note":"⏱ 3 د. اعرض قالب الإجراء القياسي من مكتبة القوالب."},{"type":"tools","title":"إجراءات أساسية يحتاجها كل متجر إلكتروني","items":["إضافة منتج جديد::الصور بمقاسات موحدة، العنوان بالمعادلة، رمز SKU، الخصائص، السعر، والمخزون.","تجهيز الطلب وتغليفه::الالتقاط بالرمز، فحص الجودة، التغليف حسب نوع المنتج، المرفقات، والتسليم للناقل.","خدمة العملاء::زمن الرد المستهدف، الردود المعتمدة، ومتى يُصعَّد للمسؤول.","المرتجعات والاسترداد::شروط القبول، الفحص، مدة الاسترداد، وتحديث المخزون.","إطلاق حملة::الموافقة على المحتوى، روابط التتبع، الميزانية، ومراجعة النتائج.","الإغلاق اليومي::مراجعة الطلبات المعلقة، والمخزون المنخفض، والرسائل غير المردود عليها.","الأمان والصلاحيات::إضافة أو إزالة موظف، وكلمات المرور، والتحقق الثنائي."],"rule":"<p>ابدأ بكتابة الإجراء الذي تتكرر فيه الأخطاء أكثر من غيره.</p>","id":"a10s3","note":"⏱ 2 د. اطلب اختيار الإجراء الأول الذي سيكتبونه."},{"type":"principle","title":"التوسع عبر عدة أسواق ومنصات","points":["الجاهزية التشغيلية: هل الإجراءات مكتوبة؟ وهل المخزون والتنفيذ يتحملان الزيادة؟","ملاءمة المنتج للسوق: هل يوجد طلب حقيقي؟ وهل السعر تنافسي بعد العمولة والشحن؟","متطلبات السوق: التسجيل، الوثائق، المستندات الضريبية، وشروط القوائم والتنفيذ.","مركزية البيانات: كتالوج رئيسي واحد تُشتق منه كل القوائم، ومخزون موحد، وطلبات في نظام واحد.","التوسع المرحلي: سوق جديد كل مرة، مع فترة تجربة ومؤشرات نجاح واضحة."],"intro":"<p>البيع في أكثر من سوق يضاعف فرص الظهور ويقلل الاعتماد على قناة واحدة، لكنه يضاعف أيضًا التعقيد. قبل أي سوق جديد:</p>","rule":"<p>لا تفتح سوقًا جديدًا قبل أن تكون عملياتك في السوق الحالي مستقرة ومكتوبة.</p>","chart":{"kind":"steps","items":["ثبّت::العمليات الحالية","اختبر::ملاءمة المنتج والسعر","جهّز::متطلبات السوق","وحّد::الكتالوج والمخزون","أطلق::بتجربة ومؤشرات"]},"id":"a10s4","note":"⏱ 3 د. اربط التوسع بقصة «سنونو» والتوسع من خدمة ناجحة إلى فئات جديدة."},{"type":"principle","title":"أدوات إدارة القنوات المتعددة","points":["مدير القنوات: ينشر المنتجات ويحدث الأسعار والمخزون في عدة أسواق من مكان واحد.","نظام إدارة الطلبات: يجمع الطلبات من كل القنوات ويرسلها للتنفيذ.","إدارة معلومات المنتجات: مصدر واحد موثوق للأوصاف والصور والخصائص بعدة لغات.","تخطيط الموارد: للأعمال الأكبر، يربط المبيعات بالمحاسبة والمشتريات والمخزون."],"intro":"<p>كلما زادت القنوات، زادت الحاجة لطبقة تقنية تجمعها:</p>","rule":"<p>المصدر الواحد للحقيقة يمنع تضارب الأسعار والمخزون بين القنوات.</p>","chart":{"kind":"hub","items":["🗂️ مصدر واحد للبيانات","متجرك الخاص","Amazon","Noon","القنوات الاجتماعية","متاجر دولية"]},"id":"a10s5","note":"⏱ 2 د. وضح فكرة «المصدر الواحد للحقيقة»."},{"type":"tools","title":"مؤشرات السيطرة على العمليات","items":["زمن الرد على العملاء::متوسط الوقت حتى أول رد، لكل قناة.","نسبة الطلبات المشحونة في موعدها::مقسمة حسب القناة والسوق.","دقة المخزون::الفرق بين المخزون في النظام والمخزون الفعلي عند الجرد.","نسبة الطلبات الصحيحة::دون أخطاء في المنتج أو الكمية أو العنوان.","مؤشرات صحة الحساب في الأسواق::معدل الإلغاء، التأخير، والتقييمات؛ انخفاضها قد يعرّض الحساب للإيقاف.","ربحية كل قناة::الإيراد ناقص العمولة والشحن والإعلانات والمرتجعات."],"rule":"<p>القناة التي تبيع كثيرًا ليست بالضرورة القناة التي تربح كثيرًا.</p>","id":"a10s6","note":"⏱ 2 د. ركز على ربحية كل قناة لا مبيعاتها."},{"type":"mistakes","title":"أخطاء التوسع المبكر","items":["فتح عدة أسواق قبل تثبيت العمليات::ثبّت الإجراءات والتنفيذ في سوقك الحالي أولًا.","تعديل الأسعار والمخزون يدويًا في كل قناة::استخدم مصدرًا واحدًا وأداة تزامن.","إجراءات مكتوبة لا يقرؤها أحد::اجعلها قصيرة ومرئية ومرتبطة بالتدريب والمراجعة.","قياس المبيعات دون الربحية::احسب ربح كل قناة بعد العمولات والشحن والإعلانات.","تجاهل مؤشرات صحة الحساب في الأسواق::راقبها أسبوعيًا قبل أن تتحول إلى إيقاف."],"id":"a10s7","note":"⏱ 1 د. مرور سريع."},{"type":"summary","title":"اكتب، وحّد، ثم توسع","text":"<p>التوسع الصحي يقوم على إجراءات مكتوبة يطبقها الفريق بجودة ثابتة، ومصدر واحد للبيانات يجمع القنوات، ومؤشرات سيطرة تكشف المشكلات مبكرًا، وتوسع مرحلي سوقًا بعد سوق.</p>","rule":"<p>إجراءات مكتوبة + مصدر واحد للبيانات + مؤشرات سيطرة = توسع بلا فوضى.</p>","chart":{"kind":"equation","items":["إجراءات مكتوبة","مصدر واحد للبيانات","مؤشرات سيطرة","= توسع بلا فوضى"]},"id":"a10s8","note":"⏱ 1 د. انتقل إلى تمرين «اكتب إجراءً قياسيًا» الجماعي."}],"exercises":[{"id":"a10e1","title":"اكتب إجراءً قياسيًا","icon":"📘","mode":"group","format":"text","steps":["اكتبوا العنوان والهدف والمسؤول.","اكتبوا 6 إلى 8 خطوات مرقمة بأفعال واضحة.","أضيفوا معيار الجودة والاستثناءات وطريقة التصعيد."],"scenario":"<p>متجر عطور يعاني من كسر 5% من الزجاجات أثناء الشحن، ومن تأخر تجهيز الطلبات عندما يغيب الموظف الأقدم. المطلوب إجراء تشغيل قياسي لتجهيز وتغليف طلبات العطور.</p>","principle":"الإجراء الجيد قصير وواضح، ويحدد المسؤول والخطوات ومعيار الجودة والاستثناءات.","task":"<p>اكتبوا الإجراء كاملًا: العنوان، الهدف، المسؤول، الخطوات المرقمة، معيار الجودة (كيف نعرف أن الطلب جاهز؟)، والاستثناءات (مثل منتج تالف أو عنوان ناقص).</p>","why":"يدرب على تحويل الخبرة الضمنية إلى إجراء مكتوب يطبقه أي عضو في الفريق.","model":"<p>مثال من مجال مختلف: إجراء فتح مقهى صباحًا — 1) تشغيل آلة القهوة ومعايرتها، 2) فحص الحليب وتاريخه... معيار الجودة: أول كوب يطابق الوصفة. الاستثناء: عطل الآلة ← الاتصال بالفني وتفعيل قائمة المشروبات الباردة. طبقوا الطريقة نفسها على تغليف العطور.</p>","axis":"a10"},{"id":"a10e2","title":"جاهز للتوسع؟","icon":"🚦","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"الإجراء القياسي الجيد يمكن لشخص جديد تطبيقه دون أسئلة كثيرة.","answer":true},{"q":"كتابة الإجراءات مرة واحدة تكفي ولا تحتاج مراجعة أبدًا.","answer":false},{"q":"البيع في عدة أسواق يقلل الاعتماد على قناة واحدة.","answer":true},{"q":"القناة الأعلى مبيعات هي دائمًا الأعلى ربحًا.","answer":false},{"q":"المصدر الواحد لبيانات المنتجات يقلل تضارب الأسعار بين القنوات.","answer":true},{"q":"من الأفضل فتح خمسة أسواق دفعة واحدة لتسريع النمو.","answer":false},{"q":"مؤشرات صحة الحساب في الأسواق الإلكترونية قد تؤدي لإيقاف الحساب إذا تدهورت.","answer":true},{"q":"تحديث المخزون يدويًا في كل قناة ممارسة آمنة مع زيادة الطلبات.","answer":false},{"q":"دقة المخزون تُقاس بمقارنة النظام بالجرد الفعلي.","answer":true},{"q":"الإجراءات المكتوبة تسرّع تدريب الموظفين الجدد.","answer":true}],"principle":"التوسع يضاعف ما هو موجود: إن كانت العمليات منظمة تضاعف النجاح، وإن كانت فوضوية تضاعفت الفوضى.","hint":"<p>فكر في الربحية والسيطرة، لا في المبيعات فقط.</p>","why":"يختبر فهم متطلبات التوسع عبر القنوات المتعددة.","axis":"a10"},{"id":"a10e3","title":"أيهما أدق؟","icon":"🔍","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"نكتب الإجراء بخطوات مرقمة ومعيار جودة واضح.","b":"نكتب الإجراء كفقرة طويلة عامة.","answer":"a"},{"a":"نختبر الإجراء مع موظف جديد قبل اعتماده.","b":"نعتمد الإجراء لأن كاتبه يفهمه.","answer":"a"},{"a":"نحدّث الأسعار في كل سوق يدويًا.","b":"نحدّث الأسعار من مصدر واحد يتزامن مع كل القنوات.","answer":"b"},{"a":"نحكم على القناة بمبيعاتها فقط.","b":"نحكم على القناة بربحها بعد العمولات والشحن والإعلانات.","answer":"b"},{"a":"نفتح سوقًا جديدًا بعد استقرار العمليات الحالية.","b":"نفتح سوقًا جديدًا لتعويض فوضى السوق الحالي.","answer":"a"},{"a":"نراجع مؤشرات صحة الحساب أسبوعيًا.","b":"ننتظر رسالة التحذير من السوق.","answer":"a"},{"a":"نحدد في كل إجراء متى وإلى من نصعّد.","b":"نترك الاستثناءات لتقدير الموظف دائمًا.","answer":"a"},{"a":"نبدأ بكتابة الإجراء الذي تتكرر فيه الأخطاء.","b":"نبدأ بكتابة كل الإجراءات دفعة واحدة.","answer":"a"},{"a":"نجعل الإجراءات قصيرة ومرئية ومرتبطة بالتدريب.","b":"نحفظ الإجراءات في ملف لا يراجعه أحد.","answer":"a"},{"a":"نقيس زمن الرد على العملاء لكل قناة.","b":"نقيس زمن الرد عندما يشتكي العملاء فقط.","answer":"a"}],"principle":"السيطرة على العمليات شرط للتوسع المربح.","hint":"<p>اختاروا الممارسة التي تحافظ على الجودة والربحية مع النمو.</p>","why":"يفتح نقاشًا حول قرارات التوسع والتنظيم.","axis":"a10"},{"id":"a10e4","title":"اختر الخطوة التالية","icon":"🧭","mode":"individual","format":"mcq","steps":[],"items":[{"q":"متجر يبيع جيدًا في قطر ويريد دخول Noon في الإمارات، لكن نسبة التأخير في الشحن المحلي 15%. ما الخطوة التالية؟","options":["فتح Amazon أيضًا","معالجة التأخير وتثبيت التنفيذ محليًا أولًا","رفع الأسعار","الدخول فورًا"],"answer":1},{"q":"ما أول إجراء قياسي يُكتب في متجر تكثر فيه أخطاء التغليف؟","options":["إجراء الإغلاق السنوي","إجراء تجهيز الطلب وتغليفه","إجراء التوظيف","إجراء إطلاق الحملات"],"answer":1},{"q":"متجر على 4 قنوات والأسعار متضاربة بينها. ما الحل الأنسب؟","options":["تجاهل المشكلة","مصدر واحد للأسعار والمخزون مع أداة تزامن","إغلاق قناتين عشوائيًا","تعديلها يدويًا كل صباح"],"answer":1},{"q":"كيف تعرف أن الإجراء المكتوب جاهز؟","options":["عندما يُطبع","عندما يكون طويلًا ومفصلًا جدًا","عندما يوقّع عليه المدير فقط","عندما ينفذه موظف جديد دون أسئلة كثيرة"],"answer":3},{"q":"سوق إلكتروني يحقق 40% من المبيعات لكن ربحه بعد العمولة والإعلانات قريب من الصفر. ما الإجراء الأنسب؟","options":["إغلاق كل القنوات الأخرى","زيادة الإعلانات فيه","تجاهل الربحية","مراجعة التسعير والتكاليف والمنتجات المعروضة فيه لرفع الربحية"],"answer":3},{"q":"ما الغرض من «تاريخ المراجعة» في الإجراء؟","options":["التجميل","معرفة كاتبه","لا غرض","ضمان تحديث الإجراء مع تغير الأدوات والسياسات"],"answer":3},{"q":"ما الأداة التي تنشر المنتجات وتحدث الأسعار والمخزون في عدة أسواق من مكان واحد؟","options":["البريد الإلكتروني","بوابة الدفع","أداة تصميم الصور","مدير القنوات"],"answer":3},{"q":"مؤشر «دقة المخزون» منخفض. ماذا يعني؟","options":["الشحن بطيء","الأسعار مرتفعة","المبيعات منخفضة","فرق كبير بين مخزون النظام والمخزون الفعلي"],"answer":3},{"q":"قبل دخول سوق جديد، ما السؤال المتعلق بالمنتج؟","options":["هل يمكن تغيير اللون؟","هل الشعار جميل؟","هل المنافس موجود؟","هل يوجد طلب حقيقي والسعر تنافسي بعد العمولة والشحن؟"],"answer":3},{"q":"ما الذي يحدث غالبًا عند التوسع بعمليات فوضوية؟","options":["يتحسن رضا العملاء","تختفي الفوضى","تنخفض التكاليف تلقائيًا","تتضاعف الأخطاء مع زيادة الحجم"],"answer":3}],"scenario":"<p>عشرة مواقف توسع وتنظيم. اختر الخطوة التالية الأصح.</p>","principle":"التوسع المرحلي المنظم يقلل المخاطر ويحافظ على الربحية.","hint":"<p>فكّر: ما الذي يجب أن يكون مستقرًا قبل هذه الخطوة؟</p>","why":"يدرب على ترتيب أولويات التوسع.","axis":"a10"}],"highlights":["ما إجراء التشغيل القياسي ولماذا نحتاجه","هيكل إجراء مكتوب قابل للتطبيق","إجراءات أساسية لكل متجر إلكتروني","البيع في عدة أسواق: المزايا والمخاطر","أدوات إدارة القنوات المتعددة ومؤشرات السيطرة"],"unit":5,"icon":"route","color":9,"scene":"navigation","title":"إجراءات قياسية وتوسع بلا فوضى","classic":"إجراءات التشغيل القياسية (SOPs) للعمليات الإلكترونية، والتوسع عبر عدة أسواق ومنصات عالمية","duration":"20 دقيقة","desc":"<p>المتجر الذي يعتمد على ذاكرة صاحبه يتوقف عندما يغيب. إجراءات التشغيل القياسية تحول المعرفة إلى خطوات مكتوبة يطبقها أي فرد في الفريق بالجودة نفسها. وهي الأساس الذي يسمح بالتوسع إلى أسواق ومنصات متعددة دون فقدان السيطرة.</p>","outcome":"يكتب إجراء تشغيل قياسيًا ويقيّم جاهزية التوسع عبر عدة قنوات وأسواق."},{"id":"a11","slides":[{"type":"opening","title":"ليست المشكلة في قلة البيانات","text":"<p>أغلب أصحاب المتاجر لا يعانون من نقص البيانات، بل من كثرتها. لوحات مليئة بالأرقام والرسوم، دون سؤال واضح. القراءة الصحيحة تبدأ من سؤال تجاري محدد: لماذا انخفضت المبيعات هذا الأسبوع؟ أي منتج يستحق ميزانية الإعلان؟ هل رفع السعر أثّر على الطلب؟</p>","rule":"<p>ابدأ من السؤال، ثم ابحث عن الرقم الذي يجيب عنه.</p>","chart":{"kind":"flow","items":["سؤال تجاري","الرقم المناسب","قراءة وتفسير","فرضية","قرار*"]},"id":"a11s1","note":"⏱ 2 د. اسأل: «ما الرقم الذي تنظرون إليه أولًا كل صباح؟»."},{"type":"principle","title":"المؤشرات الأساسية لأي متجر","points":["المبيعات والإيرادات: إجمالي المبيعات وعدد الطلبات، مقارنة بالفترة السابقة والفترة نفسها من العام الماضي.","الزيارات ومصادرها: من أين يأتي الزوار؟ بحث، إعلانات، تواصل اجتماعي، مباشر؟","معدل التحويل: الطلبات ÷ الزيارات، مقسمًا حسب المصدر والجهاز.","متوسط قيمة الطلب: الإيرادات ÷ الطلبات.","معدل التخلي عن السلة: السلال المتروكة ÷ السلال المنشأة.","معدل العملاء العائدين: نسبة الطلبات من عملاء اشتروا سابقًا.","معدل المرتجعات: الطلبات المرتجعة ÷ الطلبات المسلمة."],"intro":"<p>قبل أي أداة، اتفق مع فريقك على لوحة صغيرة من المؤشرات تُراجع أسبوعيًا:</p>","rule":"<p>المؤشر الواحد لا يكفي؛ الإيرادات = الزيارات × معدل التحويل × متوسط قيمة الطلب.</p>","chart":{"kind":"equation","items":["الزيارات","معدل التحويل","متوسط قيمة الطلب","= الإيرادات"]},"id":"a11s2","note":"⏱ 3 د. اشرح معادلة الإيرادات = الزيارات × التحويل × متوسط الطلب؛ ستحتاجها في التقييم البعدي."},{"type":"principle","title":"قمع التحويل: أين يتسرب العملاء؟","points":["زيارة المتجر ← مشاهدة منتج ← إضافة للسلة ← بدء الدفع ← إتمام الطلب.","احسب نسبة الانتقال بين كل خطوتين، وقارنها بالفترات السابقة.","أكبر انخفاض بين خطوتين هو أولوية التحسين الأولى.","قسّم القمع حسب الجهاز والمصدر: قد يكون الجوال أضعف بكثير من الحاسوب، أو قناة معينة تجلب زيارات لا تشتري."],"intro":"<p>قمع التحويل يعرض عدد الزوار في كل خطوة من رحلة الشراء، ويكشف أكبر نقطة تسرب:</p>","rule":"<p>لا تحسن كل شيء معًا؛ عالج أكبر تسرب أولًا ثم قِس الأثر.</p>","chart":{"kind":"funnel","items":["زيارات::20000","مشاهدة منتج::9000","إضافة للسلة::1800","بدء الدفع::900","طلب مكتمل::420"]},"id":"a11s3","note":"⏱ 4 د. اطلب من القاعة تحديد أكبر تسرب قبل عرض الإجابة."},{"type":"examples","title":"قراءة القمع السابق","items":["من الزيارات إلى مشاهدة المنتج 45%::نسبة جيدة نسبيًا؛ الصفحات الرئيسية والتصنيفات توصل الزوار للمنتجات.","من المشاهدة إلى الإضافة للسلة 20%::تسرب واضح؛ ربما السعر أو الصور أو المعلومات أو تكلفة الشحن غير الظاهرة.","من السلة إلى بدء الدفع 50%::نصف السلال تُترك قبل الدفع؛ راجع إجبار التسجيل وظهور التكاليف.","من بدء الدفع إلى الإتمام نحو 47%::تسرب داخل صفحة الدفع نفسها؛ راجع وسائل الدفع والأخطاء التقنية.","معدل التحويل العام 2.1%::420 طلبًا من 20,000 زيارة؛ رقم يُقارن بتاريخ المتجر نفسه قبل مقارنته بالمتاجر الأخرى."],"id":"a11s4","note":"⏱ 3 د. اقرأ النسب مع القاعة واربط كل تسرب بمحور سابق."},{"type":"principle","title":"أداء المنتجات: ما يبيع ليس دائمًا ما يربح","points":["الإيراد والكمية: كم باع المنتج وكم حقق؟","هامش الربح: الإيراد ناقص تكلفة المنتج والشحن والعمولات والإعلانات المخصصة له.","معدل التحويل لصفحة المنتج: منتج يُشاهد كثيرًا ولا يُشترى يحتاج مراجعة صفحته أو سعره.","معدل المرتجعات والتقييمات: منتج يبيع كثيرًا ويعود كثيرًا قد يخسر المال والسمعة.","دوران المخزون: كم مرة يُباع المخزون ويُجدّد خلال السنة؛ البطيء يحبس السيولة."],"intro":"<p>قراءة أداء المنتجات تحتاج أكثر من قائمة «الأكثر مبيعًا»:</p>","rule":"<p>صنّف منتجاتك في مصفوفة الطلب والربح، وخصص الجهد والميزانية حسب موقع كل منتج.</p>","chart":{"kind":"matrix","items":["حجم المبيعات","هامش الربح","منتجات متميزة غير مكتشفة","النجوم ✓","مراجعة أو إيقاف","جالبة زيارات منخفضة الهامش"]},"id":"a11s5","note":"⏱ 3 د. اطلب تصنيف منتج واحد من كل مشروع في المصفوفة."},{"type":"principle","title":"التسعير المبني على البيانات","points":["الحد الأدنى: ما التكلفة الكاملة للوحدة (المنتج + الشحن + الرسوم + العمولة + التسويق)؟ وأي سعر أقل منها خسارة.","حساسية السعر: عند تغيير السعر، كيف تغير معدل التحويل وحجم المبيعات؟","أسعار المنافسين: راقبها دوريًا، خصوصًا في الأسواق الإلكترونية حيث تظهر الأسعار جنبًا إلى جنب.","الباقات والحدود: حد الشحن المجاني والباقات ترفع متوسط قيمة الطلب؛ راقب أثرها على الهامش.","الخصومات: قِس الربح الإضافي الفعلي بعد الخصم، لا زيادة المبيعات فقط."],"intro":"<p>السعر ليس رقمًا ثابتًا، بل قرار يُختبر ويُراجع. أسئلة تجيب عنها البيانات:</p>","rule":"<p>الخصم الذي يرفع المبيعات ويخفض الربح الإجمالي ليس نجاحًا.</p>","chart":{"kind":"bars","items":["تكلفة المنتج::45","الشحن والتغليف::15","رسوم الدفع والعمولة::12","التسويق::18","صافي الربح::10"]},"id":"a11s6","note":"⏱ 3 د. ناقش مثال الخصم الذي يرفع المبيعات ويخفض الربح."},{"type":"tools","title":"أدوات التحليل الأساسية","items":["Google Analytics 4::مصادر الزيارات، القمع، التحويلات، والإيرادات حسب القناة والجهاز.","تحليلات منصة المتجر::تقارير المبيعات والمنتجات والعملاء والسلال المتروكة في Shopify وغيرها.","لوحات الأسواق الإلكترونية::أداء القوائم، الظهور، معدل التحويل، ومؤشرات صحة الحساب لدى Amazon وNoon.","Google Search Console::كلمات البحث التي تظهر بها صفحاتك في Google ونسب النقر.","خرائط الحرارة وتسجيل الجلسات::Microsoft Clarity أو Hotjar لرؤية سلوك الزوار داخل الصفحة.","جداول البيانات ولوحات العرض::Google Sheets أو Looker Studio لجمع المؤشرات في لوحة أسبوعية واحدة."],"rule":"<p>لوحة واحدة أسبوعية تُقرأ فعلًا أفضل من عشر أدوات لا يفتحها أحد.</p>","id":"a11s7","note":"⏱ 2 د. اسأل عن الأدوات المستخدمة حاليًا."},{"type":"principle","title":"من الرقم إلى القرار: دورة التحسين","points":["لاحظ: رقم غير طبيعي أو تسرب كبير في القمع.","فسّر: اسأل لماذا؟ واجمع أدلة من التقييمات وتسجيلات الجلسات وتقسيم البيانات.","افترض: «إذا أظهرنا تكلفة الشحن في صفحة المنتج، فستزيد نسبة الإضافة للسلة».","جرّب: غيّر عنصرًا واحدًا، ويفضل اختبار نسختين (A/B) عند توفر زيارات كافية.","قِس وقرّر: قارن النتائج بعد مدة كافية، ثم اعتمد التغيير أو تراجع عنه."],"intro":"<p>قيمة البيانات في القرار الذي تنتجه. دورة عملية من خمس خطوات:</p>","rule":"<p>غيّر شيئًا واحدًا في كل مرة، وإلا فلن تعرف ما الذي صنع الفرق.</p>","chart":{"kind":"cycle","items":["لاحظ","فسّر","افترض","جرّب","قِس وقرّر"]},"id":"a11s8","note":"⏱ 2 د. اكتب فرضية «إذا… فإن…» مع القاعة."},{"type":"mistakes","title":"أخطاء في قراءة البيانات","items":["الحكم من يوم أو يومين::انتظر حجم بيانات كافيًا وقارن بفترات مماثلة (الأسبوع بالأسبوع، الموسم بالموسم).","الخلط بين الارتباط والسبب::ارتفاع المبيعات مع حملة لا يعني أن الحملة وحدها السبب؛ تحقق بالتتبع والتجربة.","متوسطات تخفي الحقيقة::قسّم البيانات حسب الجهاز والمصدر والفئة؛ المتوسط قد يخفي قناة خاسرة.","مؤشرات الغرور::الإعجابات والزيارات بلا تحويل تبدو جميلة ولا تدفع الفواتير.","قياس دون قرار::كل تقرير يجب أن ينتهي بسؤال: ماذا سنفعل بناءً على هذا؟"],"id":"a11s9","note":"⏱ 1 د. مرور سريع."},{"type":"summary","title":"أرقام قليلة، قراءة عميقة، قرار واضح","text":"<p>لوحة قيادة صغيرة تُراجع أسبوعيًا، وقمع تحويل يكشف أكبر تسرب، ومصفوفة منتجات تربط الطلب بالربح، وتسعير يُختبر ولا يُخمّن؛ ثم دورة تحسين تحول كل رقم إلى فرضية وتجربة وقرار.</p>","rule":"<p>سؤال واضح، رقم مناسب، تغيير واحد، قياس عادل، ثم قرار.</p>","chart":{"kind":"steps","items":["سؤال::ماذا نريد أن نعرف؟","رقم::أي مؤشر يجيب؟","فرضية::إذا... فإن...","تجربة::تغيير واحد","قرار::اعتماد أو تراجع"]},"id":"a11s10","note":"⏱ 1 د. انتقل إلى «اقرأ القمع» ثم «اجتماع الأرقام»."}],"exercises":[{"id":"a11e1","title":"اقرأ القمع","icon":"🔬","mode":"individual","format":"mcq","steps":[],"items":[{"q":"كم معدل التحويل العام؟","options":["15%","1.5%","3%","0.5%"],"answer":1},{"q":"كم متوسط قيمة الطلب؟","options":["300 ريال","200 ريال","100 ريال","450 ريالًا"],"answer":1},{"q":"كم نسبة الانتقال من مشاهدة المنتج إلى الإضافة للسلة؟","options":["12.5%","40%","50%","25%"],"answer":0},{"q":"أين أكبر تسرب نسبي في هذا القمع؟","options":["من مشاهدة المنتج إلى الإضافة للسلة","من الزيارات إلى المشاهدة","من بدء الدفع إلى الإتمام","من السلة إلى بدء الدفع"],"answer":0},{"q":"ما الفرضية الأنسب لتحسين أكبر تسرب؟","options":["تغيير لون الشعار","زيادة إعلانات الوعي","تحسين صفحة المنتج: صور ومعلومات وظهور تكلفة الشحن","إلغاء صفحة الدفع"],"answer":2},{"q":"إذا ارتفع معدل التحويل إلى 2% مع بقاء الزيارات ومتوسط الطلب، كم تصبح الإيرادات؟","options":["150,000 ريال","60,000 ريال","120,000 ريال","90,000 ريال"],"answer":2},{"q":"نسبة الإتمام من بدء الدفع 50%. ماذا تراجع أولًا؟","options":["الكلمات المفتاحية","وسائل الدفع والأخطاء التقنية والتكاليف المفاجئة في صفحة الدفع","المنشورات الاجتماعية","صور المنتجات"],"answer":1},{"q":"الجوال يحقق 70% من الزيارات لكن تحويله نصف تحويل الحاسوب. ما الاستنتاج؟","options":["تجربة الجوال تحتاج مراجعة لأنها تضيع أغلب الفرص","يجب إيقاف زيارات الجوال","الحاسوب هو المشكلة","الجوال غير مهم"],"answer":0},{"q":"كيف تختبر أثر تغيير صفحة المنتج بشكل عادل؟","options":["تغيير عنصر واحد وقياس النتيجة لمدة كافية، أو اختبار A/B","الاعتماد على الإعجابات","سؤال صديق عن رأيه","تغيير عدة عناصر معًا والحكم بعد يوم"],"answer":0},{"q":"أي مما يلي يُعد «مؤشر غرور»؟","options":["معدل العملاء العائدين","متوسط قيمة الطلب","عدد الإعجابات دون ربطه بالمبيعات","معدل التحويل"],"answer":2}],"scenario":"<p>متجر إلكتروني خلال شهر: 30,000 زيارة، 12,000 مشاهدة منتج، 1,500 إضافة للسلة، 900 بدء دفع، 450 طلبًا مكتملًا، وإيرادات 90,000 ريال.</p>","chart":{"kind":"funnel","items":["زيارات::30000","مشاهدة منتج::12000","إضافة للسلة::1500","بدء دفع::900","مكتمل::450"]},"principle":"القمع يكشف أكبر نقطة تسرب، والمؤشرات المركبة تفسر الإيرادات.","hint":"<p>نسبة الانتقال = الخطوة التالية ÷ الخطوة السابقة.</p>","why":"يدرب على الحساب والتفسير السريع قبل أي قرار تحسين.","axis":"a11"},{"id":"a11e2","title":"صح أم خطأ: البيانات والقرار","icon":"📊","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"الإيرادات = الزيارات × معدل التحويل × متوسط قيمة الطلب.","answer":true},{"q":"المنتج الأكثر مبيعًا هو دائمًا الأكثر ربحًا.","answer":false},{"q":"المتوسط العام قد يخفي قناة أو جهازًا بأداء ضعيف.","answer":true},{"q":"الحكم على تغيير في الموقع بعد يوم واحد كافٍ دائمًا.","answer":false},{"q":"الخصم الذي يرفع المبيعات ويخفض الربح الإجمالي قد لا يكون ناجحًا.","answer":true},{"q":"تغيير عدة عناصر في الصفحة معًا يسهل معرفة سبب التحسن.","answer":false},{"q":"Google Search Console تعرض كلمات البحث التي تظهر بها صفحاتك.","answer":true},{"q":"ارتفاع المبيعات أثناء حملة يثبت وحده أن الحملة هي السبب الوحيد.","answer":false},{"q":"دوران المخزون البطيء يحبس السيولة.","answer":true},{"q":"كل تقرير جيد يجب أن ينتهي بقرار أو إجراء.","answer":true}],"principle":"البيانات أداة قرار، وقراءتها تحتاج سياقًا ومقارنة عادلة.","hint":"<p>فكّر في المقارنة والتقسيم والربحية.</p>","why":"يصحح أخطاء شائعة في تفسير الأرقام.","axis":"a11"},{"id":"a11e3","title":"اجتماع الأرقام الأسبوعي","icon":"🗂️","mode":"group","format":"text","steps":["حددوا ثلاث ملاحظات من الأرقام.","اكتبوا لكل ملاحظة تفسيرًا محتملًا وفرضية «إذا... فإن...».","رتبوا الأولويات واختاروا تجربة واحدة للأسبوع القادم."],"scenario":"<p>لوحة أسبوعية لمتجر هدايا: الزيارات ارتفعت 30% بسبب حملة مؤثر، لكن الطلبات ثابتة. معدل التحويل من الجوال 0.9% ومن الحاسوب 2.6%. منتج «صندوق الهدايا الفاخر» يحقق 35% من المبيعات لكن معدل مرتجعاته 14% والتقييمات تشتكي من «الألوان مختلفة عن الصور». المتجر رفع سعر الشحن من 15 إلى 25 ريالًا قبل أسبوعين.</p>","principle":"القراءة الجيدة تربط الأرقام ببعضها، وتنتهي بفرضيات قابلة للاختبار وقرارات واضحة.","task":"<p>اكتبوا محضر الاجتماع: ثلاث ملاحظات، ولكل منها تفسير وفرضية، ثم التجربة المختارة للأسبوع القادم مع المؤشر الذي سيحدد نجاحها.</p>","why":"يحاكي اجتماع قرار حقيقي يربط التسويق والمنتج والتسعير بالبيانات.","model":"<p>مثال من مجال مختلف: مطعم لاحظ ارتفاع الطلبات عبر التطبيق مع انخفاض التقييمات؛ التفسير: تأخر التوصيل وقت الذروة. الفرضية: إذا أضفنا مندوبًا في الذروة، فستعود التقييمات فوق 4.5. طبقوا الطريقة نفسها على متجر الهدايا.</p>","axis":"a11"},{"id":"a11e4","title":"أكمل الفراغ: لغة التحليل","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"الطلبات مقسومة على الزيارات تساوي معدل ___.","answer":"التحويل"},{"text":"الإيرادات مقسومة على عدد الطلبات تساوي متوسط ___ الطلب.","answer":"قيمة"},{"text":"عرض عدد الزوار في كل خطوة من رحلة الشراء يسمى ___ التحويل.","answer":"قمع"},{"text":"اختبار نسختين من الصفحة لمعرفة الأفضل يسمى اختبار ___.","answer":"A/B"},{"text":"الإعجابات بلا مبيعات تسمى مؤشرات ___.","answer":"الغرور"},{"text":"الجملة «إذا... فإن...» تسمى ___.","answer":"الفرضية"},{"text":"عدد مرات بيع المخزون وتجديده خلال السنة يسمى ___ المخزون.","answer":"دوران"},{"text":"قسمة البيانات حسب الجهاز والمصدر تسمى ___.","answer":"التقسيم"},{"text":"الطلبات من عملاء اشتروا سابقًا تقيس معدل العملاء ___.","answer":"العائدين"},{"text":"الإيراد بعد خصم كل التكاليف يسمى صافي ___.","answer":"الربح"}],"principle":"المصطلحات الدقيقة تجعل اجتماعات الأرقام أسرع وأوضح.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط الكلمة ثم الفراغ، واضغط فراغًا ممتلئًا لإفراغه.</p>","why":"يثبت مفردات التحليل الأساسية.","axis":"a11"}],"highlights":["مؤشرات الأداء الأساسية للمتجر","قمع التحويل وأين يتسرب العملاء","أداء المنتجات: ما يبيع وما يربح","قرارات التسعير المبنية على البيانات","من الرقم إلى الفرضية إلى التجربة"],"unit":6,"icon":"chart","color":10,"scene":"data","title":"لوحة القيادة: اقرأ أرقام متجرك","classic":"استخدام أدوات التحليل لتتبع التسعير وأداء المنتجات وتجربة العملاء، وتفسير البيانات لدعم قرارات التسويق والطلب والتوسع","duration":"30 دقيقة","desc":"<p>المتجر الإلكتروني يسجل كل شيء: من زار، ومن أين جاء، وماذا شاهد، وأين توقف، وماذا اشترى. لكن الأرقام لا تتحدث وحدها. هنا نتعلم أي الأرقام تهم، وكيف نقرأها معًا، وكيف نحولها إلى قرارات في التسعير والمنتجات وتجربة العميل.</p>","outcome":"يقرأ قمع التحويل ويحدد أكبر تسرب ويحول الرقم إلى فرضية وتجربة وقرار."},{"id":"a12","slides":[{"type":"opening","title":"النمو قرار، لا مصادفة","text":"<p>بعض المتاجر تنمو بسرعة ثم تتعثر لأن العمليات لم تلحق بالمبيعات، وبعضها يبقى صغيرًا لأنه لم يحدد إلى أين يريد أن يصل. خطة النمو تجيب عن ثلاثة أسئلة: أين نحن الآن؟ إلى أين نريد أن نصل؟ وما الخطوات والموارد التي تنقلنا إلى هناك؟</p>","rule":"<p>خطة النمو الجيدة واقعية في مواردها، طموحة في أهدافها، ومرنة في تفاصيلها.</p>","chart":{"kind":"flow","items":["أين نحن؟","إلى أين؟","كيف؟","بأي موارد؟","كيف نقيس؟*"]},"id":"a12s1","note":"⏱ 2 د. اسأل: «أين تريدون أن يكون مشروعكم بعد 12 شهرًا؟»."},{"type":"principle","title":"مراحل نضج المتجر الإلكتروني","points":["الانطلاق: قناة أو قناتان، عمليات يدوية، التركيز على إثبات الطلب.","التأسيس: متجر منظم، دفع وشحن موثوقان، أول إجراءات مكتوبة، ولوحة مؤشرات أسبوعية.","النمو المحلي: أتمتة المهام المتكررة، قنوات متعددة، فريق صغير متخصص، وتسويق مبني على البيانات.","التوسع الإقليمي: أسواق خليجية، شحن عبر الحدود، تسعير بعدة عملات، ومصدر واحد للبيانات.","التوسع الدولي: أسواق عالمية، شراكات تنفيذ، امتثال متعدد الدول، وعلامة قوية."],"intro":"<p>تحديد مرحلتك الحالية يمنعك من القفز لمرحلة لم تجهز لها:</p>","rule":"<p>لا تنتقل للمرحلة التالية قبل أن تثبت ركائز المرحلة الحالية.</p>","chart":{"kind":"steps","items":["الانطلاق::إثبات الطلب","التأسيس::تنظيم ومؤشرات","النمو المحلي::أتمتة وقنوات","التوسع الإقليمي::أسواق الخليج","التوسع الدولي::أسواق عالمية"]},"id":"a12s2","note":"⏱ 3 د. اطلب من كل متدرب تحديد مرحلته."},{"type":"principle","title":"كيف تختار السوق الدولي التالي؟","points":["حجم الطلب: هل يبحث الناس عن منتجك هناك؟ (أدوات البحث، الأسواق الإلكترونية، المنافسون).","القرب والتشابه: الذوق، واللغة، والثقافة الشرائية، والمسافة وتكلفة الشحن.","سهولة الدخول: التسجيل، والتراخيص، والرسوم الجمركية والضرائب، ومتطلبات المنتج.","البنية التحتية: الأسواق الإلكترونية المتاحة، ووسائل الدفع، وشركاء الشحن.","المنافسة والسعر: هل يمكنك المنافسة بعد إضافة الشحن والرسوم والعمولات؟"],"intro":"<p>اختيار السوق يجب أن يكون قرارًا مدروسًا لا انطباعًا. معايير عملية للمقارنة بين الأسواق:</p>","rule":"<p>استخدم مصفوفة موزونة كما فعلنا مع المنصات، وابدأ بالسوق الأعلى نتيجة والأقل مخاطرة.</p>","chart":{"kind":"table","items":["المعيار ; السعودية ; الإمارات ; الكويت","حجم الطلب ; مرتفع ; مرتفع ; متوسط","القرب والتشابه ; مرتفع ; مرتفع ; مرتفع","سهولة الدخول ; متوسطة ; مرتفعة ; متوسطة","البنية التحتية ; مرتفعة ; مرتفعة جدًا ; متوسطة","المنافسة ; مرتفعة ; مرتفعة جدًا ; متوسطة"]},"id":"a12s3","note":"⏱ 3 د. اربط المصفوفة الموزونة بما تعلموه في المحور الثاني."},{"type":"principle","title":"خطة النمو في خمس ركائز","points":["القنوات والأسواق: أين سنبيع خلال 12 شهرًا؟ وبأي ترتيب؟","الدفع والتسعير: وسائل الدفع والعملات والتسعير لكل سوق.","التنفيذ واللوجستيات: نموذج التنفيذ لكل سوق، وشريك الشحن، ومسار المرتجعات.","التسويق والعملاء: القنوات، والميزانية، ومستهدفات تكلفة الاستحواذ والقيمة الدائمة.","العمليات والبيانات: الإجراءات والأتمتة ولوحة المؤشرات والفريق.","ويُضاف لها التمويل والدعم: من أين ستأتي الموارد؟ وأي برامج دعم تناسب مرحلتك؟"],"intro":"<p>خطة نمو عملية لمتجر صغير أو متوسط يمكن أن تُكتب في صفحتين، حول خمس ركائز تعلمناها في البرنامج:</p>","rule":"<p>كل ركيزة تحتاج هدفًا رقميًا ومسؤولًا وموعدًا.</p>","chart":{"kind":"hub","items":["🚀 خطة النمو","القنوات والأسواق","الدفع والتسعير","التنفيذ واللوجستيات","التسويق والعملاء","العمليات والبيانات","التمويل والدعم"]},"id":"a12s4","note":"⏱ 3 د. قدم تمرين «خطة نمو مشروعك في صفحة» كمخرج شخصي يأخذونه معهم."},{"type":"principle","title":"أهداف قابلة للقياس ومراجعة دورية","points":["هدف ذكي: محدد، قابل للقياس، ممكن، مرتبط بالنمو، ومحدد بزمن. مثال: «رفع نسبة المبيعات الخليجية من 10% إلى 30% خلال 12 شهرًا».","مؤشرات قيادية ومتأخرة: المتأخرة تقيس النتيجة (الإيرادات)، والقيادية تتنبأ بها (الزيارات من السوق الجديد، معدل التحويل فيه).","مراجعة ربع سنوية: ماذا تحقق؟ ماذا تعلمنا؟ ماذا نغير؟","خطة بديلة: ماذا نفعل إذا لم يحقق السوق الجديد مؤشراته خلال ستة أشهر؟"],"intro":"<p>الخطة التي لا تُقاس تتحول إلى أمنيات. لكل ركيزة:</p>","rule":"<p>راجع الخطة كل ربع سنة؛ السوق يتغير، والخطة الجيدة تتغير معه.</p>","chart":{"kind":"timeline","items":["الربع الأول::تأسيس وتجربة","الربع الثاني::قياس وتعديل*","الربع الثالث::توسع مدروس","الربع الرابع::تقييم سنوي"]},"id":"a12s5","note":"⏱ 2 د. وضح الفرق بين المؤشرات القيادية والمتأخرة بمثال."},{"type":"tools","title":"منظومة دعم بنك قطر للتنمية للمشاريع الصغيرة والمتوسطة","items":["الحلول التمويلية::تمويل مباشر وبرامج تمويل غير مباشر بالشراكة مع البنوك، وبرامج ضمانات مثل «الضمين»، لدعم رأس المال العامل والتوسع والمعدات.","بوابة التمويل الوطنية «تمكين»::منصة رقمية أطلقها البنك لتوحيد طلبات تمويل الأعمال: طلب واحد يصل إلى عدة بنوك وطنية مشاركة، فيستقبل صاحب المشروع العروض من بوابة واحدة.","دعم التصدير (تصدير)::وكالة تنمية الصادرات «تصدير» التابعة للبنك تدعم الوصول للأسواق الخارجية بالمعلومات والمعارض والبعثات وحلول ائتمان وتأمين الصادرات.","الاحتضان والتسريع::برامج احتضان ومسرعات أعمال بالشراكة مع حاضنات قطرية لتطوير المشاريع الناشئة ونماذج أعمالها.","الاستشارات وتطوير الأعمال::خدمات استشارية وبرامج تدريب وتطوير قدرات لرواد الأعمال والمشاريع القائمة.","التمكين الرقمي::برامج ومبادرات تدعم تحول المشاريع إلى القنوات الرقمية وتبني التقنيات والتجارة الإلكترونية.","البرامج التدريبية مثل هذا البرنامج::جزء من منظومة بناء القدرات التي يقدمها البنك لرواد الأعمال."],"rule":"<p>شروط الأهلية وتفاصيل البرامج تتحدث باستمرار؛ المرجع الرسمي هو موقع البنك وقنواته (qdb.qa) أو التواصل المباشر مع فريقه.</p>","srcUrl":"https://www.qdb.qa/about/news/news/qdb-unveils-nfg-tamkeen","srcLabel":"خبر إطلاق بوابة التمويل الوطنية «تمكين» — بنك قطر للتنمية","id":"a12s6","note":"⏱ 4 د. عرّف بمنظومة دعم البنك وبوابة «تمكين» واطلب من المهتمين تعبئة نموذج «أنا مهتم» في المنصة. نبّه أن الشروط المحدثة على موقع البنك."},{"type":"examples","title":"ربط خطة النمو بمنظومة الدعم","items":["متجر في مرحلة التأسيس::يحتاج تطوير المتجر وتنظيم العمليات؛ الاستشارات وبرامج بناء القدرات أنسب من التمويل الكبير الآن.","متجر يريد مخزونًا أكبر لموسم رمضان::الحلول التمويلية لرأس المال العامل قد تناسبه، بشرط خطة مبيعات واضحة وأرقام مقنعة.","علامة قطرية تتوسع للخليج::خدمات «تصدير» للمعلومات عن الأسواق والمعارض قد تختصر عليها وقتًا وتكلفة.","مشروع ناشئ بفكرة تجارة إلكترونية مبتكرة::برامج الاحتضان والتسريع تساعده على اختبار نموذج العمل قبل التوسع.","في كل الحالات::خطة نمو مكتوبة بأرقام ومؤشرات ترفع جاهزية المشروع للتقديم على أي برنامج دعم."],"id":"a12s7","note":"⏱ 2 د. اربط كل مثال بمرحلة نضج."},{"type":"mistakes","title":"أخطاء في التخطيط للنمو","items":["خطة طموحة بلا موارد::اربط كل هدف بالميزانية والفريق والوقت المطلوب.","التوسع لعدة أسواق دفعة واحدة::سوق واحد جديد في كل مرة، بتجربة ومؤشرات نجاح.","التمويل قبل الجاهزية::التمويل يضاعف ما هو موجود؛ نظّم العمليات أولًا.","خطة تُكتب وتُنسى::مراجعة ربع سنوية بمؤشرات قيادية ومتأخرة.","تجاهل منظومة الدعم::تعرف على البرامج المتاحة مبكرًا لتخطط لها بدل البحث عنها وقت الأزمة."],"id":"a12s8","note":"⏱ 1 د. مرور سريع."},{"type":"summary","title":"من ورشة تدريبية إلى خطة عمل","text":"<p>خطة النمو تجمع ما تعلمناه: منصة مناسبة، ودفع آمن، وتنفيذ موثوق، وتسويق مبني على البيانات، وعمليات قابلة للتوسع، ولوحة مؤشرات تقود القرار. ومع منظومة الدعم المتاحة يصبح التوسع الإقليمي والدولي خطوة مدروسة لا مغامرة.</p>","rule":"<p>اعرف مرحلتك، اختر سوقك التالي بمعايير، اكتب خطتك بأرقام، واستفد من منظومة الدعم.</p>","chart":{"kind":"equation","items":["مرحلة واضحة","سوق مختار بمعايير","خطة بأرقام","منظومة دعم","= نمو مدروس"]},"id":"a12s9","note":"⏱ 1 د. انتقل إلى تمرين الخطة الشخصية، ثم الفصل الخاص بالذكاء الاصطناعي."}],"exercises":[{"id":"a12e1","title":"أين يقف مشروعك؟","icon":"🧭","mode":"individual","format":"mcq","steps":[],"items":[{"q":"متجر يبيع عبر إنستغرام فقط ويسجل الطلبات يدويًا ويريد إثبات أن منتجه مطلوب. في أي مرحلة هو؟","options":["النمو المحلي","التوسع الدولي","التوسع الإقليمي","الانطلاق"],"answer":3},{"q":"أي هدف مكتوب بصيغة ذكية؟","options":["«سنكون الأفضل في السوق»","«زيادة المبيعات قريبًا»","«نريد أن نكبر كثيرًا»","«رفع المبيعات الخليجية من 10% إلى 30% خلال 12 شهرًا»"],"answer":3},{"q":"أي مؤشر يُعد قياديًا لسوق جديد؟","options":["الإيرادات السنوية من السوق","الزيارات ومعدل التحويل من السوق الجديد في الأسابيع الأولى","عدد الموظفين","صافي الربح السنوي"],"answer":1},{"q":"متجر لديه عمليات فوضوية ويريد تمويلًا كبيرًا للتوسع الدولي فورًا. ما النصيحة الأنسب؟","options":["الحصول على التمويل وفتح خمسة أسواق","تنظيم العمليات وكتابة خطة بأرقام قبل طلب تمويل التوسع","تجاهل العمليات","إيقاف المتجر"],"answer":1},{"q":"علامة قطرية تريد معلومات عن أسواق التصدير والمعارض الخارجية. أي جهة ضمن منظومة بنك قطر للتنمية ترتبط بذلك؟","options":["شركة الشحن","برنامج الاحتضان فقط","وكالة تنمية الصادرات «تصدير»","بوابة الدفع"],"answer":2},{"q":"كيف تختار بين السعودية والإمارات كسوق أول؟","options":["بالسوق الذي يعمل فيه أكبر منافس","حسب الانطباع الشخصي","بمصفوفة موزونة تشمل الطلب وسهولة الدخول والبنية التحتية والمنافسة","بالسوق الأبعد"],"answer":2},{"q":"كم مرة يُفضل مراجعة خطة النمو؟","options":["لا حاجة للمراجعة","كل ربع سنة مع تعديلها حسب النتائج","مرة كل خمس سنوات","عند الأزمات فقط"],"answer":1},{"q":"ما المصدر الأدق لشروط برامج دعم بنك قطر للتنمية؟","options":["التخمين","الموقع الرسمي للبنك وقنواته أو فريقه مباشرة","منشورات قديمة على وسائل التواصل","رأي صديق"],"answer":1},{"q":"ما الذي يرفع جاهزية المشروع للتقديم على برامج الدعم؟","options":["خطة نمو مكتوبة بأرقام ومؤشرات ومسؤوليات","فكرة عامة دون أرقام","عدد المتابعين فقط","شعار جديد"],"answer":0},{"q":"سوق جديد لم يحقق مؤشراته القيادية بعد ستة أشهر. ما الخطوة المنطقية؟","options":["تفعيل الخطة البديلة: تحليل الأسباب ثم التعديل أو التراجع المدروس","مضاعفة الإنفاق دون تحليل","تجاهل الأرقام","فتح سوق آخر فورًا"],"answer":0}],"scenario":"<p>عشرة مواقف عن مراحل النضج واختيار الأسواق وأهداف النمو والدعم.</p>","principle":"قرار النمو الصحيح يبدأ من معرفة المرحلة الحالية وجاهزية الركائز.","hint":"<p>اسأل في كل موقف: ما الذي يجب أن يكون ثابتًا قبل هذه الخطوة؟</p>","why":"يربط مفاهيم التخطيط بمواقف واقعية.","axis":"a12"},{"id":"a12e2","title":"أيهما أدق؟","icon":"🔍","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"نتوسع لسوق واحد جديد بتجربة ومؤشرات.","b":"نتوسع لكل أسواق الخليج في الشهر نفسه.","answer":"a"},{"a":"نربط كل هدف بمسؤول وميزانية وموعد.","b":"نكتب الأهداف ونترك التنفيذ للظروف.","answer":"a"},{"a":"نطلب التمويل قبل تنظيم العمليات.","b":"ننظم العمليات ثم نطلب تمويلًا للتوسع.","answer":"b"},{"a":"نراجع الخطة كل ربع سنة.","b":"نراجع الخطة في نهاية كل سنتين.","answer":"a"},{"a":"نختار السوق بمعايير موزونة.","b":"نختار السوق الذي سمعنا أنه مربح.","answer":"b"},{"a":"نتعرف على برامج الدعم مبكرًا ونخطط لها.","b":"نبحث عن الدعم عندما نقع في أزمة.","answer":"a"},{"a":"نقيس المؤشرات القيادية لنتنبأ بالنتائج.","b":"ننتظر الإيرادات السنوية لنعرف إن كنا على المسار.","answer":"a"},{"a":"نعرف مرحلتنا الحالية قبل القفز للتالية.","b":"نقفز للتوسع الدولي لأن المنافس فعل ذلك.","answer":"a"},{"a":"نعد خطة بديلة لسوق لا يحقق أهدافه.","b":"نفترض أن كل سوق جديد سينجح حتمًا.","answer":"a"},{"a":"نتحقق من شروط برامج الدعم من مصادرها الرسمية.","b":"نعتمد على معلومات متداولة دون تحقق.","answer":"a"}],"principle":"خطة النمو الجيدة واقعية ومقاسة ومرحلية.","hint":"<p>اختاروا العبارة التي تمثل التخطيط الأصح للنمو.</p>","why":"يفتح نقاشًا جماعيًا حول أولويات النمو.","axis":"a12"},{"id":"a12e3","title":"خطة نمو مشروعك في صفحة","icon":"🚀","mode":"individual","format":"text","steps":["حدد مرحلتك الحالية.","اكتب هدفًا ذكيًا لـ 12 شهرًا.","اكتب إجراءً رئيسيًا لكل ركيزة من الركائز الخمس.","حدد برنامج دعم واحدًا قد يناسبك ولماذا."],"scenario":"<p>هذا التمرين هو خلاصة البرنامج. طبقه على مشروعك (أو مشروع تعرفه جيدًا).</p>","principle":"الخطة المكتوبة بأرقام ومسؤوليات هي ما يحول التعلم إلى نمو فعلي.","task":"<p>اكتب: (1) مرحلتك الحالية، (2) هدفك الذكي لـ 12 شهرًا، (3) إجراءً رئيسيًا لكل ركيزة: القنوات، الدفع، التنفيذ، التسويق، العمليات والبيانات، (4) مؤشرين قياديين، (5) نوع الدعم الذي قد يناسبك من منظومة بنك قطر للتنمية ولماذا.</p>","why":"يجمع كل محاور البرنامج في وثيقة واحدة قابلة للتنفيذ بعد انتهاء الورشة.","model":"<p>مثال من مجال مختلف: مركز تدريب لغات — المرحلة: التأسيس. الهدف: 40% من الإيرادات من الدورات الإلكترونية خلال 12 شهرًا. القنوات: منصة حجز ودفع مع إعلانات بحث. العمليات: أتمتة التذكير والشهادات. المؤشر القيادي: عدد التسجيلات التجريبية الأسبوعية. الدعم: استشارات تطوير الأعمال. طبّق الطريقة نفسها على مشروعك.</p>","axis":"a12"},{"id":"a12e4","title":"صح أم خطأ: النمو والدعم","icon":"✅","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"معرفة مرحلة نضج المتجر تساعد على تجنب القفز لمرحلة غير جاهز لها.","answer":true},{"q":"التمويل يعالج تلقائيًا مشكلات العمليات الفوضوية.","answer":false},{"q":"المؤشرات القيادية تساعد على التنبؤ بالنتائج قبل ظهورها.","answer":true},{"q":"الهدف «نريد النمو» هدف ذكي قابل للقياس.","answer":false},{"q":"وكالة «تصدير» ترتبط بدعم وصول المنتجات القطرية للأسواق الخارجية.","answer":true},{"q":"شروط برامج الدعم ثابتة لا تتغير أبدًا.","answer":false},{"q":"المصفوفة الموزونة تصلح لاختيار السوق كما تصلح لاختيار المنصة.","answer":true},{"q":"الخطة البديلة غير ضرورية إذا كانت الخطة الأساسية جيدة.","answer":false},{"q":"خطة النمو المكتوبة بأرقام ترفع جاهزية المشروع للتقديم على برامج الدعم.","answer":true},{"q":"التوسع المرحلي سوقًا بعد سوق يقلل المخاطر.","answer":true}],"principle":"النمو المستدام مرحلي ومقاس ومدعوم بالتخطيط.","hint":"<p>انتبه للعبارات التي تتجاوز المراحل أو تتجاهل القياس.</p>","why":"يختبر فهمك لأسس التخطيط للنمو.","axis":"a12"}],"highlights":["مراحل نضج المتجر الإلكتروني","اختيار السوق الدولي التالي بمعايير واضحة","خطة نمو من خمس ركائز","الأهداف والمؤشرات والمراجعة الدورية","منظومة دعم بنك قطر للتنمية"],"unit":6,"icon":"rocket","color":11,"scene":"target","title":"خطة النمو ومنظومة الدعم","classic":"بناء خطة نمو قابلة للتوسع في أسواق التجارة الإلكترونية الدولية، والاستفادة من برامج بنك قطر للتنمية للتمكين الرقمي والدعم والخدمات","duration":"25 دقيقة","desc":"<p>بعد أن فهمنا المنصات والدفع والتوصيل والتسويق والعمليات والبيانات، نجمع كل ذلك في خطة نمو واحدة: إلى أين نتوسع؟ بأي ترتيب؟ بأي موارد؟ ونتعرف على منظومة الدعم التي يقدمها بنك قطر للتنمية للمشاريع الصغيرة والمتوسطة في رحلتها الرقمية والتصديرية.</p>","outcome":"يكتب خطة نمو من خمس ركائز بأهداف ذكية ويحدد برنامج الدعم المناسب من منظومة بنك قطر للتنمية."},{"id":"a13","slides":[{"type":"opening","title":"سرعة الآلة وحكم الإنسان","text":"<p>يستطيع المساعد الذكي أن يكتب عشرين وصف منتج في دقائق، ويلخص ألف تقييم في فقرة، ويقترح عشرة عناوين إعلانية. لكنه لا يعرف مخزونك الحقيقي، ولا يتحمل مسؤولية معلومة خاطئة عن مكونات منتج، ولا يفهم عميلك كما تفهمه أنت.</p>","rule":"<p>استخدم الذكاء الاصطناعي لتسريع العمل، واحتفظ بالحكم والمسؤولية لنفسك.</p>","chart":{"kind":"compare","items":["🤖 الذكاء الاصطناعي :: سرعة في الإنتاج ; تلخيص وتحليل ; اقتراح بدائل ; يعمل على مدار الساعة","🧑‍💼 المتخصص البشري :: فهم السياق والعميل ; التحقق والدقة ; القرار والمسؤولية ; الأخلاقيات والعلاقة"]},"id":"a13s1","note":"⏱ 1 د. اسأل: «من استخدم مساعدًا ذكيًا في عمله هذا الشهر؟»."},{"type":"principle","title":"أين يضيف الذكاء الاصطناعي قيمة في المتجر؟","points":["المنصة والكتالوج: صياغة أوصاف المنتجات وترجمتها، واقتراح التصنيفات والخصائص.","الدفع والأمان: أنظمة كشف الاحتيال لدى مزودي الدفع تعتمد على نماذج ذكية لتقييم المخاطر.","اللوجستيات: توقع الطلب لتخطيط المخزون، واقتراح نقاط إعادة الطلب.","التسويق: أفكار محتوى، ونسخ إعلانية متعددة للاختبار، وتقسيم العملاء.","العمليات: مساعد دردشة للأسئلة الشائعة، وتلخيص رسائل العملاء، وكتابة مسودات الإجراءات.","التحليل: تلخيص التقييمات، واكتشاف الأنماط، وشرح التقارير بلغة بسيطة."],"intro":"<p>في كل مرحلة من مراحل البرنامج توجد استخدامات عملية:</p>","rule":"<p>ابدأ بمهمة واحدة متكررة تستهلك وقتك، وجرّب عليها المساعد الذكي.</p>","chart":{"kind":"steps","items":["الكتالوج::أوصاف وترجمة","الأمان::كشف الاحتيال","اللوجستيات::توقع الطلب","التسويق::محتوى وتقسيم","العمليات::دردشة ذكية","التحليل::تلخيص وأنماط"]},"id":"a13s2","note":"⏱ 2 د. اختر استخدامًا واحدًا لكل وحدة."},{"type":"tools","title":"أدوات ومنصات الذكاء الاصطناعي وتطبيقاتها","items":["المساعدات العامة (مثل Claude وChatGPT وGemini)::كتابة الأوصاف، والردود، والأفكار، وتحليل النصوص والتقييمات.","الذكاء المدمج في منصات المتاجر::مثل Shopify Magic وأدوات مشابهة لكتابة الأوصاف والرسائل داخل لوحة التحكم.","أدوات الصور::إزالة الخلفيات، وتحسين الإضاءة، وإنشاء خلفيات استخدام للمنتجات.","مساعدات خدمة العملاء::روبوتات دردشة مدربة على أسئلتك الشائعة وسياساتك، مع تحويل لموظف.","أدوات الإعلانات::الحملات الآلية في Meta وGoogle تستخدم التعلم الآلي لتوزيع الميزانية والاستهداف.","أدوات التحليل::ملخصات ذكية للتقارير وتوقعات المبيعات في منصات التحليل."],"rule":"<p>الأداة تتغير بسرعة، لكن المهارة ثابتة: طلب واضح، ومراجعة دقيقة، وقرار بشري.</p>","id":"a13s3","note":"⏱ 1 د. مرور سريع دون ترويج لأداة بعينها."},{"type":"principle","title":"كيف تكتب طلبًا جيدًا للمساعد الذكي؟","points":["الدور والسياق: «أنت كاتب محتوى لمتجر قطري لبيع العطور الشرقية الفاخرة».","المهمة: «اكتب وصفًا لمنتج عطر عود 100 مل».","المعلومات الحقيقية: المكونات، والحجم، والثبات، وما يميزه؛ لا تتركه يخترعها.","الجمهور والنبرة: «لعملاء في الخليج، بنبرة راقية وواضحة».","الشكل: «عنوان + 5 نقاط تبدأ بالفائدة + فقرة وصف قصيرة».","القيود: «لا تذكر ادعاءات صحية، ولا معلومات غير موجودة في البيانات»."],"intro":"<p>جودة النتيجة تعتمد على جودة الطلب. عناصر الطلب الجيد:</p>","rule":"<p>أعطه الحقائق، واطلب منه الصياغة؛ لا تطلب منه الحقائق.</p>","chart":{"kind":"equation","items":["دور وسياق","مهمة واضحة","معلومات حقيقية","شكل وقيود","= نتيجة قابلة للاستخدام"]},"id":"a13s4","note":"⏱ 2 د. نفذ مثالًا حيًا لطلب جيد أمام القاعة إن توفر اتصال."},{"type":"mistakes","title":"متى لا يصح الاعتماد الكلي على الذكاء الاصطناعي؟","items":["نشر الأوصاف دون مراجعة::قد يخترع مكونات أو مقاسات أو ادعاءات غير صحيحة؛ راجع كل معلومة قبل النشر.","ترك قرارات التسعير والتمويل له وحده::استخدمه للتحليل والاقتراح، والقرار لمن يعرف التكاليف والسوق ويتحمل النتيجة.","إدخال بيانات العملاء الشخصية في أدوات عامة::احمِ خصوصية العملاء، واستخدم أدوات معتمدة بسياسات بيانات واضحة.","روبوت دردشة بلا مخرج بشري::العميل الغاضب أو الحالة المعقدة يحتاج إنسانًا فورًا.","الاعتماد عليه في الأمور القانونية والجمركية::القواعد تتغير وتختلف بين الدول؛ تحقق من المصادر الرسمية والمختصين.","محتوى متشابه بلا هوية::أضف صوت علامتك وتجاربك الحقيقية حتى لا يبدو متجرك نسخة من غيره."],"id":"a13s5","note":"⏱ 2 د. شدد على المراجعة قبل النشر وحماية بيانات العملاء."},{"type":"principle","title":"متى يأتي دور المتخصص البشري؟","points":["التحقق: صحة المعلومات عن المنتج والسياسات والأسعار.","الحكم: الموازنة بين الربح والعلاقة مع العميل والسمعة.","المسؤولية: القرار المالي والقانوني والأخلاقي.","التعاطف: التعامل مع العميل المتضرر أو الشكوى الحساسة.","الإبداع الأصيل: قصة العلامة وهويتها وما يميزها."],"intro":"<p>هناك مساحات يبقى فيها الإنسان صاحب القرار حتى مع أفضل الأدوات:</p>","rule":"<p>كلما زاد أثر القرار على العميل أو المال أو السمعة، زادت ضرورة المراجعة البشرية.</p>","chart":{"kind":"balance","items":["سرعة الآلة وقدرتها","حكم الإنسان ومسؤوليته"]},"id":"a13s6","note":"⏱ 1 د. الرسالة: المسؤولية تبقى على التاجر."},{"type":"summary","title":"الذكاء الاصطناعي في منظومة المتجر","text":"<p>الذكاء الاصطناعي يسرّع الكتابة والتحليل والخدمة في كل مراحل المتجر، بشرط طلب واضح بمعلومات حقيقية، ومراجعة دقيقة، وقرار بشري في كل ما يمس العميل أو المال أو السمعة.</p>","rule":"<p>اسأل بوضوح، تحقّق بدقة، وقرّر بنفسك.</p>","chart":{"kind":"cycle","items":["اسأل","ولّد","تحقّق","اختبر","قِس","قرّر"]},"id":"a13s7","note":"⏱ 1 د. انتقل إلى المختبر الختامي وقسّم المجموعات."}],"exercises":[{"id":"a13e1","title":"طلب ذكي لوصف منتج","icon":"🤖","mode":"individual","format":"text","steps":["حدد الدور والسياق والجمهور.","اكتب الحقائق كما هي دون مبالغة.","حدد الشكل المطلوب والقيود."],"scenario":"<p>لديك منتج حقيقي أو افتراضي: «ترمس قهوة عربية ستانلس ستيل، 1 لتر، يحفظ الحرارة 12 ساعة، لونان: أسود وذهبي، مناسب للمجالس والرحلات».</p>","principle":"الطلب الجيد يعطي المساعد الذكي الحقائق والسياق والشكل والقيود، ويطلب منه الصياغة فقط.","task":"<p>اكتب الطلب الكامل الذي سترسله للمساعد الذكي لكتابة قائمة هذا المنتج (عنوان + 5 نقاط + وصف)، ثم اكتب نقطتين ستتحقق منهما بنفسك قبل النشر.</p>","why":"يدربك على أهم مهارة في استخدام الذكاء الاصطناعي: الطلب الواضح والمراجعة المسؤولة.","model":"<p>مثال من مجال مختلف: «أنت كاتب محتوى لمخبز قطري. اكتب وصفًا لكعكة التمر بالهيل: المكونات (تمر، دقيق قمح، هيل، زبدة)، الوزن 800 غ، تكفي 8 أشخاص. النبرة: دافئة ومحلية. الشكل: عنوان وثلاث نقاط. لا تذكر أنها صحية أو خالية من السكر». طبّق الطريقة نفسها على الترمس.</p>","axis":"a13"},{"id":"a13e2","title":"اختر الاستخدام الأنسب","icon":"🧰","mode":"individual","format":"mcq","steps":[],"items":[{"q":"لديك 800 تقييم للعملاء. ما الاستخدام الأنسب؟","options":["حذف التقييمات السلبية","كتابة تقييمات جديدة","تجاهلها","تلخيص أبرز الإيجابيات والشكاوى المتكررة ثم مراجعتها"],"answer":3},{"q":"تريد وصفًا لمنتج جديد. ما الطريقة الأصح؟","options":["أنسخ وصف منافس","أنشر أول نتيجة دون قراءة","أطلب منه اختراع المواصفات","أعطيه المواصفات الحقيقية وأطلب الصياغة ثم أراجعها"],"answer":3},{"q":"عميل غاضب لأن طلبه وصل تالفًا. من يتولى المحادثة؟","options":["لا أحد","رد آلي عام","روبوت الدردشة وحده","موظف بشري بعد تحويل سريع من الروبوت"],"answer":3},{"q":"أي بيانات يجب ألا تُدخلها في أداة ذكاء اصطناعي عامة دون سياسة واضحة؟","options":["عناوين إعلانية","وصف منتج","أفكار منشورات","بيانات العملاء الشخصية وأرقام هواتفهم وعناوينهم"],"answer":3},{"q":"تريد 10 نسخ إعلانية مختلفة لاختبارها. هل يناسب الذكاء الاصطناعي؟","options":["نعم، لتوليد البدائل ثم تختار وتختبر وتقيس","لا أبدًا","فقط للإعلانات الإنجليزية","نعم، وينشرها وحده دون مراجعة"],"answer":0},{"q":"سألت المساعد عن نسبة الرسوم الجمركية لمنتجك في دولة معينة. ما الخطوة التالية؟","options":["اعتماد الرقم فورًا","تجاهل الرسوم","التحقق من المصدر الرسمي أو المخلص الجمركي","نشره للعملاء"],"answer":2},{"q":"أي مهمة مناسبة لروبوت دردشة في المتجر؟","options":["التفاوض على الأسعار مع الموردين","تحديد الرواتب","الإجابة عن أسئلة الشحن والاسترجاع الشائعة على مدار الساعة","اتخاذ قرار الاسترداد في الحالات المعقدة"],"answer":2},{"q":"ما دور الذكاء الاصطناعي في تخطيط المخزون؟","options":["يلغي الحاجة للبيانات","يساعد على توقع الطلب واقتراح الكميات، والقرار للمسؤول","يطلب البضاعة وحده دون مراجعة","لا علاقة له بالمخزون"],"answer":1},{"q":"ما أهم عنصر في طلب جيد للمساعد الذكي؟","options":["معلومات حقيقية وسياق واضح وشكل وقيود محددة","كلمات تحفيزية","أن يكون قصيرًا جدًا","أن يكون بالإنجليزية دائمًا"],"answer":0},{"q":"متجرك يستخدم أوصافًا مكتوبة بالذكاء الاصطناعي تتشابه مع كل المنافسين. ما الحل؟","options":["إضافة صوت العلامة وتجارب حقيقية وتفاصيل خاصة بمنتجك","التوقف عن الكتابة","كتابة أوصاف أطول فقط","نسخ أوصاف المنافسين"],"answer":0}],"scenario":"<p>عشرة مواقف. اختر الاستخدام الأنسب والأكثر مسؤولية للذكاء الاصطناعي في كل منها.</p>","principle":"الذكاء الاصطناعي يسرّع المهام، والإنسان يتحقق ويقرر.","hint":"<p>الخيار الأصح يجمع بين الاستفادة من الأداة والمراجعة البشرية.</p>","why":"يرسخ حدود الاستخدام المسؤول.","axis":"a13"},{"id":"a13e3","title":"إنسان أم آلة؟","icon":"🧑‍💼","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"الآلة تلخص التقييمات، والإنسان يقرر ما يُحسّن.","b":"الآلة تلخص التقييمات وتقرر وحدها تغيير المنتج.","answer":"a"},{"a":"الروبوت يرد على الأسئلة الشائعة ويحوّل الشكاوى لموظف.","b":"الروبوت يتولى كل الشكاوى دون أي تحويل.","answer":"a"},{"a":"الآلة تقترح السعر، والمسؤول يقرر بعد مراجعة التكاليف.","b":"الآلة تحدد الأسعار وتغيرها يوميًا دون مراجعة.","answer":"a"},{"a":"ننشر الأوصاف المولدة بعد مراجعة كل معلومة.","b":"ننشر الأوصاف المولدة فورًا لتوفير الوقت.","answer":"a"},{"a":"نعطي المساعد المواصفات الحقيقية ليصيغها.","b":"نطلب من المساعد اختراع مواصفات جذابة.","answer":"a"},{"a":"نتحقق من القواعد الجمركية من المصادر الرسمية.","b":"نعتمد على إجابة المساعد في القواعد الجمركية.","answer":"b"},{"a":"نستخدم أدوات معتمدة لبيانات العملاء بسياسات واضحة.","b":"ندخل قوائم العملاء في أي أداة مجانية.","answer":"a"},{"a":"نضيف صوت علامتنا وتجاربنا على المحتوى المولد.","b":"نكتفي بالمحتوى المولد كما هو دون أي تعديل.","answer":"a"},{"a":"الحملات الآلية توزع الميزانية، والمسوق يراقب الربحية.","b":"الحملات الآلية تُترك دون متابعة للنتائج.","answer":"a"},{"a":"القرار الذي يمس سمعة المتجر يراجعه إنسان.","b":"القرار الذي يمس سمعة المتجر تتخذه الأداة الأسرع.","answer":"a"}],"principle":"توزيع الأدوار بين الإنسان والآلة يحدد جودة النتيجة وأمانها.","hint":"<p>في كل زوج، اختاروا توزيع الأدوار الأصح.</p>","why":"يفتح نقاشًا حول الاستخدام المسؤول للذكاء الاصطناعي في المتجر.","axis":"a13"}],"highlights":["أين يضيف الذكاء الاصطناعي قيمة في رحلة المتجر","أدوات ومنصات وتطبيقاتها العملية","كتابة طلب واضح للمساعد الذكي","متى لا يصح الاعتماد الكلي عليه","دور المتخصص البشري في القرار والمسؤولية"],"unit":7,"icon":"sparkles","color":12,"scene":"ai","title":"مساعد ذكي في متجرك... لا مدير بديل","classic":"الذكاء الاصطناعي في التجارة الإلكترونية: الاستخدامات والأدوات وحدود الاعتماد عليه","duration":"10 دقائق","desc":"<p>الذكاء الاصطناعي أصبح جزءًا من أدوات صاحب المتجر اليومية: يكتب الأوصاف، ويحلل التقييمات، ويرد على الأسئلة، ويقترح المنتجات. لكن قيمته الحقيقية تظهر عندما نعرف أين نستخدمه، وأين نتحقق منه، وأين يبقى القرار بشريًا.</p>","outcome":"يكتب طلبًا فعالًا للمساعد الذكي ويحدد متى تبقى المراجعة والقرار بشريين."}],"activities":[{"id":"act1","kind":"activity","format":"text","steps":[],"title":"آخر عملية شراء أونلاين","icon":"🛍️","mode":"individual","scenario":"<p>كلنا مشترون قبل أن نكون أصحاب متاجر. تذكّر آخر عملية شراء أتممتها عبر الإنترنت، أو آخر مرة تركت فيها سلة دون إتمام.</p>","task":"<p>اكتب في سطرين: ماذا اشتريت أو كدت تشتري؟ وما اللحظة التي جعلتك تكمل الشراء أو تتركه؟</p>","model":"<p>مثال: «كنت أشتري حذاءً رياضيًا، وتركت السلة عندما ظهرت رسوم الشحن في آخر خطوة». اكتب موقفك أنت بالطريقة نفسها.</p>"},{"id":"act2","kind":"activity","format":"text","steps":[],"title":"متجرك في ثلاث كلمات","icon":"🏪","mode":"individual","scenario":"<p>كل متجر ناجح يمكن وصفه بكلمات قليلة يعرفها عملاؤه. فكّر في مشروعك الحالي أو المشروع الذي تحلم بإطلاقه.</p>","task":"<p>اكتب اسم مشروعك (أو فكرته)، ثم صفه في ثلاث كلمات فقط، وحدد عميله الأول في جملة واحدة.</p>","model":"<p>مثال: «مقهى متنقل — أصيل، سريع، دافئ. عميله الأول: موظفو المكاتب في لوسيل صباحًا». اكتب مشروعك بالطريقة نفسها.</p>"},{"id":"act3","kind":"activity","format":"text","steps":[],"title":"توقّع الرقم","icon":"🎯","mode":"individual","scenario":"<p>من كل 100 عميل يضيفون منتجًا إلى السلة في المتاجر الإلكترونية حول العالم، كم عميلًا تتوقع أنه يغادر دون إتمام الشراء؟</p>","task":"<p>اكتب توقعك برقم واحد، وسببًا واحدًا تعتقد أنه الأكثر تأثيرًا في هذا الرقم.</p>","model":"<p>فكّر في نفسك: كم مرة أضفت منتجًا للسلة ثم تركته؟ سنتعرف على ما تشير إليه الدراسات في محور الدفع وإتمام الشراء.</p>"}],"survey":{"id":"survey","kind":"survey","format":"text","mode":"individual","steps":[],"title":"تقييم البرنامج بعد التدريب","icon":"💬","task":"<p>شاركنا رأيك بصراحة: ما الفكرة التي ستطبقها أولًا في مشروعك؟ وما الذي تقترح إضافته أو تحسينه في البرامج القادمة؟</p>","rates":["المدرب: المعرفة وأسلوب التقديم","المحتوى: الوضوح والتنظيم","الفائدة العملية لمشروعي","التمارين والمحاكيات التفاعلية","ارتباط المحتوى بالسوق القطري والخليجي","المنصة التفاعلية وسهولة استخدامها","التنظيم وإدارة الوقت"],"nps":"ما مدى احتمال أن توصي بهذا البرنامج لزميل أو صاحب مشروع؟"},"lab":{"stages":[{"icon":"🏬","title":"المنصة والقنوات","task":"هل تبقى «دار المسك» على منصتها الحالية أم تنتقل؟ حددوا ثلاثة معايير موزونة للقرار، والقنوات التي ستبيع عليها خلال 12 شهرًا (متجر خاص، أسواق إلكترونية، قنوات اجتماعية) مع ترتيب دخولها."},{"icon":"💳","title":"الدفع وإتمام الشراء","task":"صمموا تجربة الدفع الجديدة: وسائل الدفع المطلوبة للسوق القطري والخليجي، معالجة شكوى تكلفة الشحن، إجراءان لرفع نسبة الإتمام من بدء الدفع، وعنصران للأمان والثقة."},{"icon":"🚚","title":"التنفيذ والشحن عبر الحدود","task":"اختاروا نموذج التنفيذ داخل قطر وللخليج، وقرار DDP أو DAP للسعودية والكويت، والمستندات والقيود الخاصة بشحن العطور، ومسار المرتجعات."},{"icon":"📣","title":"التسويق والعملاء","task":"ابنوا مزيج التسويق: قناتان للاستقطاب مع رسالة لكل منهما، وثلاث رسائل آلية للعملاء الحاليين، وتكلفة استحواذ مستهدفة مقارنة بالقيمة الدائمة المتوقعة للعميل."},{"icon":"⚙️","title":"الأتمتة والإجراءات","task":"حددوا ثلاث أتمتات بصيغة (المحفز / الشرط / الإجراء) لحل مشكلة «لا أحد يرد على واتساب» والتأخير، وإجراءً قياسيًا واحدًا يجب كتابته أولًا، ومؤشرين للسيطرة على العمليات."},{"icon":"📊","title":"البيانات وخطة النمو والدعم","task":"احسبوا نسب القمع وحددوا أكبر تسرب، واكتبوا هدفًا ذكيًا لـ 12 شهرًا، ومؤشرين قياديين، ونوع الدعم المناسب من منظومة بنك قطر للتنمية، ثم ملخص العرض النهائي في 5 نقاط (العرض 5 دقائق لكل مجموعة)."}],"title":"مختبر «دار المسك» للنمو الرقمي","intro":"<p>«دار المسك» علامة قطرية ناشئة للعطور الشرقية والبخور، تبيع حاليًا عبر إنستغرام وواتساب ومتجر إلكتروني بسيط، وتريد أن تصبح علامة خليجية خلال سنة. بيانات الشهر الأخير: 25,000 زيارة للمتجر، 9,000 مشاهدة منتج، 1,400 إضافة للسلة، 700 بدء دفع، 280 طلبًا مكتملًا، متوسط الطلب 260 ريالًا. 85% من الطلبات داخل قطر و15% من السعودية والكويت. الدفع: بطاقات ائتمان فقط ودفع عند الاستلام. التوصيل: سائق واحد داخل الدوحة وشركة شحن للخارج. شكاوى متكررة: «ما أعرف كم الشحن للسعودية إلا في آخر خطوة»، «ما في دفع ببطاقة الخصم المحلية»، «الطلب تأخر ولا أحد يرد على واتساب». خلال 36 دقيقة (6 مراحل × 6 دقائق) ستبني مجموعتك خطة نمو متكاملة تغطي محاور البرنامج الستة.</p>","chart":{"kind":"funnel","items":["زيارات::25000","مشاهدة منتج::9000","إضافة للسلة::1400","بدء دفع::700","مكتملة::280"]},"minutes":6},"assessment":{"items":[{"q":"متجر متوسط طلبه 200 ريال. المزود (أ) يأخذ 2.5% + 1 ريال لكل عملية، والمزود (ب) 2% + 2 ريال. ما الاستنتاج الأدق؟","options":["الفرق يظهر فقط عندما تتجاوز قيمة الطلب 500 ريال","المزود (ب) أوفر لأن نسبته المئوية على كل عملية أقل","المزود (أ) أوفر لأن رسمه الثابت لكل عملية أقل بكثير","التكلفة متساوية تقريبًا؛ والحاسم مدة التسوية"],"answer":3},{"q":"منتج يبيع 8 وحدات يوميًا، ومدة توريده 12 يومًا، ومخزون الأمان 24 وحدة. متى تُصدر طلب الشراء التالي؟","options":["عندما يصل المخزون إلى 72 وحدة","عندما يصل المخزون إلى 24 وحدة","عندما يصل المخزون إلى 120 وحدة","عندما يصل المخزون إلى 96 وحدة"],"answer":2},{"q":"معدل التخلي عن السلة 78%، وتسجيلات الجلسات تُظهر أن أغلب المغادرين يغادرون عند ظهور تكلفة الشحن. ما الإجراء الأعلى أثرًا على الأرجح؟","options":["إظهار تكلفة الشحن مبكرًا في السلة","زيادة ميزانية الإعلانات لجلب زوار أكثر","إرسال رسائل تذكير لكل من ترك السلة","إضافة وسيلة دفع جديدة في الخطوة الأخيرة من الدفع"],"answer":0},{"q":"علامة قطرية تشحن عطورًا للسعودية بشروط DAP، ونسبة رفض الطرود عند الباب مرتفعة. ما التفسير والحل الأرجح؟","options":["ارتفاع السعر؛ والحل خفضه للسوق السعودي فقط","ضعف التغليف؛ والحل استخدام عبوات أقوى وأخف وزنًا","طول مدة الشحن؛ والحل التعاقد مع ناقل دولي أسرع","رسوم مفاجئة عند الباب؛ والحل الشحن بشروط DDP"],"answer":3},{"q":"حملة إعلانية حققت عائدًا على الإنفاق (ROAS) يساوي 3، وهامش الربح الإجمالي للمنتج 25%. ما التقييم الأدق؟","options":["خاسرة لأن العائد المقبول يبدأ من 10 فأكثر","رابحة لأن كل ريال إعلان أعاد ثلاثة ريالات","خاسرة في الطلب الأول؛ يحسمها تكرار الشراء","رابحة إذا تجاوز معدل النقر على الإعلان نسبة 2%"],"answer":2},{"q":"متجر فيه 30,000 زيارة شهريًا، ومعدل تحويل 1.5%، ومتوسط طلب 200 ريال. أي تحسين يحقق أكبر زيادة في الإيرادات؟","options":["زيادة الزيارات بنسبة 10%","التحسينات الثلاثة متساوية الأثر تمامًا","رفع معدل التحويل من 1.5% إلى 2%","زيادة متوسط قيمة الطلب بنسبة 10%"],"answer":2},{"q":"مورد مستلزمات يبيع لشركات بأسعار خاصة لكل عميل وبفواتير آجلة، ويتوقع مضاعفة منتجاته 3 مرات خلال سنتين. ما المعيار الأعلى وزنًا في اختيار منصته؟","options":["تنوع القوالب الجاهزة وسهولة تغييرها","التكامل المباشر مع منصات التواصل","انخفاض سعر الاشتراك الشهري للمنصة","خصائص البيع للشركات وقابلية التوسع"],"answer":3},{"q":"متجر يبيع على متجره الخاص وسوقين إلكترونيين، وتتكرر حالات بيع منتجات نفدت. ما الحل الجذري؟","options":["مخزون موحد يتزامن تلقائيًا مع كل القنوات","تحديث المخزون يدويًا مرتين يوميًا","رفع الأسعار في الأسواق لتقليل الطلب عليها","عرض المنتجات الأكثر مبيعًا في قناة واحدة"],"answer":0},{"q":"أي ممارسة تخفف أعباء الامتثال لمعيار أمن بيانات البطاقات (PCI DSS) على متجر صغير أكثر من غيرها؟","options":["طلب رمز التحقق من العميل عبر رسالة نصية","تخزين آخر أربعة أرقام مع تاريخ الانتهاء فقط","تشفير ملف أرقام البطاقات بكلمة مرور قوية","صفحة دفع مستضافة لدى مزود معتمد"],"answer":3},{"q":"صاحب متجر استخدم مساعدًا ذكيًا لكتابة 50 وصف منتج ونشرها مباشرة، ثم تلقى شكاوى عن مكونات غير صحيحة. ما الدرس الأساسي؟","options":["كتابة طلبات أطول وأكثر تفصيلًا للمساعد","الاستغناء عن الذكاء الاصطناعي في كتابة الأوصاف","الاشتراك في أداة ذكاء اصطناعي أغلى وأدق","تزويده بالمواصفات الحقيقية ومراجعة الناتج"],"answer":3}],"title":"التقييم المعرفي القبلي والبعدي","intro":"عشرة أسئلة تقيس معرفتك بمحاور البرنامج. أجب عنها قبل بدء التدريب (التقييم القبلي)، ثم أجب عن الأسئلة نفسها بعد انتهائه (التقييم البعدي) لقياس ما اكتسبته. ترتيب الأسئلة والخيارات يختلف من متدرب لآخر، ولا تُحتسب النتيجة في أي تقييم رسمي، فأجب بما تعرفه دون بحث.","id":"assess"},"stories":[{"id":"st1","numbers":[{"v":"2019","l":"سنة التأسيس"},{"v":"100%","l":"ملكية قطرية"},{"v":"6 أشهر","l":"لاكتساب حصة كبيرة من السوق المحلي"}],"lessons":["ابدأ من مشكلة تعيشها أنت: أفضل الأفكار التجارية تأتي من ألم تشغيلي حقيقي.","التغطية اللوجستية ميزة تنافسية: الوصول إلى حيث لا يصل المنافس يصنع ولاء العملاء والتجار.","وسائل الدفع التي يفضلها العميل (مثل Apple Pay) جزء من تجربة الشراء لا تفصيل تقني.","الشراكة مع الأسواق والتجار المحليين توسّع الشبكة أسرع من العمل منفردًا."],"sources":[{"label":"خبر شراكة أسواق الفرجان ورفيق — بنك قطر للتنمية","url":"https://www.qdb.qa/about/news/news/al-furjan-markets-and-rafeeq"},{"label":"من نحن — رفيق","url":"https://www.gorafeeq.com/en/about-us"},{"label":"رفيق أول شركة توصيل قطرية تطلق Apple Pay — Doha News","url":"https://dohanews.co/rafeeq-the-first-qatari-delivery-company-to-launch-apple-pay/"},{"label":"رفيق وصديق التوصيل في قطر — ILoveQatar","url":"https://www.iloveqatar.net/news/general/rafeeq-best-food-delivery-company-in-doha-qatar"}],"title":"رفيق: صاحب مطعم حوّل مشكلته إلى منصة توصيل قطرية","country":"قطر","flag":"🇶🇦","sector":"التوصيل والتجارة السريعة","year":"2019","axis":"a5","scene":"scooter","color":4,"summary":"صاحب مطاعم قطري لم يجد منصة توصيل تصل إلى المناطق البعيدة، فأسس منصة قطرية بالكامل للتوصيل تحولت إلى تطبيق خدمات متكامل يدعم التجار المحليين.","story":"<p>بدأت القصة من مشكلة تشغيلية يعيشها صاحب مشروع: عبدالله ثامر الحميدي، صاحب عدة مطاعم في قطر لأكثر من عشر سنوات، لم يجد منصة توصيل تغطي المناطق البعيدة عن المركز، فكانت طلبات كثيرة تضيع قبل أن تبدأ.</p><p>بدل انتظار الحل، أسس مع شركائه من أصحاب المطاعم «رفيق» عام 2019 كأول شركة توصيل مملوكة بالكامل لقطريين، بوعد بسيط: التوصيل إلى كل مكان في قطر، مع عمولات منافسة وخدمة عملاء محلية.</p><p>بحسب الشركة، استحوذت خلال ستة أشهر على حصة كبيرة من السوق المحلي من المطاعم والمستخدمين، ثم توسعت من توصيل الطعام إلى البقالة والصيدلية والهدايا والتسوق عبر «رفيق مارت».</p><p>ومن أبرز خطواتها أنها كانت أول شركة توصيل مملوكة لقطريين تطلق الدفع عبر Apple Pay، كما وقعت شراكة مع أسواق الفرجان لدعم أصحاب الأعمال المحليين وتوسيع وصولهم للعملاء في أنحاء الدولة، وهي شراكة نشرها بنك قطر للتنمية ضمن أخباره.</p>","link":"المحور المرتبط: من الرف إلى باب العميل"},{"id":"st2","numbers":[{"v":"2019","l":"سنة التأسيس"},{"v":"2 مليون ريال","l":"صندوق «تمكين» لدعم التجار المحليين"},{"v":"76.56%","l":"حصة استحوذت عليها «جاهز» في 2025"}],"lessons":["السوق الإلكتروني قناة وصول جاهزة للمشروع الصغير: عملاء وتوصيل ودفع في مكان واحد.","أداء المبيعات على المنصة أصبح أصلًا يفتح أبواب التمويل والدعم.","التوسع من خدمة واحدة ناجحة إلى فئات جديدة أسهل من البدء بكل شيء معًا.","العلامة التي تعد بوعد واضح (السرعة والموثوقية) تبني ثقة أسرع."],"sources":[{"label":"تمكين: مليونا ريال من سنونو لدعم نمو الأعمال المحلية — Qatar Living","url":"https://www.qatarliving.com/en/article/tamkeen-qar-2-million-from-snoonu-to-power-local-business-growth"},{"label":"جاهز تستحوذ على 76.56% من سنونو — Wamda","url":"https://www.wamda.com/en/2025/07/jahez-acquires-76-stake-qatar-snoonu-245-million-deal"},{"label":"قصة سنونو ودعم Microsoft Azure — Microsoft Customer Stories","url":"https://www.microsoft.com/en/customers/story/1503821709963374860-snoonu-other-azure-en-qatar"},{"label":"سنونو تطلق منصة للتجارة عبر الحدود — Qatar Living","url":"https://www.qatarliving.com/en/article/snoonu-launches-cross-border-commerce-platform-connecting-regional-brands-with-qatar-consumers"}],"title":"سنونو: من مشروع دراسي إلى سوق رقمي للتجار المحليين","country":"قطر","flag":"🇶🇦","sector":"الأسواق الإلكترونية والتجارة السريعة","year":"2019","axis":"a1","scene":"swallow","color":0,"summary":"تطبيق قطري بدأ كمشروع صف دراسي، فتوسع من توصيل الطعام إلى سوق رقمي شامل وخدمات لوجستية، وأطلق صندوقًا لتمويل نمو التجار المحليين على منصته.","story":"<p>تأسست «سنونو» عام 2019، وتُروى بدايتها كفكرة مشروع دراسي في كلية HEC Paris، واختارت اسمها من طائر السنونو الصغير السريع، تعبيرًا عن وعدها: أن يصل ما تحتاجه في قطر إلى بابك بسرعة وموثوقية.</p><p>بعد نجاحها في توصيل الطعام، تحولت إلى منصة للتجارة السريعة تجمع البقالة والصحة والجمال والتسوق، وأطلقت فئاتها الخاصة، وقدمت خدمة لوجستية للتوصيل للشركات الأخرى كنموذج برمجيات كخدمة.</p><p>بالنسبة للمشاريع الصغيرة، أصبحت سنونو قناة بيع رقمية جاهزة: آلاف المطاعم والمقاهي ومتاجر التجزئة المحلية تبيع عبرها. وفي خطوة لافتة أطلقت «تمكين»: صندوقًا بقيمة مليوني ريال يقدم للتجار الشركاء دفعات نمو بين 5,000 و35,000 ريال حسب أداء مبيعاتهم، بلا فوائد ولا رسوم، تُسترد تدريجيًا خلال ستة أشهر من دورات المدفوعات.</p><p>وفي 2025 أعلنت شركة جاهز السعودية الاستحواذ على 76.56% من سنونو في صفقة قيمتها نحو 245 مليون دولار بحسب Wamda، لتصبح من أبرز قصص التخارج في قطاع التقنية القطري.</p>","link":"المحور المرتبط: أين تفتح متجرك؟ خريطة المنصات"},{"id":"st3","numbers":[{"v":"2016","l":"سنة التأسيس في مكة المكرمة"},{"v":"+55,000","l":"تاجر ومشروع يستخدمون المنصة"},{"v":"+21 مليار ريال","l":"مبيعات تجار المنصة"}],"lessons":["البيع عبر التواصل الاجتماعي بداية ممتازة، لكنه يحتاج نظامًا خلفيًا عندما تكثر الطلبات.","المنصة المصممة للغة العميل وعملته ووسائل دفعه تخفف الاحتكاك وترفع التحويل.","إنشاء المتجر لم يعد يحتاج مطورًا؛ القيمة الحقيقية في التشغيل والتسويق.","حل مشكلة صغيرة متكررة لكثير من الناس قد يصنع شركة كبيرة."],"sources":[{"label":"سلة: منصة مكة التي تسعى لتكون وجهة التجارة الإلكترونية — Entrepreneur Middle East","url":"https://www.entrepreneur.com/en-ae/starting-a-business/saudi-unicorns-how-makkah-based-salla-is-helping-merchants/478045"},{"label":"معلومات رسمية عن سلة","url":"https://salla.com/en/ai-info"},{"label":"سلة ضمن محفظة Investcorp","url":"https://www.investcorp.com/portfolio/salla/"}],"title":"سلة: من أداة لتنظيم طلبات إنستغرام إلى منصة لعشرات آلاف التجار","country":"السعودية","flag":"🇸🇦","sector":"منصات المتاجر الإلكترونية","year":"2016","axis":"a2","scene":"social2store","color":1,"summary":"بدأت في مكة المكرمة كأداة تساعد البائعين على تنظيم طلباتهم عبر وسائل التواصل، وتحولت إلى منصة عربية لإنشاء المتاجر الإلكترونية دون برمجة.","story":"<p>عام 2016 في مكة المكرمة، لاحظ مؤسسو «سلة» أن كثيرًا من البائعين الصغار يبيعون عبر إنستغرام وواتساب، لكن طلباتهم تضيع بين الرسائل ويصعب تتبعها. فكانت البداية أداة بسيطة لأتمتة البيع وتنظيم الطلبات عبر وسائل التواصل.</p><p>مع الوقت، تطورت الأداة إلى منصة متكاملة تتيح إنشاء متجر إلكتروني دون برمجة خلال دقائق، مع حلول مدمجة للدفع والشحن وإدارة المخزون والتسويق، بواجهة عربية وتكاملات مصممة للسوق المحلي.</p><p>بحسب ما نشرته المنصة ومصادر إعلامية، يستخدمها أكثر من 55 ألف فرد وعلامة صغيرة ومتوسطة ومؤسسة، وتجاوزت مبيعات تجارها 21 مليار ريال، وأصبحت من أبرز الشركات الناشئة في السعودية.</p><p>الدرس الأهم لأصحاب المشاريع: الانتقال من «البيع في الرسائل» إلى «متجر منظم» هو ما يسمح للمشروع أن يكبر دون أن تضيع الطلبات.</p>","link":"المحور المرتبط: قرار المنصة ومتجر يُبنى ليكبر"},{"id":"st4","numbers":[{"v":"+120,000","l":"منشأة تخدمها بحسب الشركة"},{"v":"+20,000","l":"منشأة ساعدتها على الدفع الإلكتروني خلال الجائحة"},{"v":"6 دول","l":"تراخيص في دول مجلس التعاون"}],"lessons":["وسائل الدفع المحلية ليست تفصيلًا: غيابها يعني خسارة جزء من العملاء عند صفحة الدفع.","التراخيص والامتثال أساس الثقة في قطاع المدفوعات؛ اختر مزودًا مرخصًا في بلد نشاطك.","الأزمات (مثل الجائحة) تسرّع التحول الرقمي؛ المشروع الجاهز رقميًا يلتقط الفرصة أولًا.","المزود الذي يغطي عدة دول يسهّل التوسع الخليجي لاحقًا."],"sources":[{"label":"تاب تحصل على ترخيص الإمارات وتكمل التغطية الخليجية — FinTech Futures","url":"https://www.fintechfutures.com/regulations-compliance/tap-payments-completes-gcc-regulatory-footprint-with-uae-licence"},{"label":"تاب تساعد 20 ألف منشأة على قبول الدفع الإلكتروني منذ بداية الجائحة — Saudi Gazette","url":"https://saudigazette.com.sa/article/596095"},{"label":"نمو قاعدة عملاء تاب 60% في عام — Zawya","url":"https://www.zawya.com/en/press-release/tap-payments-grows-client-base-by-60-in-a-year-as-global-firms-seek-to-tap-into-gulfs-29bn-e-commerce-boom-u4vqtpee"}],"title":"تاب للمدفوعات: بوابة جعلت قبول الدفع الإلكتروني في متناول المشاريع الصغيرة","country":"الكويت / الخليج","flag":"🇰🇼","sector":"الدفع الرقمي","year":"2013","axis":"a3","scene":"payments","color":2,"summary":"شركة مدفوعات خليجية انطلقت من الكويت لتسهيل قبول المدفوعات الإلكترونية للمشاريع، وتوسعت حتى حصلت على تراخيص في دول الخليج الست.","story":"<p>انطلقت «تاب» من الكويت (تذكر مصادر مختلفة عام 2013 أو 2014) بهدف تبسيط أصعب خطوة كانت تواجه المشاريع الصغيرة في الخليج: قبول الدفع الإلكتروني بطريقة سهلة وآمنة وبوسائل الدفع المحلية التي يعتادها العميل.</p><p>ركزت الشركة على توحيد وسائل الدفع الإقليمية والعالمية في بوابة واحدة: الشبكات المحلية مثل KNET ومدى وبنفت، إلى جانب البطاقات العالمية والمحافظ الرقمية مثل Apple Pay.</p><p>خلال الجائحة، ساعدت بحسب Saudi Gazette أكثر من 20 ألف منشأة على قبول المدفوعات الإلكترونية، وتقول الشركة اليوم إنها تخدم أكثر من 120 ألف منشأة من المشاريع الصغيرة حتى الكبيرة. وفي 2025 أكملت حصولها على التراخيص التنظيمية في دول مجلس التعاون الست بعد حصولها على ترخيص من مصرف الإمارات المركزي، إلى جانب تصاريحها في السعودية والكويت وقطر والبحرين وعُمان.</p>","link":"المحور المرتبط: كيف يصل المال إلى حسابك؟"},{"id":"st5","numbers":[{"v":"2012","l":"سنة التأسيس في الكويت"},{"v":"180 دولة","l":"نطاق الخدمة في 2022"},{"v":"+10.5 مليون","l":"طرد تم توصيله منذ التأسيس"}],"lessons":["في التجارة عبر الحدود، العميل يشتري «الثقة في وصول الطرد» قبل المنتج نفسه.","التحكم في حلقات السلسلة اللوجستية الحرجة يقلل المفاجآت ويحمي السمعة.","التوسع التدريجي (من 50 دولة إلى 180) أكثر أمانًا من الانتشار دفعة واحدة.","وضوح المسؤولية أمام العميل عند التأخير أو التلف عنصر أساسي في تجربة الشراء الدولية."],"sources":[{"label":"يو باي — ويكيبيديا","url":"https://en.wikipedia.org/wiki/Ubuy"},{"label":"يو باي والشبكة اللوجستية الخفية للتسوق عبر الحدود — Kuwait Times","url":"https://kuwaittimes.com/article/46894/business/ubuy-and-the-hidden-logistics-network-behind-gcc-cross-border-shopping/"},{"label":"يو باي تتوسع إلى 180 دولة — Times Kuwait","url":"https://timeskuwait.com/kuwaits-ubuy-expands-to-180-countries-showcasing-gulfs-global-e-commerce-ambitions/"}],"title":"يو باي: متجر كويتي يوصل المنتجات إلى 180 دولة","country":"الكويت","flag":"🇰🇼","sector":"التجارة عبر الحدود","year":"2012","axis":"a6","scene":"globe","color":5,"summary":"منصة تجارة عبر الحدود انطلقت من الكويت عام 2012، وبنت شبكتها اللوجستية بنفسها حتى وصلت إلى أكثر من 180 دولة.","story":"<p>تأسست «يو باي» في الكويت عام 2012 على يد ضاري العبدالهادي وعبدالوهاب العثمان، بفكرة واضحة: تمكين العملاء من شراء منتجات من الأسواق العالمية دون تعقيدات الشحن والجمارك.</p><p>بدأت كمتجر محلي في الكويت، ووصلت إلى أكثر من 50 دولة بحلول 2014، ثم إلى 180 دولة بحلول 2022، مع شركاء شحن عالميين مثل FedEx وDHL Express.</p><p>ما يميزها بحسب تحليل Kuwait Times أنها بنت الجزء الأوسط من سلسلتها اللوجستية بنفسها بدل استئجاره من موردين متفرقين؛ فالعميل يتعاقد مع يو باي نفسها، وهي المسؤولة أمامه إذا تأخر الطرد أو تلف. وفي 2024 افتتحت أول مستودع لها في ألمانيا لتوسيع شحن المنتجات الأوروبية.</p>","link":"المحور المرتبط: خارج الحدود: الشحن الدولي والشريك المناسب"},{"id":"st6","numbers":[{"v":"2011","l":"سنة التأسيس في دبي"},{"v":"2.5 مليون","l":"أم في مجتمع المنصة (2021)"},{"v":"10×","l":"نمو خلال خمس سنوات"}],"lessons":["التخصص في فئة واحدة وعميل محدد يصنع ميزة يصعب على المتاجر العامة منافستها.","المحتوى والمجتمع يرفعان القيمة الدائمة للعميل ويقللان الاعتماد على الإعلانات.","فهم احتياجات العميل العميقة (هنا: الأمهات) أهم من اتساع الكتالوج.","العلامة القوية المبنية على الثقة أصل يجذب المستثمرين والشركاء."],"sources":[{"label":"مجموعة تمر تستحوذ على حصة الأغلبية في ممز ورلد — Wamda","url":"https://www.wamda.com/2021/06/saudi-arabias-tamer-group-acquired-uae-based-mumzworld"},{"label":"أول استحواذ على شركة تجارة إلكترونية تقودها امرأة في المنطقة — Entrepreneur Middle East","url":"https://mena.entrepreneu const DB = (function () {

      return {

        watch(path, cb) { const ref = db.ref(norm(path)); const fn = s => cb(s.val()); ref.on('value', fn, () => {}); return () => ref.off('value', fn); },
        get(path) { return db.ref(norm(path)).once('value').then(s => s.val()); },
        set(path, v) { return db.ref(norm(path)).set(clean(v)); },
        update(path, obj) { return db.ref(norm(path) || undefined).update(clean(obj)); },
        remove(path) { return db.ref(norm(path)).remove(); },
        push(path, v) { const r = db.ref(norm(path)).push(); return r.set(clean(v)).then(() => r.key); },

  let tree = {};

  const watchers = [];
  const segs = p => norm(p).split('/').filter(Boolean);
  function getAt(p) { let n = tree; for (const s of segs(p)) { if (n == null || typeof n !== 'object') return null; n = n[s]; } return n === undefined ? null : n; }
  function setAt(p, v) {
    const s = segs(p); if (!s.length) { tree = v == null ? {} : clean(v); return; }
    let n = tree; for (let i = 0; i < s.length - 1; i++) { if (n[s[i]] == null || typeof n[s[i]] !== 'object') n[s[i]] = {}; n = n[s[i]]; }
    if (v == null) delete n[s[s.length - 1]]; else n[s[s.length - 1]] = clean(v);

  function related(a, b) { a = norm(a); b = norm(b); return !a || !b || a === b || a.startsWith(b + '/') || b.startsWith(a + '/'); }

  return {
    real: false,
    watch(path, cb) { const w = { path, cb, alive: true }; watchers.push(w); try { cb(clone(getAt(path))); } catch (e) { console.error(e); } return () => { w.alive = false; const i = watchers.indexOf(w); if (i > -1) watchers.splice(i, 1); }; },
    get(path) {
      // قراءة لمرة واحدة: علم بولياني منفصل بدل استدعاء دالة الإلغاء داخل تعريفها (تفادي TDZ)
      return new Promise(res => { let called = false; let un = null; un = this.watch(path, v => { if (called) return; called = true; res(v); if (un) un(); }); if (called && un) un(); });
    },
    set(path, v) { setAt(path, v); persist(); notify(path); return Promise.resolve(); },
    update(path, obj) { const base = norm(path); Object.keys(obj || {}).forEach(k => setAt(base ? base + '/' + k : k, obj[k])); persist(); Object.keys(obj || {}).forEach(k => notify(base ? base + '/' + k : k)); return Promise.resolve(); },
    remove(path) { setAt(path, null); persist(); notify(path); return Promise.resolve(); },
    push(path, v) { const k = genId('k'); return this.set(norm(path) + '/' + k, v).then(() => k); },

})();

// 5) نوافذ داخل الصفحة (بدل alert/confirm/prompt الأصلية) + إشعار سريع
// ---------------------------------------------------------------------
const UI = {
  modal(html, opts = {}) {
    const back = document.createElement('div'); back.className = 'modal-back';
    back.innerHTML = '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog">' + html + '</div>';
    document.body.appendChild(back);
    const close = () => { back.remove(); if (opts.onClose) opts.onClose(); };
    if (!opts.sticky) back.addEventListener('click', e => { if (e.target === back) close(); });
    const api = { el: back.firstChild, close };
    if (opts.onMount) opts.onMount(api);
    return api;
  },
  alert(msg, title = 'تنبيه') {
    return new Promise(res => { const m = UI.modal('<h3>' + h(title) + '</h3><div>' + msg + '</div><div class="actions"><button class="btn btn-primary" data-ok>حسنًا</button></div>', { onClose: res }); $('[data-ok]', m.el).onclick = () => m.close(); });
  },
  confirm(msg, o = {}) {
    return new Promise(res => {
      let done = false; const fin = v => { if (!done) { done = true; res(v); } };
      const m = UI.modal('<h3>' + h(o.title || 'تأكيد') + '</h3><div>' + msg + '</div><div class="actions"><button class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-ok>' + h(o.ok || 'تأكيد') + '</button><button class="btn btn-ghost" data-no>إلغاء</button></div>', { onClose: () => fin(false) });
      $('[data-ok]', m.el).onclick = () => { fin(true); m.close(); };
      $('[data-no]', m.el).onclick = () => m.close();
    });
  },
  prompt(msg, o = {}) {
    return new Promise(res => {
      let done = false; const fin = v => { if (!done) { done = true; res(v); } };
      const m = UI.modal('<h3>' + h(o.title || '') + '</h3><div>' + msg + '</div><div class="field" style="margin-top:12px"><input data-in type="' + (o.type || 'text') + '" inputmode="' + (o.inputmode || 'text') + '" placeholder="' + h(o.placeholder || '') + '" value="' + h(o.value || '') + '"></div><div class="actions"><button class="btn btn-primary" data-ok>' + h(o.ok || 'متابعة') + '</button><button class="btn btn-ghost" data-no>إلغاء</button></div>', { onClose: () => fin(null) });
      const inp = $('[data-in]', m.el); setTimeout(() => inp.focus(), 50);
      const ok = () => { fin(inp.value); m.close(); };
      $('[data-ok]', m.el).onclick = ok; inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
      $('[data-no]', m.el).onclick = () => m.close();
    });
  },
  toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
};

  // ---------- gap (المتوقع مقابل الفعلي) ----------

    body += rect(290, 120, 290, 48, '#1C2340', null, 14) + fo(290, 120, 290, 48, esc(bottom), { color: '#fff', fs: 16, weight: 700 });

  function table(items, c) {

      '<thead><tr>' + head.map(x => '<th style="background:' + c.color + ';color:#fff;padding:10px 12px;text-align:right;font-weight:700">' + esc(x) + '</th>').join('') + '</tr></thead><tbody>' +

  }
  return { render, KINDS, parseItem };
})();

const SurveyStats = {
  of(posts, e) {
    e = e || Content.survey({ all: true }); const rates = (e && e.rates) || []; const list = Object.keys(posts || {}).map(k => posts[k]).filter(Boolean);
    const avgs = rates.map((_, i) => { const v = list.map(p => +((p.ratings || {})[i])).filter(x => x >= 1 && x <= 5); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; });
    const np = list.map(p => p.nps).filter(x => x !== undefined && x !== null && x !== '').map(Number);
    const prom = np.filter(x => x >= 9).length, det = np.filter(x => x <= 6).length;
    const all = avgs.filter(x => x != null); const overall = all.length ? all.reduce((a, b) => a + b, 0) / all.length : null;
    return { n: list.length, rates, avgs, overall, npsN: np.length, prom, pass: np.length - prom - det, det, nps: np.length ? Math.round((prom - det) / np.length * 100) : null, texts: list.filter(p => p.text) };
  }
};

  visible() { return RegFields.all().filter(f => f.visible); },
  // قيمة الحقل لمستخدم: الاسم والمسمى في الجذر، والبقية في f/

    return '<div class="field"><label>' + h(f.label) + req + '</label>' + el + '</div>';
  },
  collect(root, prefix) {

const Progress = {
  exDone(e, uid) {
    const ps = Store.posts[e.id]; if (!ps || !uid) return false;
    if (e.mode === 'group') return Object.keys(ps).some(k => ps[k] && ps[k].members && ps[k].members[uid]);
    if (e.format === 'mcq') { const a = ansList(ps[uid] && ps[uid].answers, e.items.length); return !!ps[uid] && a.every(v => v !== null && v !== ''); }
    return !!ps[uid];
  },
  // يستثني تمامًا: المحاور المخفية، المحاور المعطلة، والتمارين المخفية
  forUser(uid) {
    const axes = Content.eligibleAxes().map(a => {
      const exs = Content.exercisesOf(a.id); const done = exs.filter(e => Progress.exDone(e, uid)).length;
      return { a, total: exs.length, done, pct: exs.length ? done / exs.length : 0 };
    });
    const total = axes.reduce((s, x) => s + x.total, 0), done = axes.reduce((s, x) => s + x.done, 0);
    return { axes, total, done, pct: total ? done / total : 0 };
  },
  achievers() { return Object.keys(Store.users || {}).filter(u => Progress.forUser(u).pct >= BADGE_THRESHOLD).map(u => Object.assign({ uid: u }, Store.users[u])); }
};

// ---------- إعادة رسم تحافظ على المدخلات والتركيز ----------

// ---------- تنسيق نصوص الشرائح تلقائيًا ----------
function boldTerm(text) { // يبرز المصطلح قبل ":" أو "—" تلقائيًا
  const t = String(text || ''); const m = t.match(/^(.{2,70}?)(\s*[:：]\s*|\s+—\s+|\s+-\s+)(.+)$/);
  return m ? '<b>' + h(m[1]) + '</b>' + h(m[2]) + h(m[3]) : h(t);
}

  if (!html) return '';

  const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT); const tn = walker.nextNode();
  if (!tn) return html;

  if (!m || m[1].length < 8) { if (p.firstChild === tn || true) { const b = document.createElement('span'); b.className = 'lede'; tn.parentNode.insertBefore(b, tn); b.appendChild(tn); } return d.innerHTML; }
  const b = document.createElement('span'); b.className = 'lede'; b.textContent = m[1];
  tn.parentNode.insertBefore(b, tn); tn.nodeValue = m[2] + m[3];
  return d.innerHTML;
}
function richHtml(v) { if (!v) return ''; return /<[a-z][\s\S]*>/i.test(v) ? sanitize(v) : h(v).replace(/\n/g, '<br>'); }

  return d.innerHTML;
}

// ---------- الفيديو المضمَّن ----------
function toEmbed(url) {

  if ((m = u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([A-Za-z0-9_-]+)/))) return 'https://drive.google.com/file/d/' + m[1] + '/preview';

}
function homeSectionHtml(sec) {

  if (k === 'assess') { const A = Content.assess(); if (!A.items.length) return ''; return '<section class="section">' + secHead(sec) + '<div class="act-grid">' + assessCardHtml('pre') + assessCardHtml('post') + '</div></section>'; }
  if (k === 'activities') { const acts = Content.activities(); if (!acts.length) return ''; return '<section class="section">' + secHead(sec) + '<div class="act-grid">' + acts.map(e => '<button class="act-card" data-go="ex" data-id="' + h(e.id) + '"><div class="act-ico">' + h(e.icon || '✨') + '</div><div><h3>' + h(e.title) + '</h3><div class="muted" style="font-size:13.5px;font-family:var(--f-ui)">' + h(clip(stripHtml(e.scenario || e.task), 90)) + '</div></div></button>').join('') + '</div></section>'; }
